  <script>
    window.addEventListener('unhandledrejection', function(event) {
      if (event && event.reason && String(event.reason).indexOf('ServiceWorker') !== -1) {
        event.preventDefault();
      }
    });

    (function() {
      try {
        var savedMode = localStorage.getItem('asamblea-dark-mode');
        var dark = savedMode === null ? true : savedMode === 'true';
        if (savedMode === null) {
          localStorage.setItem('asamblea-dark-mode', 'true');
        }
        var docEl = document.documentElement;
        var themeMeta = document.getElementById('theme-color-meta');
        var schemeMeta = document.getElementById('color-scheme-meta');
        if (dark) {
          docEl.classList.add('dark');
          docEl.style.backgroundColor = '#000000';
          docEl.style.colorScheme = 'dark';
          if (themeMeta) themeMeta.setAttribute('content', '#000000');
          if (schemeMeta) schemeMeta.setAttribute('content', 'dark');
        } else {
          docEl.classList.remove('dark');
          docEl.style.backgroundColor = '#F2F2F7';
          docEl.style.colorScheme = 'light';
          if (themeMeta) themeMeta.setAttribute('content', '#F2F2F7');
          if (schemeMeta) schemeMeta.setAttribute('content', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>

  </script>

    html.dark {

    }
    @keyframes slideUp {

      to { transform: translateY(0); }
    }
    @keyframes slideRight {

      to { transform: translateX(0); }

    .animate-fade-in { animation: fadeIn 0.25s ease-out; }

    .animate-slide-right { animation: slideRight 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

    }
    .dark [contenteditable][data-placeholder]:empty:before {

    }

    const formatNoteDate = (timestamp) => {
      if (!timestamp) return '';
      try {
        const d = new Date(timestamp);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('es-ES', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
      } catch (e) {
        return '';
      }
    };

    const SwipeableItem = ({ itemId, openSwipeId, setOpenSwipeId, onArchive, onDelete, isArchived, onClick, children }) => {
      const [offsetX, setOffsetX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const startXRef = useRef(0);
      const startYRef = useRef(0);
      const currentBaseRef = useRef(0);
      const swipedRef = useRef(false);
      const directionLockedRef = useRef(null);
      const ACTION_WIDTH = 152;

      useEffect(() => {
        if (openSwipeId !== itemId && offsetX !== 0) {
          setOffsetX(0);
          currentBaseRef.current = 0;
        }
      }, [openSwipeId, itemId]);

      const beginDrag = (clientX, clientY) => {
        startXRef.current = clientX;
        startYRef.current = clientY;
        currentBaseRef.current = openSwipeId === itemId ? ACTION_WIDTH : 0;
        swipedRef.current = false;
        directionLockedRef.current = null;
        setIsDragging(true);
      };

      const moveDrag = (clientX, clientY) => {
        if (!isDragging) return;
        const dx = clientX - startXRef.current;
        const dy = clientY - startYRef.current;

        if (!directionLockedRef.current) {
          if (Math.abs(dx) > 7 || Math.abs(dy) > 7) {
            directionLockedRef.current = Math.abs(dx) >= Math.abs(dy) ? 'horizontal' : 'vertical';
          }
        }

        if (directionLockedRef.current === 'vertical') return;

        if (Math.abs(dx) > 6) {
          swipedRef.current = true;
        }

        const nextOffset = Math.max(0, Math.min(ACTION_WIDTH + 24, currentBaseRef.current + dx));
        setOffsetX(nextOffset);
      };

      const finishDrag = () => {
        if (!isDragging) return;
        setIsDragging(false);
        if (offsetX > 52) {
          setOffsetX(ACTION_WIDTH);
          currentBaseRef.current = ACTION_WIDTH;
          setOpenSwipeId(itemId);
        } else {
          setOffsetX(0);
          currentBaseRef.current = 0;
          if (openSwipeId === itemId) setOpenSwipeId(null);
        }
      };

      const handleCardClick = () => {
        if (swipedRef.current) {
          swipedRef.current = false;
          return;
        }
        if (offsetX > 0) {
          setOffsetX(0);
          currentBaseRef.current = 0;
          setOpenSwipeId(null);
          return;
        }
        if (openSwipeId && openSwipeId !== itemId) {
          setOpenSwipeId(null);
        }
        if (onClick) onClick();
      };

      return (
        <div className="relative overflow-hidden rounded-[16px] select-none">
          <div
            className="absolute inset-y-0 left-0 flex items-stretch overflow-hidden rounded-l-[16px]"
            style={{
              width: `${ACTION_WIDTH}px`,
              opacity: offsetX > 2 ? 1 : 0,
              pointerEvents: offsetX > 20 ? 'auto' : 'none',
              transition: isDragging ? 'none' : 'opacity 0.2s ease'
            }}
          >
            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                setOffsetX(0);
                setOpenSwipeId(null);
                onArchive();
              }}
              className="flex-1 bg-[#5856D6] active:bg-[#4745B5] text-white flex flex-col items-center justify-center gap-1 transition-colors"
            >
              <AppleArchiveIcon size={21} />
              <span className="text-[11px] font-semibold tracking-tight">{isArchived ? 'Desarchivar' : 'Archivar'}</span>
            </button>
            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                setOffsetX(0);
                setOpenSwipeId(null);
                onDelete();
              }}
              className="flex-1 bg-[#FF3B30] active:bg-[#D7281E] text-white flex flex-col items-center justify-center gap-1 transition-colors"
            >
              <AppleTrashIcon size={21} />
              <span className="text-[11px] font-semibold tracking-tight">Eliminar</span>
            </button>
          </div>

          <div
            onTouchStart={(e) => beginDrag(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchMove={(e) => moveDrag(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchEnd={finishDrag}
            onMouseDown={(e) => beginDrag(e.clientX, e.clientY)}
            onMouseMove={(e) => moveDrag(e.clientX, e.clientY)}
            onMouseUp={finishDrag}
            onMouseLeave={() => { if (isDragging) finishDrag(); }}
            onClick={handleCardClick}
            style={{
              transform: `translateX(${offsetX}px)`,
              transition: isDragging ? 'none' : 'transform 0.28s cubic-bezier(0.16, 1, 0.3, 1)'
            }}
            className="relative z-10 cursor-pointer"
          >
            {children}
          </div>
        </div>
      );
    };

    const PREFIX_PATTERNS = [

    const renderStyledTitle = (title, accentColor, time) => {
      let matchedPrefix = null;
      for (const prefix of PREFIX_PATTERNS) {
        if (title.startsWith(prefix)) {
          matchedPrefix = prefix;
          break;
        }
      }

      const timePrefix = time ? <span className="font-normal mr-1.5">{time}</span> : null;

      if (matchedPrefix) {
        const rest = title.slice(matchedPrefix.length).trim();
        if (matchedPrefix.toUpperCase() === 'PRODUCCIÓN AUDIOVISUAL:' && rest.includes('|')) {
          const [boldItalicLine, normalLine] = rest.split('|');
          return (
            <span>
              {timePrefix}
              <span style={{ color: accentColor }} className="font-bold tracking-tight">{matchedPrefix.toUpperCase()} </span>
              <span className="block font-bold italic mt-0.5">{boldItalicLine.trim()}</span>
              {normalLine && <span className="block font-normal mt-0.5">{normalLine.trim()}</span>}
            </span>
          );
        }
        return (
          <span>
            {timePrefix}
            <span style={{ color: accentColor }} className="font-bold tracking-tight">{matchedPrefix.toUpperCase()} </span>
            <span className="font-normal">{rest}</span>
          </span>
        );
      }

      return (
        <span>
          {timePrefix}
          <span>{title}</span>
        </span>
      );
    };

    const parseAssemblyPdfText = (pagesLines, fileName, chosenColor) => {
      const allLines = pagesLines.flat().map(l => l.trim()).filter(Boolean);
      const joinedText = allLines.join('\n');

      const hasViernes = /\bViernes\b/i.test(joinedText);
      const hasSabado = /\bS[áa]bado\b/i.test(joinedText);
      const hasDomingo = /\bDomingo\b/i.test(joinedText);
      const isThreeDays = hasViernes && hasSabado && hasDomingo;

      let detectedTitle = '';
      for (let i = 0; i < Math.min(allLines.length, 30); i++) {
        const line = allLines[i];
        const quoteMatch = line.match(/[“"]([^”"]{6,90})[”"]/);
        if (quoteMatch && !/Mateo|Marcos|Lucas|Juan|Salmo|Proverbios|Hechos/i.test(line)) {
          detectedTitle = `"${quoteMatch[1].trim()}"`;
          break;
        }
      }
      if (!detectedTitle) {
        const cleanFile = (fileName || 'Programa de Asamblea').replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim();
        detectedTitle = cleanFile.startsWith('"') ? cleanFile : `"${cleanFile}"`;
      }

      const yearMatch = joinedText.match(/\b(202[4-9]|203[0-5])\b/);
      const detectedYear = yearMatch ? yearMatch[1] : new Date().getFullYear().toString();

      const buildSectionItems = (rawLines, prefix, isRegional) => {
        const items = [];
        let currentSession = null;
        let currentSymposium = null;
        let counter = 1;
        let amAttendanceAdded = false;

        const flushSymposium = () => {
          if (currentSymposium) {
            items.push(currentSymposium);
            currentSymposium = null;
          }
        };

        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i].trim();
          if (!line) continue;

          if (/^Ma[ñn]ana$/i.test(line)) {
            flushSymposium();
            currentSession = 'am';
            items.push({ id: `${prefix}_hdr_am`, title: 'Mañana', type: 'session_header' });
            continue;
          }

          if (/^Tarde$/i.test(line)) {
            flushSymposium();
            if (currentSession === 'am' && !amAttendanceAdded) {
              items.push({ id: `${prefix}_att_am`, title: 'Asistencia (Mañana)', type: 'attendance', hasStream: isRegional });
              amAttendanceAdded = true;
            }
            currentSession = 'pm';
            items.push({ id: `${prefix}_hdr_pm`, title: 'Tarde', type: 'session_header' });
            continue;
          }

          const timeMatch = line.match(/^(\d{1,2}:\d{2})\s+(.*)$/);
          if (timeMatch) {
            flushSymposium();
            if (!currentSession) {
              currentSession = 'am';
              items.push({ id: `${prefix}_hdr_am`, title: 'Mañana', type: 'session_header' });
            }
            const timeStr = timeMatch[1];
            let restTitle = timeMatch[2].trim();

            while (i + 1 < rawLines.length) {
              const nextLine = rawLines[i + 1].trim();
              if (
                !nextLine ||
                /^(\d{1,2}:\d{2})\s+/.test(nextLine) ||
                /^[•·▪-]\s*/.test(nextLine) ||
                /^(Ma[ñn]ana|Tarde|Viernes|S[áa]bado|Domingo|Preguntas de repaso)$/i.test(nextLine)
              ) {
                break;
              }
              restTitle += ' ' + nextLine;
              i++;
            }

            const itemId = `${prefix}_${counter++}`;
            const isMusic = /^(Video musical|M[úu]sica)$/i.test(restTitle);
            const isSong = /^Canci[óo]n\s+\d+/i.test(restTitle);
            const isSymposium = /SERIE DE DISCURSOS:/i.test(restTitle);

            if (isSymposium) {
              currentSymposium = {
                id: itemId,
                time: timeStr,
                title: restTitle,
                type: 'symposium',
                parts: []
              };
            } else {
              items.push({
                id: itemId,
                time: timeStr,
                title: restTitle,
                type: isMusic ? 'music' : isSong ? 'song' : 'talk'
              });

              if (/intermedio/i.test(restTitle) && !amAttendanceAdded) {
                items.push({ id: `${prefix}_att_am`, title: 'Asistencia (Mañana)', type: 'attendance', hasStream: isRegional });
                amAttendanceAdded = true;
              }
            }
            continue;
          }

          const bulletMatch = line.match(/^[•·▪]\s*(.*)$/);
          if (bulletMatch && currentSymposium) {
            let partText = '• ' + bulletMatch[1].trim();
            while (i + 1 < rawLines.length) {
              const nextLine = rawLines[i + 1].trim();
              if (
                !nextLine ||
                /^(\d{1,2}:\d{2})\s+/.test(nextLine) ||
                /^[•·▪]\s*/.test(nextLine) ||
                /^(Ma[ñn]ana|Tarde|Viernes|S[áa]bado|Domingo|Preguntas de repaso)$/i.test(nextLine)
              ) {
                break;
              }
              partText += ' ' + nextLine;
              i++;
            }
            currentSymposium.parts.push({
              id: `${currentSymposium.id}_p${currentSymposium.parts.length + 1}`,
              title: partText
            });
            continue;
          }
        }

        flushSymposium();

        if (!amAttendanceAdded && items.some(it => it.id === `${prefix}_hdr_am`)) {
          items.push({ id: `${prefix}_att_am`, title: 'Asistencia (Mañana)', type: 'attendance', hasStream: isRegional });
        }
        if (items.some(it => it.id === `${prefix}_hdr_pm`)) {
          items.push({ id: `${prefix}_att_pm`, title: 'Asistencia (Tarde)', type: 'attendance', hasStream: isRegional });
        } else if (items.length > 0 && !items.some(it => it.type === 'attendance')) {
          items.push({ id: `${prefix}_att_pm`, title: 'Asistencia (Tarde)', type: 'attendance', hasStream: isRegional });
        }

        return items;
      };

      const progId = `custom_prog_${Date.now()}`;

      if (isThreeDays) {
        const idxV = allLines.findIndex(l => /^Viernes$/i.test(l));
        const idxS = allLines.findIndex(l => /^S[áa]bado$/i.test(l));
        const idxD = allLines.findIndex(l => /^Domingo$/i.test(l));

        const sliceV = idxV !== -1 && idxS !== -1 ? allLines.slice(idxV + 1, idxS) : allLines;
        const sliceS = idxS !== -1 && idxD !== -1 ? allLines.slice(idxS + 1, idxD) : [];
        const sliceD = idxD !== -1 ? allLines.slice(idxD + 1) : [];

        const extractQuote = (arr, fallback) => {
          for (let i = 0; i < Math.min(arr.length, 4); i++) {
            if (/^Ma[ñn]ana$/i.test(arr[i])) break;
            if (arr[i].length > 10) return arr[i];
          }
          return fallback;
        };

        return {
          id: progId,
          title: detectedTitle,
          year: `${detectedYear} (Importado)`,
          days: 3,
          isCustomProgram: true,
          themeColor: chosenColor || '#E5854B',
          dayColors: {
            viernes: chosenColor || '#E5854B',
            sabado: '#87B896',
            domingo: '#6CA6CD'
          },
          quotes: {
            viernes: extractQuote(sliceV, DAY_THEMES.viernes.quote),
            sabado: extractQuote(sliceS, DAY_THEMES.sabado.quote),
            domingo: extractQuote(sliceD, DAY_THEMES.domingo.quote)
          },
          viernes: buildSectionItems(sliceV, `${progId}_v`, true),
          sabado: buildSectionItems(sliceS, `${progId}_s`, true),
          domingo: buildSectionItems(sliceD, `${progId}_d`, true)
        };
      } else {
        const idxRepaso = allLines.findIndex(l => /Preguntas de repaso/i.test(l));
        const mainLines = idxRepaso !== -1 ? allLines.slice(0, idxRepaso) : allLines;
        const repasoLines = idxRepaso !== -1 ? allLines.slice(idxRepaso + 1) : [];

        const repasoItems = [];
        let currentQuestion = null;
        repasoLines.forEach(line => {
          if (/^[1-9]\.\s+/.test(line)) {
            if (currentQuestion) repasoItems.push(currentQuestion);
            currentQuestion = {
              id: `${progId}_rep_${repasoItems.length + 1}`,
              title: line,
              type: 'talk'
            };
          } else if (currentQuestion) {
            currentQuestion.title += ' ' + line;
          }
        });
        if (currentQuestion) repasoItems.push(currentQuestion);

        let mainQuote = detectedTitle;
        for (let i = 0; i < Math.min(mainLines.length, 8); i++) {
          if (/\((Salmo|Sal\.|Proverbios|Prov\.|Mateo|Mat\.|Juan|1\s|2\s)/i.test(mainLines[i])) {
            mainQuote = mainLines[i];
            break;
          }
        }

        return {
          id: progId,
          title: detectedTitle,
          year: `${detectedYear} (Especial / Circuito)`,
          days: 1,
          isCustomProgram: true,
          themeColor: chosenColor || '#D9822B',
          quote: mainQuote,
          programa: buildSectionItems(mainLines, `${progId}_p`, false),
          repaso: repasoItems.length > 0 ? repasoItems : [
            { id: `${progId}_rep_1`, title: '1. ¿Qué puntos destacados aprendimos en el programa de hoy?', type: 'talk' }
          ]
        };
      }
    };

    const RichNoteEditor = ({ id, value, onChange, placeholder, fontSize, isCustomNote = false, refreshTrigger = 0 }) => {
      const mountRef = useRef(null);
      const editorNodeRef = useRef(null);
      const onChangeRef = useRef(onChange);
      onChangeRef.current = onChange;

      const [activeFormats, setActiveFormats] = useState({ bold: false, underline: false });

      const checkActiveFormats = () => {
        if (!editorNodeRef.current) return;
        try {
          const isBold = document.queryCommandState('bold');
          const isUnderline = document.queryCommandState('underline');
          setActiveFormats(prev => (
            prev.bold === isBold && prev.underline === isUnderline
              ? prev
              : { bold: isBold, underline: isUnderline }
          ));
        } catch (e) {}
      };

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        container.innerHTML = '';
        const div = document.createElement('div');
        div.contentEditable = 'true';
        div.setAttribute('data-placeholder', placeholder || '');
        div.className = 'p-4 min-h-[140px] focus:outline-none text-black dark:text-white bg-white dark:bg-[#1C1C1E] leading-relaxed whitespace-pre-wrap break-words';
        div.style.fontSize = `${fontSize}px`;

        const defaultContent = (!value && !isCustomNote && !id.includes('rep')) ? '<b>Orador: </b><br><br>' : (value || '');
        div.innerHTML = value || defaultContent;

        const handleInput = () => {
          if (onChangeRef.current) {
            onChangeRef.current(div.innerHTML);
          }
          checkActiveFormats();
        };

        div.addEventListener('input', handleInput);
        div.addEventListener('keyup', checkActiveFormats);
        div.addEventListener('mouseup', checkActiveFormats);
        div.addEventListener('touchend', checkActiveFormats);
        div.addEventListener('focus', checkActiveFormats);

        container.appendChild(div);
        editorNodeRef.current = div;

        return () => {
          div.removeEventListener('input', handleInput);
          div.removeEventListener('keyup', checkActiveFormats);
          div.removeEventListener('mouseup', checkActiveFormats);
          div.removeEventListener('touchend', checkActiveFormats);
          div.removeEventListener('focus', checkActiveFormats);
        };
      }, [id, refreshTrigger]);

      useEffect(() => {
        if (editorNodeRef.current) {
          editorNodeRef.current.style.fontSize = `${fontSize}px`;
        }
      }, [fontSize]);

      useEffect(() => {
        const handleSelectionChange = () => {
          if (editorNodeRef.current && document.activeElement === editorNodeRef.current) {
            checkActiveFormats();
          }
        };
        document.addEventListener('selectionchange', handleSelectionChange);
        return () => document.removeEventListener('selectionchange', handleSelectionChange);
      }, []);

      const applyFormat = (e, command, arg = null) => {
        e.preventDefault();
        const ed = editorNodeRef.current;
        if (!ed) return;
        try {
          ed.focus();
          document.execCommand(command, false, arg);
          if (onChangeRef.current) {
            onChangeRef.current(ed.innerHTML);
          }
          checkActiveFormats();
        } catch (err) {}
      };

      const insertText = (e, text) => {
        e.preventDefault();
        const ed = editorNodeRef.current;
        if (!ed) return;
        try {
          ed.focus();
          document.execCommand('insertText', false, text);
          if (onChangeRef.current) {
            onChangeRef.current(ed.innerHTML);
          }
        } catch (err) {}
      };

      return (
        <div className="mt-3 rounded-[14px] overflow-hidden border border-[#C6C6C8]/60 dark:border-[#38383A] bg-white dark:bg-[#1C1C1E] shadow-sm transition-colors">
          <div className="flex items-center gap-1.5 px-3 py-2 bg-[#F2F2F7] dark:bg-[#2C2C2E] border-b border-[#C6C6C8]/50 dark:border-[#38383A] overflow-x-auto">
            <button
              type="button"
              onMouseDown={(e) => applyFormat(e, 'bold')}
              aria-pressed={activeFormats.bold}
              className={`w-9 h-8 rounded-[8px] font-bold text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0 ${
                activeFormats.bold
                  ? 'bg-[#007AFF] text-white ring-2 ring-[#007AFF]/30'
                  : 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white'
              }`}
            >
              B
            </button>
            <button
              type="button"
              onMouseDown={(e) => applyFormat(e, 'underline')}
              aria-pressed={activeFormats.underline}
              className={`w-9 h-8 rounded-[8px] underline font-semibold text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0 ${
                activeFormats.underline
                  ? 'bg-[#007AFF] text-white ring-2 ring-[#007AFF]/30'
                  : 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white'
              }`}
            >
              U
            </button>
            <div className="w-px h-5 bg-[#C6C6C8] dark:bg-[#48484A] mx-1 shrink-0"></div>
            <button type="button" onMouseDown={(e) => insertText(e, '\n• ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-black dark:text-white font-bold text-[18px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">•</button>
            <div className="w-px h-5 bg-[#C6C6C8] dark:bg-[#48484A] mx-1 shrink-0"></div>
            <button type="button" onMouseDown={(e) => insertText(e, '💎 ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">💎</button>
            <button type="button" onMouseDown={(e) => insertText(e, '❤️ ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">❤️</button>
            <button type="button" onMouseDown={(e) => insertText(e, '✅ ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">✅</button>
          </div>
          <div ref={mountRef}></div>
        </div>
      );
    };

    const getOrCreateDeviceUser = () => {
      try {
        const savedUser = localStorage.getItem('asamblea-active-user');
        if (savedUser) {
          const parsed = JSON.parse(savedUser);
          if (parsed && parsed.username) return parsed;
        }
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('asamblea-notas-')) {
            const extractedUser = k.replace('asamblea-notas-', '').trim();
            if (extractedUser) {
              const uObj = { username: extractedUser };
              localStorage.setItem('asamblea-active-user', JSON.stringify(uObj));
              return uObj;
            }
          }
        }
        let deviceId = localStorage.getItem('asamblea-device-uid');
        if (!deviceId) {
          const randomPart = Math.random().toString(36).substring(2, 8) + Date.now().toString(36).slice(-4);
          deviceId = `disp_${randomPart}`;
          localStorage.setItem('asamblea-device-uid', deviceId);
        }
        const newObj = { username: deviceId };
        localStorage.setItem('asamblea-active-user', JSON.stringify(newObj));
        return newObj;
      } catch (e) {
        return { username: 'default' };
      }
    };

    const isServiceWorkerSupported = () => {
      try {
        if (!('serviceWorker' in navigator)) return false;
        if (window.location.origin === 'null' || !window.location.origin) return false;
        if (window.location.protocol !== 'https:' && window.location.protocol !== 'http:') return false;
        if (window.location.hostname.includes('usercontent.goog')) return false;
        if (document.URL.startsWith('about:') || document.URL.startsWith('blob:') || document.URL.startsWith('data:')) return false;
        return true;
      } catch (e) {
        return false;
      }
    };

    function App() {
      const rescueAndLoadUserData = (username) => {
        const cleanU = (username || '').trim().toLowerCase();
        let mergedNotes = {};
        let mergedCustomList = [];
        const seenCustomIds = {};

        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!key) continue;

            if (key.startsWith('asamblea-notas-')) {
              try {
                const parsedN = JSON.parse(localStorage.getItem(key) || '{}');
                if (parsedN && typeof parsedN === 'object') {
                  Object.keys(parsedN).forEach(noteKey => {
                    if (parsedN[noteKey] && (!mergedNotes[noteKey] || String(parsedN[noteKey]).length > String(mergedNotes[noteKey]).length)) {
                      mergedNotes[noteKey] = parsedN[noteKey];
                    }
                  });
                }
              } catch (e) {}
            }

            if (key.startsWith('asamblea-custom-list-')) {
              try {
                const parsedL = JSON.parse(localStorage.getItem(key) || '[]');
                if (Array.isArray(parsedL)) {
                  parsedL.forEach(item => {
                    if (item && item.id && !seenCustomIds[item.id]) {
                      seenCustomIds[item.id] = true;
                      mergedCustomList.push(item);
                    }
                  });
                }
              } catch (e) {}
            }
          }

          if (cleanU) {
            const userNotesRaw = localStorage.getItem(`asamblea-notas-${cleanU}`);
            if (userNotesRaw) {
              const userNotes = JSON.parse(userNotesRaw);
              mergedNotes = { ...mergedNotes, ...userNotes };
            }
          }

          Object.keys(mergedNotes).forEach(noteId => {
            if (noteId.startsWith('custom_') && !noteId.startsWith('custom_prog_') && !seenCustomIds[noteId]) {
              seenCustomIds[noteId] = true;
              const timestamp = parseInt(noteId.replace('custom_', ''), 10) || Date.now();
              mergedCustomList.push({
                id: noteId,
                title: 'Nota recuperada',
                createdAt: timestamp
              });
            }
          });

          mergedCustomList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

          if (cleanU) {
            localStorage.setItem(`asamblea-notas-${cleanU}`, JSON.stringify(mergedNotes));
            localStorage.setItem(`asamblea-custom-list-${cleanU}`, JSON.stringify(mergedCustomList));
          }
        } catch (e) {}

        return { notes: mergedNotes, customList: mergedCustomList };
      };

      const [currentUser] = useState(() => getOrCreateDeviceUser());
      const [currentScreen, setCurrentScreen] = useState('notes_home');

      const initialDataRef = useRef(null);
      if (!initialDataRef.current) {
        initialDataRef.current = rescueAndLoadUserData(currentUser?.username || 'default');
      }

      const [activeProgram, setActiveProgram] = useState(null);
      const [previousScreen, setPreviousScreen] = useState('notes_home');
      const [activeTab, setActiveTab] = useState('');
      const [notes, setNotes] = useState(initialDataRef.current.notes);
      const notesRef = useRef(initialDataRef.current.notes);
      const [expandedItems, setExpandedItems] = useState({});
      const [isSaving, setIsSaving] = useState(false);

      const [isDarkMode, setIsDarkMode] = useState(() => {
        try {
          const saved = localStorage.getItem('asamblea-dark-mode');
          return saved === null ? true : saved === 'true';
        } catch (e) {
          return true;
        }
      });

      const [fontSize, setFontSize] = useState(() => {
        try { return parseInt(localStorage.getItem('asamblea-fontsize') || '16', 10); } catch (e) { return 16; }
      });

      const [archivedItems, setArchivedItems] = useState(() => {
        try {
          const u = currentUser?.username || 'default';
          const saved = localStorage.getItem(`asamblea-archived-${u}`);
          return saved ? JSON.parse(saved) : {};
        } catch (e) { return {}; }
      });

      const [deletedItems, setDeletedItems] = useState(() => {
        try {
          const u = currentUser?.username || 'default';
          const saved = localStorage.getItem(`asamblea-deleted-${u}`);
          return saved ? JSON.parse(saved) : {};
        } catch (e) { return {}; }
      });

      const [customNotesList, setCustomNotesList] = useState(initialDataRef.current.customList);

      const [foldersList, setFoldersList] = useState(() => {
        try {
          const u = currentUser?.username || 'default';
          const saved = localStorage.getItem(`asamblea-folders-${u}`);
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [selectedFolderId, setSelectedFolderId] = useState('all');
      const [isFolderModalOpen, setIsFolderModalOpen] = useState(false);
      const [newFolderName, setNewFolderName] = useState('');
      const [newFolderColor, setNewFolderColor] = useState(NOTE_COLORS[0]);
      const [movingNoteObj, setMovingNoteObj] = useState(null);

      const [customProgramsList, setCustomProgramsList] = useState(() => {
        try {
          const u = currentUser?.username || 'default';
          const saved = localStorage.getItem(`asamblea-custom-programs-${u}`);
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [isPdfModalOpen, setIsPdfModalOpen] = useState(false);
      const [pdfColorChoice, setPdfColorChoice] = useState('#E5854B');
      const [isParsingPdf, setIsParsingPdf] = useState(false);

      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [openSwipeId, setOpenSwipeId] = useState(null);
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [toastMessage, setToastMessage] = useState('');
      const [updateAvailable, setUpdateAvailable] = useState(false);
      const [detectedVersion, setDetectedVersion] = useState('');
      const [isUpdatingApp, setIsUpdatingApp] = useState(false);
      const [importVersion, setImportVersion] = useState(0);

      const saveTimeoutRef = useRef(null);
      const fileInputRef = useRef(null);
      const pdfInputRef = useRef(null);
      const waitingWorkerRef = useRef(null);

      const allProgramsDB = [...customProgramsList, ...programsDB];

      useEffect(() => {
        let isMounted = true;

        const checkSwVersionFromFile = async () => {
          if (!isServiceWorkerSupported()) return;
          try {
            const res = await fetch(`./sw.js?t=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) return;
            const txt = await res.text();
            const m = txt.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
            if (m && m[1]) {
              const serverVer = m[1];
              const installedVer = localStorage.getItem('asamblea-installed-sw-version');
              if (!installedVer) {
                localStorage.setItem('asamblea-installed-sw-version', serverVer);
              } else if (installedVer !== serverVer && isMounted) {
                setDetectedVersion(serverVer);
                setUpdateAvailable(true);
              }
            }
          } catch (e) {}
        };

        try {
          if (!isServiceWorkerSupported()) return;
          Promise.resolve(navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }))
            .then(reg => {
              if (!reg) return;
              if (reg.waiting) {
                waitingWorkerRef.current = reg.waiting;
                if (isMounted) setUpdateAvailable(true);
              }

              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      waitingWorkerRef.current = newWorker;
                      if (isMounted) setUpdateAvailable(true);
                    }
                  });
                }
              });

              Promise.resolve(reg.update()).catch(() => {});
            })
            .catch(() => {});
        } catch (e) {}

        checkSwVersionFromFile();

        const handleVisibility = () => {
          if (document.visibilityState === 'visible') {
            checkSwVersionFromFile();
          }
        };

        document.addEventListener('visibilitychange', handleVisibility);
        return () => {
          isMounted = false;
          document.removeEventListener('visibilitychange', handleVisibility);
        };
      }, []);

      const handleInstallUpdate = async () => {
        setIsUpdatingApp(true);
        try {
          if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
          saveNotesNow(notesRef.current);

          if (detectedVersion) {
            localStorage.setItem('asamblea-installed-sw-version', detectedVersion);
          } else {
            try {
              const res = await fetch(`./sw.js?t=${Date.now()}`, { cache: 'no-store' });
              const txt = await res.text();
              const m = txt.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
              if (m && m[1]) localStorage.setItem('asamblea-installed-sw-version', m[1]);
            } catch (e) {}
          }

          if (waitingWorkerRef.current) {
            waitingWorkerRef.current.postMessage({ type: 'SKIP_WAITING' });
          }

          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
        } catch (e) {}

        setTimeout(() => {
          window.location.reload();
        }, 250);
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage('');
        }, 2800);
      };

      const handleExportBackup = () => {
        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        saveNotesNow(notesRef.current);

        const backupPayload = {
          version: 2,
          exportedAt: Date.now(),
          username: currentUser?.username || 'dispositivo',
          notes: notesRef.current,
          customNotesList: customNotesList,
          foldersList: foldersList,
          customProgramsList: customProgramsList,
          archivedPrograms: archivedItems,
          deletedPrograms: deletedItems
        };

        try {
          const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const dateStr = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `Respaldo_Mis_Apuntes_${dateStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setIsDrawerOpen(false);
          showToast('Copia de seguridad descargada');
        } catch (e) {
          showToast('Error al exportar copia');
        }
      };

      const handleImportBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (!data || typeof data !== 'object') {
              showToast('Archivo de respaldo no válido');
              return;
            }

            const u = currentUser?.username || 'default';
            const importedNotes = (data.notes && typeof data.notes === 'object') ? data.notes : {};
            const mergedNotes = { ...notesRef.current, ...importedNotes };

            const existingMap = {};
            customNotesList.forEach(item => {
              if (item && item.id) existingMap[item.id] = item;
            });
            if (Array.isArray(data.customNotesList)) {
              data.customNotesList.forEach(item => {
                if (item && item.id) existingMap[item.id] = item;
              });
            }

            Object.keys(importedNotes).forEach((noteId, idx) => {
              if (noteId.startsWith('custom_') && !noteId.startsWith('custom_prog_') && !existingMap[noteId]) {
                const timestamp = parseInt(noteId.replace('custom_', ''), 10) || Date.now();
                existingMap[noteId] = {
                  id: noteId,
                  title: 'Nota restaurada',
                  createdAt: timestamp,
                  color: NOTE_COLORS[idx % NOTE_COLORS.length]
                };
              }
            });

            const mergedList = Object.values(existingMap).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            const folderMap = {};
            foldersList.forEach(f => { if (f && f.id) folderMap[f.id] = f; });
            if (Array.isArray(data.foldersList)) {
              data.foldersList.forEach(f => { if (f && f.id) folderMap[f.id] = f; });
            }
            const mergedFolders = Object.values(folderMap);

            const customProgMap = {};
            customProgramsList.forEach(p => { if (p && p.id) customProgMap[p.id] = p; });
            if (Array.isArray(data.customProgramsList)) {
              data.customProgramsList.forEach(p => { if (p && p.id) customProgMap[p.id] = p; });
            }
            const mergedCustomProgs = Object.values(customProgMap);

            const nextDeleted = { ...deletedItems };
            if (Array.isArray(data.customNotesList)) {
              data.customNotesList.forEach(item => {
                if (item && item.id) delete nextDeleted[item.id];
              });
            }
            Object.keys(importedNotes).forEach(noteKey => {
              delete nextDeleted[noteKey];
            });
            [...mergedCustomProgs, ...programsDB].forEach(prog => {
              if (!data.deletedPrograms || !data.deletedPrograms[prog.id]) {
                delete nextDeleted[prog.id];
              }
            });

            const nextArch = { ...archivedItems, ...(data.archivedPrograms || {}) };
            if (Array.isArray(data.customNotesList)) {
              data.customNotesList.forEach(item => {
                if (item && item.id && (!data.archivedPrograms || !data.archivedPrograms[item.id])) {
                  delete nextArch[item.id];
                }
              });
            }

            notesRef.current = mergedNotes;
            setNotes(mergedNotes);
            setCustomNotesList(mergedList);
            setFoldersList(mergedFolders);
            setCustomProgramsList(mergedCustomProgs);
            setDeletedItems(nextDeleted);
            setArchivedItems(nextArch);
            setImportVersion(v => v + 1);

            localStorage.setItem(`asamblea-notas-${u}`, JSON.stringify(mergedNotes));
            localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(mergedList));
            localStorage.setItem(`asamblea-folders-${u}`, JSON.stringify(mergedFolders));
            localStorage.setItem(`asamblea-custom-programs-${u}`, JSON.stringify(mergedCustomProgs));
            localStorage.setItem(`asamblea-deleted-${u}`, JSON.stringify(nextDeleted));
            localStorage.setItem(`asamblea-archived-${u}`, JSON.stringify(nextArch));

            setIsDrawerOpen(false);
            showToast('¡Notas restauradas con éxito!');
          } catch (err) {
            showToast('No se pudo leer el archivo');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleCreateFolder = (e) => {
        e.preventDefault();
        const trimmed = newFolderName.trim();
        if (!trimmed) return;
        const u = currentUser?.username || 'default';
        const newFolder = {
          id: `folder_${Date.now()}`,
          name: trimmed,
          color: newFolderColor,
          createdAt: Date.now()
        };
        const updated = [...foldersList, newFolder];
        setFoldersList(updated);
        try { localStorage.setItem(`asamblea-folders-${u}`, JSON.stringify(updated)); } catch (err) {}
        setNewFolderName('');
        setIsFolderModalOpen(false);
        setSelectedFolderId(newFolder.id);
        showToast(`Carpeta "${trimmed}" creada`);
      };

      const handleDeleteFolder = (folderId) => {
        const u = currentUser?.username || 'default';
        const updatedFolders = foldersList.filter(f => f.id !== folderId);
        setFoldersList(updatedFolders);
        const updatedNotes = customNotesList.map(n => n.folderId === folderId ? { ...n, folderId: null } : n);
        setCustomNotesList(updatedNotes);
        if (selectedFolderId === folderId) setSelectedFolderId('all');
        try {
          localStorage.setItem(`asamblea-folders-${u}`, JSON.stringify(updatedFolders));
          localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(updatedNotes));
        } catch (err) {}
        showToast('Carpeta eliminada (notas conservadas)');
      };

      const handleMoveNoteToFolder = (noteId, targetFolderId) => {
        const u = currentUser?.username || 'default';
        const updatedList = customNotesList.map(n =>
          n.id === noteId ? { ...n, folderId: targetFolderId || null } : n
        );
        setCustomNotesList(updatedList);
        try { localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(updatedList)); } catch (err) {}
        setMovingNoteObj(null);
        const folderName = foldersList.find(f => f.id === targetFolderId)?.name;
        showToast(targetFolderId ? `Movida a "${folderName}"` : 'Quitada de la carpeta');
      };

      const handlePdfProgramUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!window.pdfjsLib) {
          showToast('El lector de PDF aún está cargando, intenta de nuevo');
          return;
        }
        setIsParsingPdf(true);
        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const pagesLines = [];

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            const rowsMap = {};

            textContent.items.forEach(item => {
              const str = item.str;
              if (!str || !str.trim()) return;
              const y = Math.round(item.transform[5] / 4) * 4;
              if (!rowsMap[y]) rowsMap[y] = [];
              rowsMap[y].push({ x: item.transform[4], text: str });
            });

            const sortedY = Object.keys(rowsMap).map(Number).sort((a, b) => b - a);
            const lines = sortedY.map(y => {
              const rowItems = rowsMap[y].sort((a, b) => a.x - b.x);
              return rowItems.map(r => r.text).join(' ').replace(/\s+/g, ' ').trim();
            });
            pagesLines.push(lines);
          }

          const newProg = parseAssemblyPdfText(pagesLines, file.name, pdfColorChoice);
          const u = currentUser?.username || 'default';
          const nextCustomProgs = [newProg, ...customProgramsList];
          setCustomProgramsList(nextCustomProgs);
          try {
            localStorage.setItem(`asamblea-custom-programs-${u}`, JSON.stringify(nextCustomProgs));
          } catch (err) {}

          setIsParsingPdf(false);
          setIsPdfModalOpen(false);
          setIsDrawerOpen(false);
          setPreviousScreen('assemblies');
          setActiveProgram(newProg.id);
          setActiveTab(newProg.days === 3 ? 'viernes' : 'programa');
          setCurrentScreen('program_view');
          showToast('¡Programa de asamblea creado con éxito!');
        } catch (err) {
          setIsParsingPdf(false);
          showToast('No se pudo procesar el PDF');
        }
        e.target.value = '';
      };

      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      const handleInstallClick = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          setDeferredPrompt(null);
        }
        setIsDrawerOpen(false);
      };

      useEffect(() => {
        const themeMeta = document.getElementById('theme-color-meta');
        const statusMeta = document.getElementById('apple-status-bar-meta');
        const schemeMeta = document.getElementById('color-scheme-meta');
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          document.body.classList.add('dark');
          document.documentElement.style.backgroundColor = '#000000';
          document.documentElement.style.colorScheme = 'dark';
          document.body.style.backgroundColor = '#000000';
          document.body.style.colorScheme = 'dark';
          if (themeMeta) themeMeta.setAttribute('content', '#000000');
          if (statusMeta) statusMeta.setAttribute('content', 'black-translucent');
          if (schemeMeta) schemeMeta.setAttribute('content', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.body.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#F2F2F7';
          document.documentElement.style.colorScheme = 'light';
          document.body.style.backgroundColor = '#F2F2F7';
          document.body.style.colorScheme = 'light';
          if (themeMeta) themeMeta.setAttribute('content', '#F2F2F7');
          if (statusMeta) statusMeta.setAttribute('content', 'default');
          if (schemeMeta) schemeMeta.setAttribute('content', 'light');
        }
        try { localStorage.setItem('asamblea-dark-mode', isDarkMode); } catch (e) {}
      }, [isDarkMode]);

      const saveNotesNow = (updatedNotes) => {
        const u = currentUser?.username || 'default';
        try {
          localStorage.setItem(`asamblea-notas-${u}`, JSON.stringify(updatedNotes));
        } catch (e) {}
      };

      const handleNoteChange = (id, val, immediate = false) => {
        setIsSaving(true);
        const next = { ...notesRef.current, [id]: val };
        notesRef.current = next;
        saveNotesNow(next);

        if (immediate) {
          setNotes({ ...notesRef.current });
        }

        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        saveTimeoutRef.current = setTimeout(() => {
          setNotes({ ...notesRef.current });
          setIsSaving(false);
        }, 500);
      };

      const handleOpenProgram = (progId) => {
        const prog = allProgramsDB.find(p => p.id === progId);
        if (!prog) return;
        setOpenSwipeId(null);
        setPreviousScreen(currentScreen);
        setActiveProgram(progId);
        setActiveTab(prog.days === 3 ? 'viernes' : 'programa');
        setCurrentScreen('program_view');
        window.scrollTo(0, 0);
      };

      const createNewCustomNote = () => {
        const u = currentUser?.username || 'default';
        const now = Date.now();
        const newId = `custom_${now}`;
        const nextColor = NOTE_COLORS[customNotesList.length % NOTE_COLORS.length];
        const assignedFolder = (selectedFolderId && selectedFolderId !== 'all') ? selectedFolderId : null;
        const newNote = {
          id: newId,
          title: 'Nueva nota',
          createdAt: now,
          color: nextColor,
          folderId: assignedFolder
        };
        const updatedList = [newNote, ...customNotesList];
        setCustomNotesList(updatedList);
        try {
          localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(updatedList));
        } catch (e) {}
        setOpenSwipeId(null);
        setPreviousScreen('notes_home');
        setActiveProgram(newId);
        setCurrentScreen('custom_note');
        window.scrollTo(0, 0);
      };

      const handleOpenCustomNote = (noteId) => {
        setOpenSwipeId(null);
        setPreviousScreen(currentScreen);
        setActiveProgram(noteId);
        setCurrentScreen('custom_note');
        window.scrollTo(0, 0);
      };

      const handleUpdateCustomNoteTitle = (e) => {
        const newTitle = e.target.value;
        const u = currentUser?.username || 'default';
        const updatedList = customNotesList.map(n => n.id === activeProgram ? { ...n, title: newTitle } : n);
        setCustomNotesList(updatedList);
        try {
          localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(updatedList));
        } catch (e) {}
      };

      const toggleItem = (id) => {
        setExpandedItems(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleDarkMode = () => setIsDarkMode(prev => !prev);
      
      const increaseFontSize = () => {
        setFontSize(prev => {
          const next = Math.min(prev + 2, 28);
          try { localStorage.setItem('asamblea-fontsize', next.toString()); } catch (e) {}
          return next;
        });
      };

      const decreaseFontSize = () => {
        setFontSize(prev => {
          const next = Math.max(prev - 2, 12);
          try { localStorage.setItem('asamblea-fontsize', next.toString()); } catch (e) {}
          return next;
        });
      };

      const toggleArchiveItem = (id) => {
        const u = currentUser?.username || 'default';
        setArchivedItems(prev => {
          const willArchive = !prev[id];
          const newState = { ...prev, [id]: willArchive };
          try { localStorage.setItem(`asamblea-archived-${u}`, JSON.stringify(newState)); } catch (e) {}
          showToast(willArchive ? 'Movido a Archivo' : 'Restaurado de Archivo');
          return newState;
        });
      };

      const deleteItem = (id) => {
        const u = currentUser?.username || 'default';
        setDeletedItems(prev => {
          const newState = { ...prev, [id]: true };
          try { localStorage.setItem(`asamblea-deleted-${u}`, JSON.stringify(newState)); } catch (e) {}
          return newState;
        });

        if (String(id).startsWith('custom_prog_')) {
          setCustomProgramsList(prev => {
            const nextProgs = prev.filter(p => p.id !== id);
            try { localStorage.setItem(`asamblea-custom-programs-${u}`, JSON.stringify(nextProgs)); } catch (e) {}
            return nextProgs;
          });
        } else if (String(id).startsWith('custom_')) {
          setCustomNotesList(prev => {
            const nextList = prev.filter(n => n.id !== id);
            try { localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(nextList)); } catch (e) {}
            return nextList;
          });
        }
        showToast('Elemento eliminado');
      };

      const handleBackNavigation = () => {
        if (saveTimeoutRef.current) {
          clearTimeout(saveTimeoutRef.current);

        saveNotesNow(notesRef.current);
        setNotes({ ...notesRef.current });

        setOpenSwipeId(null);

          setCurrentScreen(previousScreen === 'archive' ? 'archive' : 'assemblies');

          setCurrentScreen(previousScreen === 'archive' ? 'archive' : 'notes_home');
        } else {
          setCurrentScreen('notes_home');

        setActiveProgram(null);
        setActiveTab('');
      };

      const handleExportPDF = () => {
        setIsDrawerOpen(false);
        const currentNotes = notesRef.current;
        const element = document.createElement('div');
        element.style.padding = '30px';
        element.style.fontFamily = '-apple-system, BlinkMacSystemFont, Arial, sans-serif';
        element.style.color = '#1C1C1E';

        let html = `<h1 style="color: #007AFF; text-align: center; margin-bottom: 24px; font-size: 24px;">Mis Apuntes</h1>`;

        if (currentScreen === 'custom_note' && activeProgram) {
          const noteObj = customNotesList.find(n => n.id === activeProgram);
          html += `<h2 style="color: #000; border-bottom: 2px solid #E5E5EA; padding-bottom: 8px;">${noteObj?.title || 'Nota Libre'}</h2>`;
          html += `<div style="margin-top: 15px; font-size: 15px; line-height: 1.6;">${currentNotes[activeProgram] || 'Sin contenido.'}</div>`;
        } else {
          const targetPrograms = activeProgram ? allProgramsDB.filter(p => p.id === activeProgram) : allProgramsDB;
          targetPrograms.forEach(prog => {
            html += `<h2 style="color: #007AFF; margin-top: 25px; border-bottom: 2px solid #E5E5EA; padding-bottom: 6px;">${prog.title} (${prog.year})</h2>`;
            const sections = prog.days === 3 ? ['viernes', 'sabado', 'domingo'] : ['programa', 'repaso'];
            sections.forEach(sec => {
              if (!prog[sec]) return;
              prog[sec].forEach(item => {
                if (item.type === 'attendance') {
                  const gen = currentNotes[item.id + '_general'];
                  const str = currentNotes[item.id + '_stream'];
                  if (prog.days === 3) {
                    if (gen || str) {
                      const totalAtt = (parseInt(gen || '0', 10) || 0) + (parseInt(str || '0', 10) || 0);
                      html += `<p style="font-size: 13px; color: #636366;"><strong>${item.title}:</strong> Presencial: ${gen || 0} | Streaming: ${str || 0} | Total: ${totalAtt}</p>`;
                    }
                  } else {
                    if (gen) {
                      html += `<p style="font-size: 13px; color: #636366;"><strong>${item.title}:</strong> Presencial: ${gen}</p>`;
                    }
                  }
                } else {
                  if (currentNotes[item.id] && currentNotes[item.id].trim() !== '' && currentNotes[item.id] !== '<b>Orador: </b><br><br>') {
                    html += `<h3 style="color: #000; margin-top: 16px; margin-bottom: 6px; font-size: 16px;">${item.time ? item.time + ' - ' : ''}${item.title}</h3>`;
                    html += `<div style="background: #F2F2F7; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.5;">${currentNotes[item.id]}</div>`;
                  }
                  if (item.type === 'symposium' && item.parts) {
                    item.parts.forEach(part => {
                      if (currentNotes[part.id] && currentNotes[part.id].trim() !== '' && currentNotes[part.id] !== '<b>Orador: </b><br><br>') {
                        html += `<h4 style="color: #3A3A3C; margin-top: 12px; margin-left: 15px; margin-bottom: 4px; font-size: 15px;">${part.title}</h4>`;
                        html += `<div style="background: #F2F2F7; padding: 12px; border-radius: 8px; margin-left: 15px; font-size: 14px; line-height: 1.5;">${currentNotes[part.id]}</div>`;
                      }
                    });
                  }
                }
              });
            });
          });
        }

        element.innerHTML = html;
        if (window.html2pdf) {
          window.html2pdf().set({
            margin: 15,
            filename: `Mis_Apuntes_Asamblea.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          }).from(element).save();
        }
      };

      const activeProgramsList = allProgramsDB.filter(p => !archivedItems[p.id] && !deletedItems[p.id]);
      const activeCustomNotes = customNotesList.filter(n => !archivedItems[n.id] && !deletedItems[n.id]);
      const filteredCustomNotes = selectedFolderId === 'all'
        ? activeCustomNotes
        : activeCustomNotes.filter(n => n.folderId === selectedFolderId);
      const archivedProgramsList = allProgramsDB.filter(p => archivedItems[p.id] && !deletedItems[p.id]);
      const archivedCustomNotes = customNotesList.filter(n => archivedItems[n.id] && !deletedItems[n.id]);
      const totalArchivedCount = archivedProgramsList.length + archivedCustomNotes.length;

      return (
        <div className="min-h-screen bg-[#F2F2F7] dark:bg-[#000000] text-black dark:text-white font-sans pb-28 selection:bg-[#007AFF]/30">
          <div
            aria-hidden="true"
            style={{
              position: 'fixed',
              left: 0,
              right: 0,
              bottom: '-120px',
              height: '160px',
              backgroundColor: isDarkMode ? '#000000' : '#F2F2F7',
              zIndex: 0,
              pointerEvents: 'none'
            }}
          />
          <input
            ref={fileInputRef}
            type="file"
            accept=".json,application/json"
            onChange={handleImportBackup}
            className="hidden"
          />
          <input
            ref={pdfInputRef}
            type="file"
            accept=".pdf,application/pdf"
            onChange={handlePdfProgramUpload}
            className="hidden"
          />

          {toastMessage && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-black/85 dark:bg-white/90 text-white dark:text-black px-5 py-2.5 rounded-full text-[14px] font-semibold shadow-lg animate-fade-in">
              {toastMessage}
            </div>
          )}

          {updateAvailable && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-5 bg-black/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-white dark:bg-[#1C1C1E] w-full max-w-[310px] rounded-[20px] overflow-hidden shadow-2xl border border-[#C6C6C8]/40 dark:border-[#38383A] text-center">
                <div className="p-6 pb-5">
                  <div className="w-12 h-12 rounded-full bg-[#007AFF]/12 text-[#007AFF] flex items-center justify-center mx-auto mb-3">
                    <Download size={24} />
                  </div>
                  <h3 className="text-[18px] font-bold text-black dark:text-white tracking-tight mb-1.5">
                    Hay una nueva versión
                  </h3>
                  <p className="text-[14px] text-[#8E8E93] leading-snug">
                    Instala la actualización para obtener los últimos cambios. Tus notas están protegidas y no se borrarán.
                  </p>
                </div>
                <div className="border-t border-[#C6C6C8]/50 dark:border-[#38383A] flex divide-x divide-[#C6C6C8]/50 dark:divide-[#38383A]">
                  <button
                    type="button"
                    disabled={isUpdatingApp}
                    onClick={() => setUpdateAvailable(false)}
                    className="flex-1 py-3.5 text-[16px] font-medium text-[#8E8E93] active:bg-[#E5E5EA] dark:active:bg-[#2C2C2E] transition-colors"
                  >
                    Después
                  </button>
                  <button
                    type="button"
                    disabled={isUpdatingApp}
                    onClick={handleInstallUpdate}
                    className="flex-1 py-3.5 text-[16px] font-bold text-[#007AFF] active:bg-[#E5E5EA] dark:active:bg-[#2C2C2E] transition-colors flex items-center justify-center gap-1.5"
                  >
                    {isUpdatingApp ? <Loader2 size={18} className="animate-spin" /> : 'Instalar'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {isFolderModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-5 bg-black/50 backdrop-blur-sm animate-fade-in">
              <form onSubmit={handleCreateFolder} className="bg-white dark:bg-[#1C1C1E] w-full max-w-[320px] rounded-[20px] overflow-hidden shadow-2xl border border-[#C6C6C8]/40 dark:border-[#38383A]">
                <div className="p-5">
                  <h3 className="text-[18px] font-bold text-center text-black dark:text-white mb-1">Nueva Carpeta</h3>
                  <p className="text-[13px] text-[#8E8E93] text-center mb-4">Organiza tus notas personales</p>
                  <input
                    type="text"
                    value={newFolderName}
                    onChange={(e) => setNewFolderName(e.target.value)}
                    placeholder="Nombre de la carpeta..."
                    autoFocus
                    className="w-full px-3.5 py-2.5 rounded-xl bg-[#F2F2F7] dark:bg-[#2C2C2E] text-black dark:text-white text-[16px] focus:outline-none mb-4"
                  />
                  <div className="flex items-center justify-center gap-2.5 mb-2">
                    {NOTE_COLORS.slice(0, 6).map(col => (
                      <button
                        key={col}
                        type="button"
                        onClick={() => setNewFolderColor(col)}
                        style={{ backgroundColor: col }}
                        className={`w-7 h-7 rounded-full transition-transform ${newFolderColor === col ? 'scale-125 ring-2 ring-offset-2 ring-[#007AFF] dark:ring-offset-[#1C1C1E]' : 'opacity-75'}`}
                      />
                    ))}
                  </div>
                </div>
                <div className="border-t border-[#C6C6C8]/50 dark:border-[#38383A] flex divide-x divide-[#C6C6C8]/50 dark:divide-[#38383A]">
                  <button
                    type="button"
                    onClick={() => { setIsFolderModalOpen(false); setNewFolderName(''); }}
                    className="flex-1 py-3.5 text-[16px] font-medium text-[#8E8E93]"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-3.5 text-[16px] font-bold text-[#007AFF]"
                  >
                    Crear
                  </button>
                </div>
              </form>
            </div>
          )}

          {movingNoteObj && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-white dark:bg-[#1C1C1E] w-full max-w-sm rounded-[22px] overflow-hidden shadow-2xl border border-[#C6C6C8]/40 dark:border-[#38383A] animate-slide-up">
                <div className="p-4 border-b border-[#C6C6C8]/40 dark:border-[#38383A] text-center">
                  <h3 className="text-[17px] font-bold text-black dark:text-white">Mover a carpeta</h3>
                  <p className="text-[13px] text-[#8E8E93] truncate px-4">{movingNoteObj.title || 'Sin título'}</p>
                </div>
                <div className="p-3 max-h-64 overflow-y-auto space-y-1.5">
                  <button
                    type="button"
                    onClick={() => handleMoveNoteToFolder(movingNoteObj.id, null)}
                    className={`w-full flex items-center justify-between p-3 rounded-xl text-left text-[15px] font-medium transition-colors ${!movingNoteObj.folderId ? 'bg-[#007AFF]/12 text-[#007AFF]' : 'text-black dark:text-white active:bg-[#F2F2F7] dark:active:bg-[#2C2C2E]'}`}
                  >
                    <span>Todas las notas (Sin carpeta)</span>
                    {!movingNoteObj.folderId && <span className="font-bold">✓</span>}
                  </button>
                  {foldersList.map(folder => (
                    <button
                      key={folder.id}
                      type="button"
                      onClick={() => handleMoveNoteToFolder(movingNoteObj.id, folder.id)}
                      className={`w-full flex items-center justify-between p-3 rounded-xl text-left text-[15px] font-medium transition-colors ${movingNoteObj.folderId === folder.id ? 'bg-[#007AFF]/12 text-[#007AFF]' : 'text-black dark:text-white active:bg-[#F2F2F7] dark:active:bg-[#2C2C2E]'}`}
                    >
                      <div className="flex items-center gap-2.5">
                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: folder.color || '#007AFF' }} />
                        <span>{folder.name}</span>
                      </div>
                      {movingNoteObj.folderId === folder.id && <span className="font-bold">✓</span>}
                    </button>
                  ))}
                  {foldersList.length === 0 && (
                    <button
                      type="button"
                      onClick={() => { setMovingNoteObj(null); setIsFolderModalOpen(true); }}
                      className="w-full py-3 text-center text-[#007AFF] text-[14px] font-semibold"
                    >
                      + Crear mi primera carpeta
                    </button>
                  )}
                </div>
                <div className="p-3 border-t border-[#C6C6C8]/40 dark:border-[#38383A]">
                  <button
                    type="button"
                    onClick={() => setMovingNoteObj(null)}
                    className="w-full py-3 rounded-xl bg-[#F2F2F7] dark:bg-[#2C2C2E] text-[#007AFF] font-semibold text-[16px]"
                  >
                    Cerrar
                  </button>
                </div>
              </div>
            </div>

            <div className="fixed inset-0 z-50 flex items-center justify-center p-5 bg-black/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-white dark:bg-[#1C1C1E] w-full max-w-[350px] rounded-[22px] overflow-hidden shadow-2xl border border-[#C6C6C8]/40 dark:border-[#38383A]">
                <div className="p-5">
                  <div className="w-12 h-12 rounded-full bg-[#E5854B]/15 text-[#E5854B] flex items-center justify-center mx-auto mb-3">
                    <FileTextIcon size={24} />
                  </div>
                  <h3 className="text-[18px] font-bold text-center text-black dark:text-white mb-1">
                    Crear apuntes de Programa
                  </h3>
                  <p className="text-[13px] text-[#8E8E93] text-center leading-snug mb-4">
                    Selecciona el archivo PDF oficial de la asamblea. Se detectarán discursos, series, canciones y asistencias al final de cada sesión.
                  </p>
                  <p className="text-[12px] font-semibold uppercase tracking-wider text-[#8E8E93] mb-2 text-center">
                    Color principal del programa
                  </p>
                  <div className="flex items-center justify-center gap-3 mb-4">
                    {PROGRAM_PALETTES.map(pal => (
                      <button
                        key={pal.color}
                        type="button"
