    function getOrCreateDeviceUser() {
      try {
        const existingUser = localStorage.getItem('apuntes_active_user');
        if (existingUser && existingUser.trim()) return existingUser.trim();
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('apuntes_data_')) {
            const foundUser = k.replace('apuntes_data_', '');
            if (foundUser) {
              localStorage.setItem('apuntes_active_user', foundUser);
              return foundUser;
            }
          }
        }
        const newId = 'disp_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 8);
        localStorage.setItem('apuntes_active_user', newId);
        return newId;
      } catch (e) {
        return 'default_user';
      }
    }

      try {
        const d = ts ? new Date(ts) : (dateStr ? new Date(dateStr) : new Date());
        if (isNaN(d.getTime())) return dateStr || '';

    // ==========================================
    function SwipeableItem({ children, onArchive, onDelete, isArchivedView }) {
      const [offsetX, setOffsetX] = useState(0);
      const startXRef = useRef(null);
      const startYRef = useRef(null);
      const isDraggingRef = useRef(false);

      const handleTouchStart = (e) => {
        if (e.touches.length !== 1) return;
        startXRef.current = e.touches[0].clientX;
        startYRef.current = e.touches[0].clientY;
        isDraggingRef.current = false;
      };

      const handleTouchMove = (e) => {
        if (startXRef.current === null) return;
        const dx = e.touches[0].clientX - startXRef.current;
        const dy = e.touches[0].clientY - startYRef.current;
        if (!isDraggingRef.current && Math.abs(dy) > Math.abs(dx)) {
          startXRef.current = null;
          return;
        }
        if (Math.abs(dx) > 10) isDraggingRef.current = true;
        if (isDraggingRef.current) {
          if (dx > 0) {
            setOffsetX(Math.min(dx, 148));
          } else {
            setOffsetX(0);
          }
        }
      };

      const handleTouchEnd = () => {
        if (offsetX > 55) {
          setOffsetX(140);
        } else {
          setOffsetX(0);
        }
        startXRef.current = null;
      };

      return (
        <div className="relative overflow-hidden rounded-2xl select-none">
          <div
            className="absolute inset-y-0 left-0 flex items-center gap-2 pl-2 pr-3"
            style={{
              opacity: offsetX > 8 ? 1 : 0,
              pointerEvents: offsetX > 40 ? 'auto' : 'none',
              transition: 'opacity 0.15s ease'
            }}
          >
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); setOffsetX(0); onArchive && onArchive(); }}
              className="w-14 h-14 rounded-2xl bg-[#5856D6] active:scale-95 text-white flex flex-col items-center justify-center shadow-md transition-transform"
              title={isArchivedView ? 'Desarchivar' : 'Archivar'}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M20 7v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7m16 0H4m16 0l-1.5-3H5.5L4 7m6 5h4" />
              </svg>
              <span className="text-[10px] font-medium mt-0.5">{isArchivedView ? 'Sacar' : 'Archivar'}</span>
            </button>
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); setOffsetX(0); onDelete && onDelete(); }}
              className="w-14 h-14 rounded-2xl bg-[#FF3B30] active:scale-95 text-white flex flex-col items-center justify-center shadow-md transition-transform"
              title="Eliminar"
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              <span className="text-[10px] font-medium mt-0.5">Borrar</span>
            </button>
          </div>

          <div
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            style={{
              transform: `translateX(${offsetX}px)`,
              transition: isDraggingRef.current ? 'none' : 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)'
            }}
          >
            {children}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. EDITOR DE APUNTES ENRIQUECIDO
    // ==========================================
    function RichNoteEditor({ noteKey, initialValue, onSave, fontSizeClass, placeholder, importVersion }) {
      const editorRef = useRef(null);
      const isFocusedRef = useRef(false);

      useEffect(() => {
        if (editorRef.current && !isFocusedRef.current) {
          editorRef.current.innerHTML = initialValue || '';
        }
      }, [noteKey, initialValue, importVersion]);

      const execCmd = (cmd, val = null) => {
        document.execCommand(cmd, false, val);
        if (editorRef.current) {
          onSave(noteKey, editorRef.current.innerHTML);
        }
      };

      return (
        <div className="mt-2 rounded-xl bg-[#F2F2F7] dark:bg-[#141416] border border-black/10 dark:border-white/10 overflow-hidden">
          <div className="flex items-center gap-1 px-2.5 py-1.5 border-b border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02]">
            <button type="button" onMouseDown={(e) => { e.preventDefault(); execCmd('bold'); }} className="px-2 py-1 rounded text-xs font-bold hover:bg-black/10 dark:hover:bg-white/10">B</button>
            <button type="button" onMouseDown={(e) => { e.preventDefault(); execCmd('italic'); }} className="px-2 py-1 rounded text-xs italic hover:bg-black/10 dark:hover:bg-white/10">I</button>
            <button type="button" onMouseDown={(e) => { e.preventDefault(); execCmd('underline'); }} className="px-2 py-1 rounded text-xs underline hover:bg-black/10 dark:hover:bg-white/10">U</button>
            <button type="button" onMouseDown={(e) => { e.preventDefault(); execCmd('insertUnorderedList'); }} className="px-2 py-1 rounded text-xs hover:bg-black/10 dark:hover:bg-white/10">• Lista</button>
          </div>
          <div
            ref={editorRef}
            contentEditable
            onFocus={() => { isFocusedRef.current = true; }}
            onBlur={(e) => {
              isFocusedRef.current = false;
              onSave(noteKey, e.currentTarget.innerHTML);
            }}
            onInput={(e) => onSave(noteKey, e.currentTarget.innerHTML)}
            data-placeholder={placeholder || 'Escribe tus apuntes aquí...'}
            className={`min-h-[96px] p-3 outline-none ${fontSizeClass} leading-relaxed empty:before:content-[attr(data-placeholder)] empty:before:text-gray-400 dark:empty:before:text-gray-500`}
          />
        </div>
      );
    }

    // ==========================================
    // 6. APLICACIÓN PRINCIPAL
    // ==========================================
    function App() {
      const [currentUser] = useState(() => getOrCreateDeviceUser());
      const storagePrefix = `apuntes_data_${currentUser}`;

      // Modo oscuro por defecto
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('apuntes_dark_mode');
        return saved === null ? true : saved === 'true';
      });
      const [fontSize, setFontSize] = useState(() => localStorage.getItem('apuntes_font_size') || 'normal');

      // Vistas: 'notes_home' | 'assemblies_home' | 'archive_home' | 'program_view' | 'custom_note_view'
      const [activeView, setActiveView] = useState('notes_home');
      const [isMenuOpen, setIsMenuOpen] = useState(false);

      // Datos persistentes del usuario
      const [notesData, setNotesData] = useState({});
      const [attendanceData, setAttendanceData] = useState({});
      const [customNotesList, setCustomNotesList] = useState([]);
      const [foldersList, setFoldersList] = useState([]);
      const [archivedItems, setArchivedItems] = useState({});
      const [deletedItems, setDeletedItems] = useState({});
      const [importVersion, setImportVersion] = useState(0);

      // Navegación interna
      const [selectedFolderId, setSelectedFolderId] = useState(null); // null = Mis apuntes sueltos | string = dentro de carpeta
      const [selectedProgramId, setSelectedProgramId] = useState(null);
      const [selectedDayId, setSelectedDayId] = useState('viernes');
      const [circuitTab, setCircuitTab] = useState('programa');
      const [expandedTalks, setExpandedTalks] = useState({});
      const [activeCustomNoteId, setActiveCustomNoteId] = useState(null);

      // Modales de Carpetas
      const [isFolderModalOpen, setIsFolderModalOpen] = useState(false);
      const [newFolderName, setNewFolderName] = useState('');
      const [newFolderColor, setNewFolderColor] = useState(NOTE_COLORS[0].hex);
      const [noteToMove, setNoteToMove] = useState(null);

      // Confirmación de borrado y actualización PWA
      const [confirmDeleteModal, setConfirmDeleteModal] = useState(null);
      const [updateAvailable, setUpdateAvailable] = useState(false);
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const fileInputBackupRef = useRef(null);

      // Aplicar Modo Oscuro al 100% de la pantalla
      useEffect(() => {
        const root = document.documentElement;
        const metaTheme = document.getElementById('meta-theme-color');
        const seal = document.getElementById('safe-bottom-seal');
        if (darkMode) {
          root.classList.add('dark');
          root.style.backgroundColor = '#000000';
          root.style.colorScheme = 'dark';
          document.body.style.backgroundColor = '#000000';
          if (metaTheme) metaTheme.setAttribute('content', '#000000');
          if (seal) seal.style.backgroundColor = '#000000';
        } else {
          root.classList.remove('dark');
          root.style.backgroundColor = '#F2F2F7';
          root.style.colorScheme = 'light';
          document.body.style.backgroundColor = '#F2F2F7';
          if (metaTheme) metaTheme.setAttribute('content', '#F2F2F7');
          if (seal) seal.style.backgroundColor = '#F2F2F7';
        }
        localStorage.setItem('apuntes_dark_mode', String(darkMode));
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem('apuntes_font_size', fontSize);
      }, [fontSize]);

      // Cargar datos guardados
      useEffect(() => {
        try {
          const raw = localStorage.getItem(storagePrefix);
          if (raw) {
            const parsed = JSON.parse(raw);
            setNotesData(parsed.notesData || {});
            setAttendanceData(parsed.attendanceData || {});
            setCustomNotesList(parsed.customNotesList || []);
            setFoldersList(parsed.foldersList || []);
            setArchivedItems(parsed.archivedItems || {});
            setDeletedItems(parsed.deletedItems || {});
          }
        } catch (e) {
          console.error('Error cargando datos:', e);
        }
      }, [storagePrefix]);

      // Guardado automático inmediato
      const persistData = (nextState) => {
        try {
          const payload = {
            notesData: nextState.notesData !== undefined ? nextState.notesData : notesData,
            attendanceData: nextState.attendanceData !== undefined ? nextState.attendanceData : attendanceData,
            customNotesList: nextState.customNotesList !== undefined ? nextState.customNotesList : customNotesList,
            foldersList: nextState.foldersList !== undefined ? nextState.foldersList : foldersList,
            archivedItems: nextState.archivedItems !== undefined ? nextState.archivedItems : archivedItems,
            deletedItems: nextState.deletedItems !== undefined ? nextState.deletedItems : deletedItems,
            updatedAt: Date.now()
          };
          localStorage.setItem(storagePrefix, JSON.stringify(payload));
        } catch (e) {
          console.error('Error guardando datos:', e);
        }
      };

      // Detector de nueva versión desde sw.js
      useEffect(() => {
        const isServiceWorkerAllowed =
          'serviceWorker' in navigator &&
          (window.location.protocol === 'https:' || window.location.protocol === 'http:') &&
          !window.location.origin.includes('usercontent.goog') &&
          window.location.origin !== 'null';

        if (!isServiceWorkerAllowed) return;

        const checkVersionFromSW = async () => {
          try {
            const res = await fetch('./sw.js?t=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) return;
            const text = await res.text();
            const match = text.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
            if (match && match[1]) {
              const serverVersion = match[1];
              const installedVersion = localStorage.getItem('apuntes_installed_sw_version');
              if (!installedVersion) {
                localStorage.setItem('apuntes_installed_sw_version', serverVersion);
              } else if (installedVersion !== serverVersion) {
                setUpdateAvailable( serverVersion );
              }
            }
          } catch (err) {}
        };

        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  checkVersionFromSW();
                  setUpdateAvailable((prev) => prev || 'new');
                }
              });
            }
          });
        }).catch(() => {});

        checkVersionFromSW();
        const onVisChange = () => {
          if (document.visibilityState === 'visible') checkVersionFromSW();
        };
        document.addEventListener('visibilitychange', onVisChange);
        return () => document.removeEventListener('visibilitychange', onVisChange);
      }, []);

      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const handleInstallUpdate = async () => {
        try {
          if (typeof updateAvailable === 'string' && updateAvailable !== 'new') {
            localStorage.setItem('apuntes_installed_sw_version', updateAvailable);
          } else {
            const res = await fetch('./sw.js?t=' + Date.now(), { cache: 'no-store' });
            const txt = await res.text();
            const m = txt.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
            if (m && m[1]) localStorage.setItem('apuntes_installed_sw_version', m[1]);
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) {
              if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
              await r.update().catch(() => {});
            }
          }
        } catch (e) {}
        window.location.reload();
      };

      // Guardar nota de discurso
      const handleSaveNote = (key, htmlContent) => {
        setNotesData(prev => {
          const next = { ...prev, [key]: htmlContent };
          persistData({ notesData: next });
          return next;
        });
      };

      // Guardar asistencia
      const handleAttendanceChange = (attId, field, val) => {
        const cleanVal = val.replace(/[^\d]/g, '');
        setAttendanceData(prev => {
          const current = prev[attId] || { presencial: '', streaming: '' };
          const nextAtt = { ...current, [field]: cleanVal };
          const next = { ...prev, [attId]: nextAtt };
          persistData({ attendanceData: next });
          return next;
        });
      };

      // Crear Nuevo Apunte (si estás dentro de una carpeta, se crea en esa carpeta; si estás afuera, queda suelto)
      const handleCreateCustomNote = () => {
        const now = Date.now();
        const newNote = {
          id: 'note_' + now,
          title: '',
          content: '',
          color: NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)].hex,
          folderId: selectedFolderId || null,
          createdAt: now,
          updatedAt: now,
          date: formatNoteDate(null, now)
        };
        const nextList = [newNote, ...customNotesList];
        setCustomNotesList(nextList);
        persistData({ customNotesList: nextList });
        setActiveCustomNoteId(newNote.id);
        setActiveView('custom_note_view');
      };

      const handleUpdateCustomNote = (id, changes) => {
        setCustomNotesList(prev => {
          const next = prev.map(n => n.id === id ? { ...n, ...changes, updatedAt: Date.now() } : n);
          persistData({ customNotesList: next });
          return next;
        });
      };

      // Crear carpeta
      const handleCreateFolder = (e) => {
        e.preventDefault();
        if (!newFolderName.trim()) return;
        const folder = {
          id: 'folder_' + Date.now(),
          name: newFolderName.trim(),
          color: newFolderColor,
          createdAt: Date.now()
        };
        const nextFolders = [...foldersList, folder];
        setFoldersList(nextFolders);
        persistData({ foldersList: nextFolders });
        setNewFolderName('');
        setIsFolderModalOpen(false);
      };

      const handleDeleteFolder = (folderId) => {
        // Las notas dentro de la carpeta vuelven al inicio principal para no perderse
        const nextNotes = customNotesList.map(n => n.folderId === folderId ? { ...n, folderId: null } : n);
        const nextFolders = foldersList.filter(f => f.id !== folderId);
        setCustomNotesList(nextNotes);
        setFoldersList(nextFolders);
        if (selectedFolderId === folderId) setSelectedFolderId(null);
        persistData({ customNotesList: nextNotes, foldersList: nextFolders });
      };

      // Archivar / Desarchivar
      const toggleArchiveItem = (itemId) => {
        setArchivedItems(prev => {
          const next = { ...prev, [itemId]: !prev[itemId] };
          persistData({ archivedItems: next });
          return next;
        });
      };

      // Eliminar
      const confirmDeleteItem = () => {
        if (!confirmDeleteModal) return;
        const { id } = confirmDeleteModal;
        setDeletedItems(prev => {
          const next = { ...prev, [id]: true };
          persistData({ deletedItems: next });
          return next;
        });
        setConfirmDeleteModal(null);
      };

      // Exportar e Importar Respaldo (.json)
      const handleExportBackup = () => {
        const backup = {
          version: 2,
          exportedAt: new Date().toISOString(),
          notesData,
          attendanceData,
          customNotesList,
          foldersList,
          archivedItems
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `mis_apuntes_respaldo_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportBackup = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            const nextNotesData = { ...notesData, ...(imported.notesData || {}) };
            const nextAttData = { ...attendanceData, ...(imported.attendanceData || {}) };

            const existingIds = new Set(customNotesList.map(n => n.id));
            const mergedCustomNotes = [...customNotesList];
            (imported.customNotesList || []).forEach(n => {
              if (!existingIds.has(n.id)) {
                mergedCustomNotes.push(n);
              } else {
                const idx = mergedCustomNotes.findIndex(x => x.id === n.id);
                if (idx !== -1) mergedCustomNotes[idx] = n;
              }
            });

            const existingFolderIds = new Set(foldersList.map(f => f.id));
            const mergedFolders = [...foldersList];
            (imported.foldersList || []).forEach(f => {
              if (!existingFolderIds.has(f.id)) mergedFolders.push(f);
            });

            // Desbloquear cualquier nota que hubiera sido eliminada antes
            const nextDeleted = { ...deletedItems };
            (imported.customNotesList || []).forEach(n => { delete nextDeleted[n.id]; });
            INITIAL_PROGRAMS.forEach(p => { delete nextDeleted[p.id]; });

            const nextArchived = { ...archivedItems, ...(imported.archivedItems || {}) };
            (imported.customNotesList || []).forEach(n => {
              if (!imported.archivedItems || !imported.archivedItems[n.id]) {
                delete nextArchived[n.id];
              }
            });

            setNotesData(nextNotesData);
            setAttendanceData(nextAttData);
            setCustomNotesList(mergedCustomNotes);
            setFoldersList(mergedFolders);
            setDeletedItems(nextDeleted);
            setArchivedItems(nextArchived);
            setImportVersion(v => v + 1);

            persistData({
              notesData: nextNotesData,
              attendanceData: nextAttData,
              customNotesList: mergedCustomNotes,
              foldersList: mergedFolders,
              deletedItems: nextDeleted,
              archivedItems: nextArchived
            });
            setIsMenuOpen(false);
          } catch (err) {
            alert('El archivo seleccionado no es una copia de seguridad válida.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const fontSizeClass = useMemo(() => {
        if (fontSize === 'small') return 'text-sm';
        if (fontSize === 'large') return 'text-lg';
        return 'text-base';
      }, [fontSize]);

      // Filtrado y ordenamiento (las más nuevas primero, y exclusividad por carpeta)
      const visibleCustomNotes = useMemo(() => {
        return customNotesList
          .filter(n => !deletedItems[n.id] && !archivedItems[n.id])
          .filter(n => {
            if (selectedFolderId === null) {
              // En el inicio solo se ven las notas que NO están en ninguna carpeta
              return !n.folderId;
            }
            // Dentro de una carpeta solo se ven las de esa carpeta
            return n.folderId === selectedFolderId;
          })
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      }, [customNotesList, deletedItems, archivedItems, selectedFolderId]);

      const visiblePrograms = useMemo(() => {
        return INITIAL_PROGRAMS.filter(p => !deletedItems[p.id] && !archivedItems[p.id]);
      }, [deletedItems, archivedItems]);

      const archivedList = useMemo(() => {
        const progs = INITIAL_PROGRAMS.filter(p => !deletedItems[p.id] && archivedItems[p.id]).map(p => ({ ...p, _itemType: 'program' }));
        const notes = customNotesList.filter(n => !deletedItems[n.id] && archivedItems[n.id]).map(n => ({ ...n, _itemType: 'note' }));
        return [...progs, ...notes];
      }, [customNotesList, deletedItems, archivedItems]);

      const activeProgram = useMemo(() => {
        return INITIAL_PROGRAMS.find(p => p.id === selectedProgramId) || null;
      }, [selectedProgramId]);

      const activeCustomNote = useMemo(() => {
        return customNotesList.find(n => n.id === activeCustomNoteId) || null;
      }, [customNotesList, activeCustomNoteId]);

      const activeFolderObj = useMemo(() => {
        return foldersList.find(f => f.id === selectedFolderId) || null;
      }, [foldersList, selectedFolderId]);

      // Renderizador de títulos de discurso con prefijo coloreado
      const renderProgramItemText = (item, themeColor) => {
        return (
          <div className={`${fontSizeClass} leading-snug`}>
            <span className="font-semibold text-gray-900 dark:text-white mr-1.5">{item.time}</span>
            {item.prefix && (
              <span className="font-bold tracking-wide mr-1.5" style={{ color: themeColor }}>
                {item.prefix}
              </span>
            )}
            {item.subtitleBold && (
              <span className="font-bold italic text-gray-900 dark:text-white block sm:inline mr-1.5">
                {item.subtitleBold}
              </span>
            )}
            <span className="text-gray-800 dark:text-gray-100">{item.title}</span>
          </div>
        );
      };

      // Tarjeta de Asistencia siempre al final de cada sesión
      const renderAttendanceCard = (attId, sessionName, isRegional, themeColor) => {
        const data = attendanceData[attId] || { presencial: '', streaming: '' };
        const presNum = parseInt(data.presencial || '0', 10) || 0;
        const streamNum = parseInt(data.streaming || '0', 10) || 0;
        const totalNum = presNum + streamNum;

        return (
          <div className="mt-5 p-4 rounded-2xl bg-white dark:bg-[#1C1C1E] border border-black/5 dark:border-white/10 shadow-sm">
            <div className="flex items-center justify-between mb-3">
              <span className="text-xs font-bold uppercase tracking-wider" style={{ color: themeColor }}>
                Asistencia ({sessionName})
              </span>
            </div>

            {isRegional ? (
              <div className="grid grid-cols-3 gap-2.5">
                <div className="p-2.5 rounded-xl bg-[#F2F2F7] dark:bg-[#2C2C2E]">
                  <label className="block text-[11px] text-gray-500 dark:text-gray-400 mb-1">Presencial</label>
                  <input
                    type="text"
                    inputMode="numeric"
                    value={data.presencial || ''}
                    onChange={(e) => handleAttendanceChange(attId, 'presencial', e.target.value)}
                    placeholder="0"
                    className="w-full bg-transparent font-semibold text-base outline-none text-gray-900 dark:text-white"
                  />
                </div>
                <div className="p-2.5 rounded-xl bg-[#F2F2F7] dark:bg-[#2C2C2E]">
                  <label className="block text-[11px] text-gray-500 dark:text-gray-400 mb-1">Streaming</label>
                  <input
                    type="text"
                    inputMode="numeric"
                    value={data.streaming || ''}
                    onChange={(e) => handleAttendanceChange(attId, 'streaming', e.target.value)}
                    placeholder="0"
                    className="w-full bg-transparent font-semibold text-base outline-none text-gray-900 dark:text-white"
                  />
                </div>
                <div className="p-2.5 rounded-xl bg-black/5 dark:bg-white/10">
                  <label className="block text-[11px] text-gray-500 dark:text-gray-300 mb-1">Total</label>
                  <div className="font-bold text-base text-gray-900 dark:text-white">
                    {presNum || streamNum ? totalNum : '0'}
                  </div>
                </div>
              </div>

                            className={`py-2 rounded-lg text-xs font-bold transition-all ${
                              active ? 'bg-white dark:bg-[#2C2C2E] shadow-xs' : 'text-gray-500 dark:text-gray-400'
                            }`}
                            style={active ? { color: d.themeColor } : {}}
                          >
                            {d.name}
                          </button>
                        );
                      })}
                    </div>

                    {activeProgram.days
                      .filter(d => d.id === selectedDayId)
                      .map(day => (
                        <div key={day.id} className="space-y-6">
                          <div>
                            <h2 className="text-3xl font-extrabold tracking-tight" style={{ color: day.themeColor }}>
                              {day.name}
                            </h2>
                            {day.themeScripture && (
                              <p className="text-base text-gray-600 dark:text-gray-300 mt-1 leading-snug">
                                {day.themeScripture}
                              </p>
                            )}
                          </div>

                          {day.sessions.map(session => (
                            <div key={session.id} className="space-y-3">
                              <h3 className="text-xl font-bold pt-2 border-b border-black/10 dark:border-white/10 pb-1" style={{ color: day.themeColor }}>
                                {session.name}
                              </h3>

                              <div className="divide-y divide-black/5 dark:divide-white/10">
                                {session.items.map(item => {
                                  const isExpandable = !item.noNotes && !item.subItems;
                                  const isOpen = !!expandedTalks[item.id];

                                  return (
                                    <div key={item.id} className="py-3">
                                      <div
                                        onClick={() => {
                                          if (isExpandable) {
                                            setExpandedTalks(prev => ({ ...prev, [item.id]: !prev[item.id] }));
                                          }
                                        }}
                                        className={`flex items-start justify-between gap-3 ${isExpandable ? 'cursor-pointer' : ''}`}
                                      >
                                        <div className="flex-1">
                                          {renderProgramItemText(item, day.themeColor)}
                                        </div>
                                        {isExpandable && (
                                          <svg
                                            className={`w-4 h-4 mt-1 text-gray-400 transition-transform shrink-0 ${isOpen ? 'rotate-180' : ''}`}
                                            fill="none"
                                            stroke="currentColor"
                                            strokeWidth="2"
                                            viewBox="0 0 24 24"
                                          >
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                          </svg>
                                        )}
                                      </div>

                                      {isExpandable && isOpen && (
                                        <RichNoteEditor
                                          noteKey={item.id}
                                          initialValue={notesData[item.id] || ''}
                                          onSave={handleSaveNote}
                                          fontSizeClass={fontSizeClass}
                                          importVersion={importVersion}
                                        />
                                      )}

                                      {/* Subtemas de Serie de Discursos */}
                                      {item.subItems && (
                                        <div className="mt-2.5 pl-4 space-y-2.5 border-l-2 border-black/10 dark:border-white/10">
                                          {item.subItems.map(sub => {
                                            const subOpen = !!expandedTalks[sub.id];
                                            return (
                                              <div key={sub.id} className="py-1">
                                                <div
                                                  onClick={() => setExpandedTalks(prev => ({ ...prev, [sub.id]: !prev[sub.id] }))}
                                                  className="flex items-start justify-between gap-2 cursor-pointer"
                                                >
                                                  <span className={`${fontSizeClass} text-gray-800 dark:text-gray-100 leading-snug`}>
                                                    • {sub.title}
                                                  </span>
                                                  <svg
                                                    className={`w-4 h-4 mt-1 text-gray-400 transition-transform shrink-0 ${subOpen ? 'rotate-180' : ''}`}
                                                    fill="none"
                                                    stroke="currentColor"
                                                    strokeWidth="2"
                                                    viewBox="0 0 24 24"
                                                  >
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                                  </svg>
                                                </div>
                                                {subOpen && (
                                                  <RichNoteEditor
                                                    noteKey={sub.id}
                                                    initialValue={notesData[sub.id] || ''}
                                                    onSave={handleSaveNote}
                                                    fontSizeClass={fontSizeClass}
                                                    importVersion={importVersion}
                                                  />
                                                )}
                                              </div>
                                            );
                                          })}
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>

                              {/* Asistencia siempre al final de cada sesión */}
                              {renderAttendanceCard(session.attendanceId, session.name, true, day.themeColor)}
                            </div>
                          ))}
                        </div>
                      ))}
                  </>
                ) : (
                  /* ASAMBLEA DE CIRCUITO (1 DÍA) */
                  <div className="space-y-6">
                    <div className="grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-black/5 dark:bg-[#1C1C1E] no-print">
                      <button
                        type="button"
                        onClick={() => setCircuitTab('programa')}
                        className={`py-2 rounded-lg text-xs font-bold ${circuitTab === 'programa' ? 'bg-white dark:bg-[#2C2C2E] shadow-xs text-gray-900 dark:text-white' : 'text-gray-500'}`}
                      >
                        Programa
                      </button>
                      <button
                        type="button"
                        onClick={() => setCircuitTab('repaso')}
                        className={`py-2 rounded-lg text-xs font-bold ${circuitTab === 'repaso' ? 'bg-white dark:bg-[#2C2C2E] shadow-xs text-gray-900 dark:text-white' : 'text-gray-500'}`}
                      >
                        Repaso
                      </button>
                    </div>

                    {circuitTab === 'programa' ? (
                      <>
                        {activeProgram.sessions.map(session => (
                          <div key={session.id} className="space-y-3">
                            <h3 className="text-xl font-bold pt-2 border-b border-black/10 dark:border-white/10 pb-1" style={{ color: activeProgram.themeColor }}>
                              {session.name}
                            </h3>
                            <div className="divide-y divide-black/5 dark:divide-white/10">
                              {session.items.map(item => {
                                const isExpandable = !item.noNotes && !item.subItems;
                                const isOpen = !!expandedTalks[item.id];
                                return (
                                  <div key={item.id} className="py-3">
                                    <div
                                      onClick={() => {
                                        if (isExpandable) {
                                          setExpandedTalks(prev => ({ ...prev, [item.id]: !prev[item.id] }));
                                        }
                                      }}
                                      className={`flex items-start justify-between gap-3 ${isExpandable ? 'cursor-pointer' : ''}`}
                                    >
                                      <div className="flex-1">
                                        {renderProgramItemText(item, activeProgram.themeColor)}
                                      </div>
                                      {isExpandable && (
                                        <svg
                                          className={`w-4 h-4 mt-1 text-gray-400 transition-transform shrink-0 ${isOpen ? 'rotate-180' : ''}`}
                                          fill="none"
                                          stroke="currentColor"
                                          strokeWidth="2"
                                          viewBox="0 0 24 24"
                                        >
                                          <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                        </svg>
                                      )}
                                    </div>
                                    {isExpandable && isOpen && (
                                      <RichNoteEditor
                                        noteKey={item.id}
                                        initialValue={notesData[item.id] || ''}
                                        onSave={handleSaveNote}
                                        fontSizeClass={fontSizeClass}
                                        importVersion={importVersion}
                                      />
                                    )}
                                    {item.subItems && (
                                      <div className="mt-2.5 pl-4 space-y-2.5 border-l-2 border-black/10 dark:border-white/10">
                                        {item.subItems.map(sub => {
                                          const subOpen = !!expandedTalks[sub.id];
                                          return (
                                            <div key={sub.id} className="py-1">
                                              <div
                                                onClick={() => setExpandedTalks(prev => ({ ...prev, [sub.id]: !prev[sub.id] }))}
                                                className="flex items-start justify-between gap-2 cursor-pointer"
                                              >
                                                <span className={`${fontSizeClass} text-gray-800 dark:text-gray-100 leading-snug`}>
                                                  • {sub.title}
                                                </span>
                                                <svg
                                                  className={`w-4 h-4 mt-1 text-gray-400 transition-transform shrink-0 ${subOpen ? 'rotate-180' : ''}`}
                                                  fill="none"
                                                  stroke="currentColor"
                                                  strokeWidth="2"
                                                  viewBox="0 0 24 24"
                                                >
                                                  <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                                </svg>
                                              </div>
                                              {subOpen && (
                                                <RichNoteEditor
                                                  noteKey={sub.id}
                                                  initialValue={notesData[sub.id] || ''}
                                                  onSave={handleSaveNote}
                                                  fontSizeClass={fontSizeClass}
                                                  importVersion={importVersion}
                                                />
                                              )}
                                            </div>
                                          );
                                        })}
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                            {renderAttendanceCard(session.attendanceId, session.name, false, activeProgram.themeColor)}
                          </div>
                        ))}
                      </>
                    ) : (
                      <div className="space-y-4">
                        <h3 className="text-2xl font-bold" style={{ color: activeProgram.themeColor }}>
                          Preguntas de repaso
                        </h3>
                        <div className="divide-y divide-black/5 dark:divide-white/10">
                          {(activeProgram.reviewQuestions || []).map(q => {
                            const isOpen = !!expandedTalks[q.id];
                            return (
                              <div key={q.id} className="py-3">
                                <div
                                  onClick={() => setExpandedTalks(prev => ({ ...prev, [q.id]: !prev[q.id] }))}
                                  className="flex items-start justify-between gap-3 cursor-pointer"
                                >
                                  <span className={`${fontSizeClass} font-medium leading-snug`}>{q.question}</span>
                                  <svg
                                    className={`w-4 h-4 mt-1 text-gray-400 transition-transform shrink-0 ${isOpen ? 'rotate-180' : ''}`}
                                    fill="none"
                                    stroke="currentColor"
                                    strokeWidth="2"
                                    viewBox="0 0 24 24"
                                  >
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                  </svg>
                                </div>
                                {isOpen && (
                                  <RichNoteEditor
                                    noteKey={q.id}
                                    initialValue={notesData[q.id] || ''}
                                    onSave={handleSaveNote}
                                    fontSizeClass={fontSizeClass}
                                    importVersion={importVersion}
                                  />
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* ==========================================
                VISTA 5: EDICIÓN DE APUNTE LIBRE
               ========================================== */}
            {activeView === 'custom_note_view' && activeCustomNote && (
              <div className="space-y-4">
                <div className="flex items-center justify-between gap-2">
                  <span className="text-xs text-gray-400">
                    {formatNoteDate(activeCustomNote.date, activeCustomNote.createdAt)}
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setNoteToMove(activeCustomNote)}
                      className="text-xs font-medium px-3 py-1.5 rounded-full bg-white dark:bg-[#1C1C1E] border border-black/10 dark:border-white/10 flex items-center gap-1.5"
                    >
                      <svg className="w-3.5 h-3.5 text-[#0A84FF]" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                      </svg>
                      <span>
                        {foldersList.find(f => f.id === activeCustomNote.folderId)?.name || 'Mover a carpeta'}
                      </span>
                    </button>
                  </div>
                </div>

                {/* Selector de color del borde del apunte */}
                <div className="flex items-center gap-2">
                  {NOTE_COLORS.map(c => (
                    <button
                      key={c.id}
                      type="button"
                      onClick={() => handleUpdateCustomNote(activeCustomNote.id, { color: c.hex })}
                      className={`w-6 h-6 rounded-full transition-transform ${activeCustomNote.color === c.hex ? 'scale-125 ring-2 ring-white' : 'opacity-60'}`}
                      style={{ backgroundColor: c.hex }}
                    />
                  ))}
                </div>

                <input
                  type="text"
                  value={activeCustomNote.title}
                  onChange={(e) => handleUpdateCustomNote(activeCustomNote.id, { title: e.target.value })}
                  placeholder="Título"
                  className="w-full bg-transparent text-2xl font-bold outline-none placeholder:text-gray-400 dark:placeholder:text-gray-600"
                />

                <RichNoteEditor
                  noteKey={activeCustomNote.id}
                  initialValue={activeCustomNote.content || ''}
                  onSave={(_, html) => handleUpdateCustomNote(activeCustomNote.id, { content: html })}
                  fontSizeClass={fontSizeClass}
                  placeholder="Nota..."
                  importVersion={importVersion}
                />
              </div>
            )}
          </main>

          {/* MODAL: NUEVA CARPETA */}
          {isFolderModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
              <form
                onSubmit={handleCreateFolder}
                className="w-full max-w-xs rounded-2xl bg-white dark:bg-[#1C1C1E] p-5 space-y-4 shadow-xl"
              >
                <h3 className="text-lg font-bold">Nueva carpeta</h3>
                <input
                  type="text"
                  value={newFolderName}
                  onChange={(e) => setNewFolderName(e.target.value)}
                  placeholder="Nombre de la carpeta"
                  autoFocus
                  className="w-full px-3.5 py-2.5 rounded-xl bg-[#F2F2F7] dark:bg-[#2C2C2E] outline-none text-sm"
                />
                <div className="flex items-center justify-between pt-1">
                  {NOTE_COLORS.map(c => (
                    <button
                      key={c.id}
                      type="button"
                      onClick={() => setNewFolderColor(c.hex)}
                      className={`w-7 h-7 rounded-full ${newFolderColor === c.hex ? 'ring-2 ring-[#0A84FF] scale-110' : 'opacity-60'}`}
                      style={{ backgroundColor: c.hex }}
                    />
                  ))}
                </div>
                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setIsFolderModalOpen(false)}
                    className="py-2.5 rounded-xl bg-black/5 dark:bg-white/10 text-sm font-medium"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    className="py-2.5 rounded-xl bg-[#0A84FF] text-white text-sm font-semibold"
                  >
                    Crear
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: MOVER NOTA A CARPETA */}
          {noteToMove && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
              <div className="w-full max-w-xs rounded-2xl bg-white dark:bg-[#1C1C1E] p-5 space-y-3 shadow-xl">
                <h3 className="text-base font-bold">Mover a carpeta</h3>
                <div className="space-y-1.5 max-h-60 overflow-y-auto">
                  <button
                    type="button"
                    onClick={() => {
                      handleUpdateCustomNote(noteToMove.id, { folderId: null });
                      setNoteToMove(null);
                    }}
                    className={`w-full text-left px-3 py-2.5 rounded-xl text-sm flex items-center justify-between ${!noteToMove.folderId ? 'bg-[#0A84FF]/15 text-[#0A84FF] font-semibold' : 'hover:bg-black/5 dark:hover:bg-white/5'}`}
                  >
                    <span>Sin carpeta (Mis apuntes)</span>
                    {!noteToMove.folderId && <span>✓</span>}
                  </button>
                  {foldersList.map(f => (
                    <button
                      key={f.id}
                      type="button"
                      onClick={() => {
                        handleUpdateCustomNote(noteToMove.id, { folderId: f.id });
                        setNoteToMove(null);
                      }}
                      className={`w-full text-left px-3 py-2.5 rounded-xl text-sm flex items-center justify-between ${noteToMove.folderId === f.id ? 'bg-[#0A84FF]/15 text-[#0A84FF] font-semibold' : 'hover:bg-black/5 dark:hover:bg-white/5'}`}
                    >
                      <span className="flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: f.color }} />
                        <span>{f.name}</span>
                      </span>
                      {noteToMove.folderId === f.id && <span>✓</span>}
                    </button>
                  ))}
                </div>
                <button
                  type="button"
                  onClick={() => setNoteToMove(null)}
                  className="w-full py-2.5 rounded-xl bg-black/5 dark:bg-white/10 text-sm font-medium"
                >
                  Cerrar
                </button>
              </div>
            </div>
          )}

          {/* MODAL: CONFIRMAR ELIMINACIÓN */}
          {confirmDeleteModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
              <div className="w-full max-w-xs rounded-2xl bg-white dark:bg-[#1C1C1E] p-5 text-center space-y-4 shadow-xl">
                <h3 className="text-base font-bold">¿Eliminar "{confirmDeleteModal.title}"?</h3>
                <p className="text-xs text-gray-500 dark:text-gray-400">
                  Esta acción quitará el elemento de tu lista.
                </p>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setConfirmDeleteModal(null)}
                    className="py-2.5 rounded-xl bg-black/5 dark:bg-white/10 text-sm font-medium"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={confirmDeleteItem}
                    className="py-2.5 rounded-xl bg-[#FF3B30] text-white text-sm font-semibold"
                  >
                    Eliminar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BANNER DE NUEVA VERSIÓN DISPONIBLE */}
          {updateAvailable && (
            <div className="fixed bottom-5 inset-x-4 z-50 max-w-md mx-auto rounded-2xl bg-[#1C1C1E] text-white border border-white/15 p-4 shadow-2xl flex items-center justify-between gap-3">
              <div>
                <p className="text-sm font-bold">Hay una nueva versión</p>
                <p className="text-xs text-gray-400">Tus apuntes se conservarán intactos.</p>
              </div>
              <button
                type="button"
                onClick={handleInstallUpdate}
                className="px-4 py-2 rounded-xl bg-[#0A84FF] text-white text-xs font-bold shrink-0 active:scale-95"
              >
                Instalar
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
