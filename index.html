        .ios-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 30px;
        }
        .ios-switch input { opacity: 0; width: 0; height: 0; }
        .ios-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #E5E5EA;
            transition: .3s;
            border-radius: 34px;
        }
        .dark .ios-slider { background-color: #39393D; }
        .ios-slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 2px; bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        input:checked + .ios-slider { background-color: #34C759; }
        input:checked + .ios-slider:before { transform: translateX(20px); }

        /* Animaciones para modales */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1) forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }

              return saved === 'true';

              return saved ? JSON.parse(saved) : [];
          });
          const [deletedPrograms, setDeletedPrograms] = useState(() => {
              const saved = localStorage.getItem('asamblea-deleted-programs');
              return saved ? JSON.parse(saved) : [];
          });
          
          const [customPrograms, setCustomPrograms] = useState([]); // Estado para notas libres
          
          const [showArchived, setShowArchived] = useState(false);
          const longPressTimer = useRef(null);
          const [saveStatus, setSaveStatus] = useState('saved');

          useEffect(() => {
              localStorage.setItem('asamblea-dark', darkMode);
              if (darkMode) {
                  document.documentElement.classList.add('dark');
                  document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: light)"]').setAttribute("content", "#000000");
              } else {
                  document.documentElement.classList.remove('dark');
                  document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: light)"]').setAttribute("content", "#F2F2F7");
              }
          }, [darkMode]);

          useEffect(() => {
            if (!auth) {
                setLoginError("Configuración de Firebase no válida.");
                return;
            }
            signInAnonymously(auth).then(() => {
              setIsDbReady(true);
            }).catch((error) => {
              console.error("Error conectando a la base de datos:", error);
              setLoginError("Error conectando a la base de datos.");
            });
          }, []);

          useEffect(() => {
              localStorage.setItem('asamblea-archived-programs', JSON.stringify(archivedPrograms));
          }, [archivedPrograms]);

          useEffect(() => {
              localStorage.setItem('asamblea-deleted-programs', JSON.stringify(deletedPrograms));
          }, [deletedPrograms]);

          const loadCustomPrograms = async (uname) => {
              if (!db) return;
              try {
                  const docRef = doc(db, 'notes', `${uname}_custom_list`);
                  const snap = await getDoc(docRef);
                  if (snap.exists()) {
                      setCustomPrograms(snap.data().list || []);
                  }
              } catch (e) { console.error("Error cargando notas libres:", e); }
          };

          useEffect(() => {
              if (isDbReady && currentUser) {
                  loadCustomPrograms(currentUser.username);
                  if (selectedProgram) {
                      loadUserNotesForProgram(currentUser.username, selectedProgram.id);
                  }
              }
          }, [isDbReady, currentUser]);

          // Autoguardado para la lista de Notas Libres
          useEffect(() => {
              if (!currentUser || !isDbReady || !db) return;
              const timeoutId = setTimeout(async () => {
                  try {
                      const docRef = doc(db, 'notes', `${currentUser.username}_custom_list`);
                      await setDoc(docRef, { list: customPrograms }, { merge: true });
                  } catch (err) { console.error("Error guardando lista de notas libres:", err); }
              }, 1500);
              return () => clearTimeout(timeoutId);
          }, [customPrograms, currentUser, isDbReady]);

          useEffect(() => {
            if (!currentUser || !isDbReady || !db || !selectedProgram || currentScreen !== 'main') return;
            
            setSaveStatus('saving');
            const timeoutId = setTimeout(async () => {
              try {
                const docId = `${currentUser.username}_${selectedProgram.id}`;
                const notesRef = doc(db, 'notes', docId);
                await setDoc(notesRef, { notes, fontSize }, { merge: true });
                setSaveStatus('saved');
              } catch (err) {
                console.error("Autoguardado falló:", err);

              }

          }, [notes, fontSize, currentUser, isDbReady, selectedProgram, currentScreen]);

              if (notesSnap.exists()) {
                const data = notesSnap.data();
                if (data.notes) setNotes(data.notes);
                if (data.fontSize) setFontSize(data.fontSize);
              } else if (programId === 'asamblea_regional_2026') {
                const oldNotesRef = doc(db, 'notes', uname);
                const oldNotesSnap = await getDoc(oldNotesRef);
                if (oldNotesSnap.exists()) {
                    const oldData = oldNotesSnap.data();
                    if (oldData.notes) setNotes(oldData.notes);
                    if (oldData.fontSize) setFontSize(oldData.fontSize);
                }
              }
            } catch (err) {
                console.error("Error cargando notas:", err);
            }
          };

          const handleSelectProgram = async (program) => {
              setSelectedProgram(program);
              setActiveTab(program.type === '1-day' ? 'unico' : 'viernes');
              if (isDbReady) {
                  await loadUserNotesForProgram(currentUser.username, program.id);
              }
              setCurrentScreen('main');
          };

          const loadAllUsers = async () => {
            if (!db) return;
            try {
              const usersRef = collection(db, 'users');
              const snap = await getDocs(usersRef);
              const loadedUsers = [];
              snap.forEach(document => {
                loadedUsers.push({ username: document.id, role: document.data().role });
              });
              setUsersDB(loadedUsers);
            } catch (err) {}
          };

          const handleLogin = async (e) => {
            e.preventDefault();
            if (!loginForm.username || !isDbReady || !db) return;
            setIsLoggingIn(true);
            setLoginError('');
            
            const uname = loginForm.username.toLowerCase().trim();
            
            try {
              if (uname === 'admin') {
                const adminRef = doc(db, 'users', 'admin');
                await setDoc(adminRef, { role: 'admin' }, { merge: true });
                const adminObj = { username: 'admin', role: 'admin' };
                setCurrentUser(adminObj);
                localStorage.setItem('asamblea-session', JSON.stringify(adminObj));
                setCurrentScreen('admin');
              } else {
                const userRef = doc(db, 'users', uname);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                  const userData = userSnap.data();
                  const userObj = { username: uname, role: userData.role };
                  setCurrentUser(userObj);
                  localStorage.setItem('asamblea-session', JSON.stringify(userObj));
                  setCurrentScreen('programs');
                  setLoginForm({ username: '' });
                } else {
                  setLoginError(`El usuario no existe.`);
                }
              }
            } catch (err) {
              setLoginError(`Error de conexión.`);
            }
            setIsLoggingIn(false);
          };

          const handleCreateUser = async (e) => {
            if (e) e.preventDefault();
            setAdminMessage({ type: '', text: '' });
            if (!newUserForm.username || !isDbReady || !db) return;
            setIsCreatingUser(true);
            
            const uname = newUserForm.username.toLowerCase().trim();
            
            try {
              const userRef = doc(db, 'users', uname);
              const userSnap = await getDoc(userRef);
              
              if (userSnap.exists()) {
                setAdminMessage({ type: 'error', text: 'El usuario ya existe.' });
              } else {
                await setDoc(userRef, { role: 'user' });
                setAdminMessage({ type: 'success', text: 'Creado con éxito.' });
                setNewUserForm({ username: '' });
                loadAllUsers();
              }
            } catch (err) {
              setAdminMessage({ type: 'error', text: `Error de red.` });
            }
            setIsCreatingUser(false);
            setTimeout(() => setAdminMessage({ type: '', text: '' }), 3000);
          };

          const handleLogout = () => {
            localStorage.removeItem('asamblea-session');
            setCurrentUser(null);
            setSelectedProgram(null);
            setNotes({});
            setCurrentScreen('login');
            setShowSettings(false);
          };

          const handleArchiveToggle = () => {
              const programId = actionSheetProgram;
              if (!programId) return;
              if (archivedPrograms.includes(programId)) {
                  setArchivedPrograms(prev => prev.filter(id => id !== programId));
              } else {
                  setArchivedPrograms(prev => [...prev, programId]);
              }
              setActionSheetProgram(null);
          };

          const handleDeleteProgram = () => {
              const programId = actionSheetProgram;
              if (!programId) return;
              
              if (programId.startsWith('custom_')) {
                  setCustomPrograms(prev => prev.filter(p => p.id !== programId));
              } else {
                  setDeletedPrograms(prev => [...prev, programId]);
              }
              setActionSheetProgram(null);
          };

          const handleCreateFreeNote = () => {
              const newId = `custom_${Date.now()}`;
              const newProgram = {
                  id: newId,
                  title: 'Nueva nota',
                  subtitle: 'Apunte personal',
                  isCustom: true,
                  themeColor: '#34C759' // iOS Green
              };
              setCustomPrograms(prev => [newProgram, ...prev]);
              handleSelectProgram(newProgram);
          };

          const handleUpdateCustomTitle = (id, newTitle) => {
              setCustomPrograms(prev => prev.map(p => p.id === id ? { ...p, title: newTitle } : p));
              setSelectedProgram(prev => ({ ...prev, title: newTitle }));
          };

          const handleTouchStart = (programId) => {
              longPressTimer.current = setTimeout(() => {
                  setActionSheetProgram(programId);
              }, 600); 
          };

          const handleTouchEnd = () => {
              if (longPressTimer.current) {
                  clearTimeout(longPressTimer.current);
              }
          };

          const handleNoteChange = (id, text) => {
            const isEmpty = text === "" || text === "<br>" || text === "<div><br></div>";
            if (!id.startsWith('attendance_') && !id.startsWith('repaso_') && !id.startsWith('custom_') && !isEmpty) {
                const plainText = text.replace(/<[^>]+>/g, '').trim();
                if (!plainText.startsWith("Orador:")) {
                    const cleanText = text.replace(/^(<[^>]+>)*Orador:\s*/i, "$1");
                    text = "Orador: " + cleanText;
                }
            }
            setNotes(prev => ({ ...prev, [id]: text }));
          };

          const handleNoteFocus = (id, event) => {
             const val = notes[id];
             const isEmpty = !val || val.trim() === "" || val.trim() === "<br>" || val.trim() === "<div><br></div>";
             if (!id.startsWith('attendance_') && !id.startsWith('repaso_') && !id.startsWith('custom_') && isEmpty) {
                 handleNoteChange(id, "Orador: ");
             }
             setTimeout(() => {
                 const rect = event.target.getBoundingClientRect();
                 const screenHeight = window.innerHeight;
                 if (rect.bottom > screenHeight * 0.6) {
                     event.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                 }
             }, 300);
          };

          const toggleItem = (id) => setExpandedItems(prev => ({ ...prev, [id]: !prev[id] }));
          const increaseFontSize = () => setFontSize(prev => Math.min(prev + 2, 32));
          const decreaseFontSize = () => setFontSize(prev => Math.max(prev - 2, 12));

          const handleExportPDF = () => {
            setShowSettings(false);
            if (!selectedProgram) return;
            setIsExporting(true);

            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
            
            script.onload = () => {
              const element = document.createElement('div');
              element.style.padding = '30px';
              element.style.fontFamily = '-apple-system, sans-serif';
              element.style.color = '#1C1C1E';
              element.style.backgroundColor = '#FFFFFF'; 
              
              let html = `<h1 style="color: ${selectedProgram.themeColor}; text-align: center; margin-bottom: 5px; font-weight: 700;">${selectedProgram.title}</h1><p style="text-align: center; color: #8E8E93; margin-top: 0; margin-bottom: 30px;">${selectedProgram.subtitle}<br><small>Apuntes de: ${currentUser?.username}</small></p>`;
              
              let hasNotes = false;

              if (selectedProgram.isCustom) {
                  if (notes[selectedProgram.id] && notes[selectedProgram.id].trim() !== '') {
                      html += `<div style="white-space: pre-wrap; background-color: #F2F2F7; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; color: #000000;">${notes[selectedProgram.id]}</div>`;
                      hasNotes = true;
                  }
              } else {
                  const tabsToIterate = selectedProgram.type === '3-day' ? ['viernes', 'sabado', 'domingo'] : ['unico'];

                  tabsToIterate.forEach(tab => {
                    let sectionHasNotes = false;
                    let tabName = tab === 'unico' ? 'Programa' : tab.charAt(0).toUpperCase() + tab.slice(1);
                    let sectionHtml = `<h2 style="color: ${selectedProgram.themeColor}; margin-top: 30px; border-bottom: 2px solid ${selectedProgram.themeColor}40; padding-bottom: 8px;">${tabName}</h2>`;

                    selectedProgram.data[tab].forEach(item => {
                        const titleMatch = item.title.match(/^(.*?)\s*(\(.*?\))?$/);
                        const cleanTitle = titleMatch ? titleMatch[1] : item.title;

                        if (notes[item.id] && notes[item.id].trim() !== '' && notes[item.id].trim() !== 'Orador:') {
                            sectionHtml += `<h3 style="color: #000000; margin-top: 20px; margin-bottom: 10px; font-size: 16px;">${cleanTitle}</h3><div style="white-space: pre-wrap; background-color: #F2F2F7; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; color: #000000;">${notes[item.id]}</div>`;
                            sectionHasNotes = true;
                            hasNotes = true;
                        }
                        
                        if (item.type === 'symposium') {
                            item.parts.forEach(part => {
                                const pTitleMatch = part.title.match(/^(.*?)\s*(\(.*?\))?$/);
                                const cleanPTitle = pTitleMatch ? pTitleMatch[1] : part.title;

                                if (notes[part.id] && notes[part.id].trim() !== '' && notes[part.id].trim() !== 'Orador:') {
                                    sectionHtml += `<h4 style="color: #1C1C1E; margin-top: 15px; margin-bottom: 10px; margin-left: 15px; font-size: 15px;">${cleanPTitle}</h4><div style="white-space: pre-wrap; background-color: #F2F2F7; padding: 15px; border-radius: 12px; margin-left: 15px; font-size: 14px; line-height: 1.5; color: #000000;">${notes[part.id]}</div>`;
                                    sectionHasNotes = true;
                                    hasNotes = true;
                                }
                            });
                        }

                        const addAttendanceToPdf = (session, label) => {
                            if (selectedProgram.type === '3-day') {
                                const presencial = parseInt(notes[`attendance_presencial_${tab}_${session}`]) || 0;
                                const stream = parseInt(notes[`attendance_stream_${tab}_${session}`]) || 0;
                                const total = presencial + stream;
                                if (presencial > 0 || stream > 0) {
                                    sectionHtml += `
                                    <div style="margin-top: 20px; padding: 15px; background-color: #F2F2F7; border-radius: 12px;">
                                        <h4 style="color: #8E8E93; margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase;">Asistencia ${label}</h4>
                                        <table style="width: 100%; font-size: 14px; color: #000000;">
                                            <tr>
                                                <td>Presencial: <strong>${presencial}</strong></td>
                                                <td>Stream: <strong>${stream}</strong></td>
                                                <td style="text-align: right;">Total: <strong style="color: ${selectedProgram.themeColor}; font-size: 15px;">${total}</strong></td>
                                            </tr>
                                        </table>
                                    </div>`;
                                    sectionHasNotes = true;
                                    hasNotes = true;
                                }
                            } else {
                                const total = parseInt(notes[`attendance_total_${tab}_${session}`]) || 0;
                                if (total > 0) {
                                    sectionHtml += `
                                    <div style="margin-top: 20px; padding: 15px; background-color: #F2F2F7; border-radius: 12px; display: flex; justify-content: space-between;">
                                        <span style="color: #8E8E93; font-size: 14px; text-transform: uppercase;">Asistencia ${label}</span>
                                        <strong style="color: #000000;">${total}</strong>
                                    </div>`;
                                    sectionHasNotes = true;
                                    hasNotes = true;
                                }
                            }
                        };

                        if (item.isLastMorningItem) addAttendanceToPdf('manana', 'Mañana');
                        if (item.isLastAfternoonItem) addAttendanceToPdf('tarde', 'Tarde');
                    });
                    
                    if (sectionHasNotes) html += sectionHtml;
                  });

                  if (selectedProgram.reviewQuestions) {
                    let reviewHtml = `<h2 style="color: ${selectedProgram.themeColor}; margin-top: 30px; border-bottom: 2px solid ${selectedProgram.themeColor}40; padding-bottom: 8px;">Preguntas de Repaso</h2>`;
                    let reviewHasNotes = false;
                    
                    selectedProgram.reviewQuestions.forEach((q, index) => {
                      const qId = `repaso_${index}`;
                      if (notes[qId] && notes[qId].trim() !== '' && notes[qId].trim() !== 'Orador:') {
                        reviewHtml += `<h3 style="color: #000000; margin-top: 20px; margin-bottom: 10px; font-size: 15px;">${q}</h3><div style="white-space: pre-wrap; background-color: #F2F2F7; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; color: #000000;">${notes[qId]}</div>`;
                        reviewHasNotes = true;
                        hasNotes = true;
                      }
                    });
                    if (reviewHasNotes) html += reviewHtml;
                  }
              }

              if (!hasNotes) html += '<p style="text-align: center; margin-top: 40px; color: #8E8E93;">Sin apuntes.</p>';
              element.innerHTML = html;
              
              window.html2pdf().set({
                margin: 15, filename: `Apuntes_${currentUser?.username}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
              }).from(element).save().then(() => setIsExporting(false));
            };
            document.body.appendChild(script);
          };

          // COMPONENTE: ACTION SHEET (Pulsación Larga)
          const renderActionSheet = () => {
              if (!actionSheetProgram) return null;
              const isArchived = archivedPrograms.includes(actionSheetProgram);
              return (
                  <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40 backdrop-blur-sm pb-8 px-4 animate-fade-in">
                      <div className="w-full max-w-sm animate-slide-up flex flex-col gap-2">
                          <div className="bg-[#F2F2F7]/95 dark:bg-[#1C1C1E]/95 backdrop-blur-xl rounded-xl overflow-hidden text-center text-lg">
                              <button onClick={handleArchiveToggle} className="w-full py-4 text-ios-blue bg-transparent border-b border-[#C6C6C8]/50 dark:border-[#38383A]/50 active:bg-black/10 dark:active:bg-white/10 transition-colors">
                                  {isArchived ? 'Desarchivar' : 'Archivar'}
                              </button>
                              <button onClick={handleDeleteProgram} className="w-full py-4 text-ios-red bg-transparent active:bg-black/10 dark:active:bg-white/10 transition-colors font-medium">
                                  Eliminar de la lista
                              </button>
                          </div>
                          <button onClick={() => setActionSheetProgram(null)} className="w-full py-4 text-ios-blue font-semibold bg-white dark:bg-[#1C1C1E] rounded-xl active:bg-gray-100 dark:active:bg-gray-800 transition-colors text-lg">
                              Cancelar
                          </button>
                      </div>
                  </div>
              );
          };

          // COMPONENTE: SETTINGS MODAL (Bottom Sheet)
          const renderSettingsModal = () => {
              if (!showSettings) return null;
              return (
                  <div className="fixed inset-0 z-50 flex flex-col justify-end bg-black/40 backdrop-blur-sm animate-fade-in">
                      <div className="bg-[#F2F2F7] dark:bg-[#000000] w-full h-[85vh] rounded-t-2xl shadow-ios-dark flex flex-col animate-slide-up">
                          {/* Header del Modal */}
                          <div className="flex items-center justify-between p-4 border-b border-[#C6C6C8] dark:border-[#38383A] bg-white dark:bg-[#1C1C1E] rounded-t-2xl">
                              <div className="w-16"></div>
                              <h2 className="font-semibold text-lg">Configuración</h2>
                              <button onClick={() => setShowSettings(false)} className="w-16 text-right text-ios-blue font-semibold text-lg">Listo</button>
                          </div>
                          
                          {/* Contenido (Listas Estilo iOS) */}
                          <div className="flex-1 overflow-y-auto p-4 space-y-6">
                              
                              {/* Sección: Apariencia */}
                              <div>
                                  <p className="text-[13px] text-[#8E8E93] uppercase pl-4 mb-1.5 font-medium">Apariencia</p>
                                  <div className="bg-white dark:bg-[#1C1C1E] rounded-xl overflow-hidden">
                                      <div className="flex items-center justify-between p-3.5">
                                          <span className="text-[17px]">Modo Oscuro</span>
                                          <label className="ios-switch">
                                              <input type="checkbox" checked={darkMode} onChange={() => setDarkMode(!darkMode)} />
                                              <span className="ios-slider"></span>
                                          </label>
                                      </div>
                                  </div>
                              </div>

                              {/* Sección: Apuntes (Solo visible si hay un programa activo) */}
                              {currentScreen === 'main' && (
                                  <div>
                                      <p className="text-[13px] text-[#8E8E93] uppercase pl-4 mb-1.5 font-medium">Apuntes</p>
                                      <div className="bg-white dark:bg-[#1C1C1E] rounded-xl overflow-hidden">
                                          <div className="flex items-center justify-between p-3.5 border-b border-[#C6C6C8] dark:border-[#38383A]">
                                              <span className="text-[17px]">Tamaño del texto</span>
                                              <div className="flex items-center gap-4">
                                                  <button onClick={decreaseFontSize} className="text-ios-blue text-2xl px-2 active:opacity-50">−</button>
                                                  <span className="text-[17px] w-6 text-center">{fontSize}</span>
                                                  <button onClick={increaseFontSize} className="text-ios-blue text-2xl px-2 active:opacity-50">+</button>
                                              </div>
                                          </div>
                                          <button onClick={handleExportPDF} disabled={isExporting} className="w-full text-left flex items-center p-3.5 active:bg-gray-100 dark:active:bg-gray-800 transition-colors disabled:opacity-50">
                                              <Share size={20} className="text-ios-blue mr-3" />
                                              <span className="text-[17px] text-ios-blue">{isExporting ? 'Generando PDF...' : 'Exportar a PDF'}</span>
                                          </button>
                                      </div>
                                  </div>
                              )}

                              {/* Sección: Programas (Filtro) */}
                              {currentScreen === 'programs' && (
                                  <div>
                                      <p className="text-[13px] text-[#8E8E93] uppercase pl-4 mb-1.5 font-medium">Programas</p>
                                      <div className="bg-white dark:bg-[#1C1C1E] rounded-xl overflow-hidden">
                                          <button onClick={() => { setShowArchived(!showArchived); setShowSettings(false); }} className="w-full text-left flex items-center justify-between p-3.5 active:bg-gray-100 dark:active:bg-gray-800 transition-colors">
                                              <div className="flex items-center">
                                                  <Archive size={20} className="text-ios-blue mr-3" />
                                                  <span className="text-[17px]">{showArchived ? 'Ocultar Archivados' : 'Ver Archivados'}</span>
                                              </div>
                                              <span className="text-[#8E8E93] text-[17px]">{archivedPrograms.length}</span>
                                          </button>
                                      </div>
                                  </div>
                              )}

                              {/* Sección: Cuenta */}
                              <div>
                                  <p className="text-[13px] text-[#8E8E93] uppercase pl-4 mb-1.5 font-medium">Cuenta ({currentUser?.username})</p>
                                  <div className="bg-white dark:bg-[#1C1C1E] rounded-xl overflow-hidden">
                                      {currentUser?.role === 'admin' && (
                                          <button onClick={() => { setShowSettings(false); setCurrentScreen('admin'); }} className="w-full text-left p-3.5 border-b border-[#C6C6C8] dark:border-[#38383A] active:bg-gray-100 dark:active:bg-gray-800 transition-colors">
                                              <span className="text-[17px] text-ios-blue">Panel de Administrador</span>
                                          </button>
                                      )}
                                      <button onClick={handleLogout} className="w-full text-left p-3.5 text-ios-red active:bg-gray-100 dark:active:bg-gray-800 transition-colors">
                                          <span className="text-[17px]">Cerrar sesión</span>
                                      </button>
                                  </div>
                              </div>

                          </div>
                      </div>
                  </div>
              );
          };

          if (currentScreen === 'login') {
            return (
              <div className="min-h-screen flex flex-col justify-center px-6">
                <div className="max-w-sm w-full mx-auto">
                  <div className="text-center mb-10">
                    <h1 className="text-4xl font-bold tracking-tight mb-2">Mis Apuntes</h1>
                    <p className="text-[#8E8E93] text-[17px]">Inicia sesión para continuar</p>
                  </div>
                  
                  {!isDbReady ? (
                      <div className="flex justify-center py-4">
                        <Loader2 className="animate-spin text-[#8E8E93]" size={32} />
                      </div>
                  ) : (
                      <form onSubmit={handleLogin} className="space-y-6">
                        {loginError && <p className="text-ios-red text-center text-[15px]">{loginError}</p>}
                        
                        <div className="bg-white dark:bg-[#1C1C1E] rounded-xl overflow-hidden border border-[#C6C6C8] dark:border-[#38383A]">
                            <input 
                              type="text" value={loginForm.username}
                              onChange={(e) => setLoginForm({username: e.target.value})}
                              className="w-full p-4 text-[17px] bg-transparent focus:outline-none"
                              placeholder="Tu usuario"
                              autoCapitalize="none"
                              autoCorrect="off"
                            />
                        </div>
                        
                        <button type="submit" disabled={isLoggingIn} className="w-full bg-ios-blue text-white font-semibold text-[17px] py-3.5 rounded-xl active:opacity-80 transition-opacity flex justify-center items-center">
                          {isLoggingIn ? <Loader2 className="animate-spin" size={20} /> : 'Continuar'}
                        </button>
                      </form>
                  )}
                </div>
              </div>
            );
          }

          if (currentScreen === 'admin') {
            return (
              <div className="min-h-screen pb-20">
                <div className="bg-white/80 dark:bg-black/80 backdrop-blur-md sticky top-0 z-40 border-b border-[#C6C6C8] dark:border-[#38383A] px-4 py-3 flex items-center justify-between">
                    <button onClick={() => setCurrentScreen('programs')} className="flex items-center text-ios-blue text-[17px]">
                        <ChevronLeft size={24} className="-ml-1" /> Atrás
                    </button>
                    <span className="font-semibold text-[17px]">Administración</span>
                    <div className="w-16"></div> {/* Spacer */}
                </div>

                <div className="max-w-md mx-auto p-4 mt-4">
                    <h2 className="text-[28px] font-bold tracking-tight mb-6">Nuevo Usuario</h2>
                    
                    {adminMessage.text && (
                        <p className={`mb-4 text-center ${adminMessage.type === 'error' ? 'text-ios-red' : 'text-ios-green'}`}>
                            {adminMessage.text}
                        </p>
                    )}
                    
                    <div className="bg-white dark:bg-[#1C1C1E] rounded-xl overflow-hidden mb-6">
                        <div className="flex items-center p-4 border-b border-[#C6C6C8] dark:border-[#38383A]">
                            <span className="w-24 text-[17px]">Nombre</span>
                            <input 
                                type="text" value={newUserForm.username}
                                onChange={(e) => setNewUserForm({username: e.target.value})}
                                className="flex-1 text-[17px] bg-transparent focus:outline-none"
                                placeholder="Ej. juan"
                                autoCapitalize="none"
                            />
                        </div>
                    </div>
                    <button type="button" onClick={handleCreateUser} disabled={isCreatingUser} className="w-full bg-ios-blue text-white font-semibold text-[17px] py-3.5 rounded-xl active:opacity-80 transition-opacity flex justify-center">
                        {isCreatingUser ? <Loader2 className="animate-spin" size={20} /> : 'Crear Usuario'}
                    </button>

                    <h2 className="text-[20px] font-semibold mt-10 mb-4 pl-2">Usuarios Activos ({usersDB.length})</h2>
                </div>
              </div>
            );
          }

          if (currentScreen === 'programs') {
            const availablePrograms = programsDB.filter(p => !deletedPrograms.includes(p.id));
            const displayedPrograms = availablePrograms.filter(p => showArchived ? archivedPrograms.includes(p.id) : !archivedPrograms.includes(p.id));

            return (
              <div className="min-h-screen pb-20">
                {/* Header (iOS Style) */}
                <div className="px-4 pt-12 pb-2 flex justify-between items-end">
                    <h1 className="text-[34px] font-bold tracking-tight">Mis Apuntes</h1>
                    <div className="flex items-center gap-1">
                        <button onClick={handleCreateFreeNote} className="p-2 text-ios-blue bg-ios-blue/10 rounded-full mb-1">
                            <Plus size={24} />
                        </button>
                        <button onClick={() => setShowSettings(true)} className="p-2 -mr-2 text-ios-blue bg-ios-blue/10 rounded-full mb-1">
                            <MoreHorizontal size={24} />
                        </button>
                    </div>
                </div>

                <main className="max-w-2xl mx-auto px-4 mt-2">
                    {/* NOTAS LIBRES */}
                    {customPrograms.length > 0 && !showArchived && (
                        <>
                            <p className="text-[13px] text-[#8E8E93] uppercase pl-2 mb-2 font-medium">Mis Notas</p>
                            <div className="bg-white dark:bg-[#1C1C1E] rounded-[10px] overflow-hidden mb-8">
                                {customPrograms.map((prog, index) => (
                                    <div key={prog.id} className="relative">
                                        <div 
                                            onClick={() => actionSheetProgram !== prog.id && handleSelectProgram(prog)}
                                            onTouchStart={() => handleTouchStart(prog.id)}
                                            onTouchEnd={handleTouchEnd}
                                            onTouchMove={handleTouchEnd}
                                            className={`flex items-center p-4 active:bg-[#E5E5EA] dark:active:bg-[#2C2C2E] transition-colors cursor-pointer ${index !== customPrograms.length - 1 ? 'border-b border-[#C6C6C8] dark:border-[#38383A] ml-4 pl-0' : ''}`}
                                        >
                                            <div className="w-1.5 h-12 rounded-full mr-4 shrink-0" style={{backgroundColor: prog.themeColor}}></div>
                                            <div className="flex-1 truncate pr-4">
                                                <h3 className="text-[17px] font-semibold truncate leading-tight mb-1">{prog.title}</h3>
                                                <p className="text-[15px] text-[#8E8E93] truncate">{prog.subtitle}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}

                    <p className="text-[13px] text-[#8E8E93] uppercase pl-2 mb-2 font-medium">
                        {showArchived ? 'Programas Archivados' : 'Programas de Asamblea'}
                    </p>
                    
                    <div className="bg-white dark:bg-[#1C1C1E] rounded-[10px] overflow-hidden">
                        {displayedPrograms.length === 0 ? (
                            <div className="p-6 text-center text-[#8E8E93] text-[17px]">
                                {showArchived ? 'No hay elementos archivados.' : 'No hay programas disponibles.'}
                            </div>
                        ) : (
                            displayedPrograms.map((prog, index) => (
                                <div key={prog.id} className="relative">
                                    <div 
                                        onClick={() => actionSheetProgram !== prog.id && handleSelectProgram(prog)}
                                        onTouchStart={() => handleTouchStart(prog.id)}
                                        onTouchEnd={handleTouchEnd}
                                        onTouchMove={handleTouchEnd}
                                        onMouseDown={() => handleTouchStart(prog.id)}
                                        onMouseUp={handleTouchEnd}
                                        onMouseLeave={handleTouchEnd}
                                        className={`flex items-center p-4 active:bg-[#E5E5EA] dark:active:bg-[#2C2C2E] transition-colors cursor-pointer ${index !== displayedPrograms.length - 1 ? 'border-b border-[#C6C6C8] dark:border-[#38383A] ml-4 pl-0' : ''}`}
                                    >
                                        <div className="w-1.5 h-12 rounded-full mr-4 shrink-0" style={{backgroundColor: prog.themeColor}}></div>
                                        <div className="flex-1 truncate pr-4">
                                            <h3 className="text-[17px] font-semibold truncate leading-tight mb-1">{prog.title}</h3>
                                            <p className="text-[15px] text-[#8E8E93] truncate">{prog.subtitle}</p>
                                        </div>
                                        <div className="text-[15px] text-[#8E8E93] flex items-center gap-1 shrink-0">
                                            {prog.type === '3-day' ? '3 Días' : '1 Día'}
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </main>

                {renderActionSheet()}
                {renderSettingsModal()}
              </div>
            );
          }

          const renderAttendanceInput = (sessionType) => {
            if (!selectedProgram) return null;

            if (selectedProgram.type === '3-day') {
                const idPresencial = `attendance_presencial_${activeTab}_${sessionType}`;
                const idStream = `attendance_stream_${activeTab}_${sessionType}`;
                const presencial = parseInt(notes[idPresencial]) || 0;
                const stream = parseInt(notes[idStream]) || 0;
                const total = presencial + stream;

                return (
                  <div className="mt-6 mb-4">
                    <p className="text-[13px] text-[#8E8E93] uppercase pl-4 mb-1.5 font-medium">Asistencia ({sessionType === 'manana' ? 'Mañana' : 'Tarde'})</p>
                    <div className="bg-white dark:bg-[#1C1C1E] rounded-[10px] overflow-hidden">
                        <div className="flex items-center p-3.5 border-b border-[#C6C6C8] dark:border-[#38383A]">
                            <span className="w-32 text-[17px]">Presencial</span>
                            <input type="number" value={notes[idPresencial] || ''} onChange={(e) => setNotes(prev => ({ ...prev, [idPresencial]: e.target.value }))} className="flex-1 text-right text-[17px] text-[#8E8E93] bg-transparent focus:outline-none" placeholder="0" />
                        </div>
                        <div className="flex items-center p-3.5 border-b border-[#C6C6C8] dark:border-[#38383A]">
                            <span className="w-32 text-[17px]">JW Stream</span>
                            <input type="number" value={notes[idStream] || ''} onChange={(e) => setNotes(prev => ({ ...prev, [idStream]: e.target.value }))} className="flex-1 text-right text-[17px] text-[#8E8E93] bg-transparent focus:outline-none" placeholder="0" />
                        </div>
                        <div className="flex items-center p-3.5 bg-[#F2F2F7] dark:bg-[#000000]">
                            <span className="w-32 text-[17px] font-semibold">Total</span>
                            <div className="flex-1 text-right text-[17px] font-bold" style={{color: selectedProgram.themeColor}}>{total}</div>
                        </div>
                    </div>
                  </div>
                );
            } else {
                const idTotal = `attendance_total_${activeTab}_${sessionType}`;
                const total = parseInt(notes[idTotal]) || 0;

                return (
                  <div className="mt-6 mb-4">
                    <div className="bg-white dark:bg-[#1C1C1E] rounded-[10px] overflow-hidden">
                        <div className="flex items-center justify-between p-3.5">
                            <span className="text-[17px]">Asistencia ({sessionType === 'manana' ? 'Mañana' : 'Tarde'})</span>
                            <input type="number" value={notes[idTotal] || ''} onChange={(e) => setNotes(prev => ({ ...prev, [idTotal]: e.target.value }))} className="w-24 text-right text-[17px] font-bold bg-[#F2F2F7] dark:bg-[#000000] p-1.5 rounded-lg focus:outline-none" placeholder="Total" style={{color: total > 0 ? selectedProgram.themeColor : ''}} />
                        </div>
                    </div>
                  </div>
                );
            }
          };

          return (
            <div className="min-h-screen pb-20">
              {renderSettingsModal()}

              {/* iOS Navigation Bar */ }
              <header className="sticky top-0 z-40 bg-[#F2F2F7]/80 dark:bg-[#000000]/80 backdrop-blur-md border-b border-[#C6C6C8] dark:border-[#38383A]">
                 <div className="flex items-center justify-between px-2 h-12">
                     <button onClick={() => setCurrentScreen('programs')} className="flex items-center text-ios-blue text-[17px] active:opacity-50 w-24">
                         <ChevronLeft size={24} className="-ml-1" /> Apuntes
                     </button>
                     
                     <div className="flex-1 text-center truncate px-2 flex flex-col items-center justify-center">
                         <span className="font-semibold text-[15px] truncate block w-full">{selectedProgram?.title}</span>
                         {saveStatus === 'saving' ? (
                             <span className="text-[10px] text-[#8E8E93] uppercase font-bold flex items-center gap-1"><Loader2 size={10} className="animate-spin"/> Guardando</span>
                         ) : (
                             <span className="text-[10px] text-[#8E8E93] uppercase font-bold flex items-center gap-1"><Cloud size={10}/> En la nube</span>
                         )}
                     </div>

                     <div className="w-24 flex justify-end">
                         <button onClick={() => setShowSettings(true)} className="p-2 text-ios-blue active:opacity-50">
                             <MoreHorizontal size={24} />
                         </button>
                     </div>
                 </div>

                 {/* iOS Segmented Control */}
                 {!selectedProgram?.isCustom && (
                     <div className="px-4 pb-3 pt-1">
                        {selectedProgram?.type === '1-day' ? (
                            <div className="bg-[#E5E5EA] dark:bg-[#1C1C1E] p-0.5 rounded-[9px] flex">
                            <button onClick={() => setActiveTab('repaso')} className={`flex-1 py-1.5 text-[13px] font-medium rounded-md transition-all ${activeTab === 'repaso' ? 'bg-white dark:bg-[#3A3A3C] shadow text-black dark:text-white' : 'text-[#8E8E93]'}`}>Repaso</button>
                        </div>
                    ) : (
                        <div className="bg-[#E5E5EA] dark:bg-[#1C1C1E] p-0.5 rounded-[9px] flex">
                            <button onClick={() => setActiveTab('viernes')} className={`flex-1 py-1.5 text-[13px] font-medium rounded-md transition-all ${activeTab === 'viernes' ? 'bg-white dark:bg-[#3A3A3C] shadow text-black dark:text-white' : 'text-[#8E8E93]'}`}>Viernes</button>
                            <button onClick={() => setActiveTab('sabado')} className={`flex-1 py-1.5 text-[13px] font-medium rounded-md transition-all ${activeTab === 'sabado' ? 'bg-white dark:bg-[#3A3A3C] shadow text-black dark:text-white' : 'text-[#8E8E93]'}`}>Sábado</button>
                            <button onClick={() => setActiveTab('domingo')} className={`flex-1 py-1.5 text-[13px] font-medium rounded-md transition-all ${activeTab === 'domingo' ? 'bg-white dark:bg-[#3A3A3C] shadow text-black dark:text-white' : 'text-[#8E8E93]'}`}>Domingo</button>
                        </div>
                        )}
                     </div>
                 )}
              </header>

              <main className="max-w-2xl mx-auto px-4 mt-4">
                  {/* VISTA DE NOTA LIBRE */}
                  {selectedProgram?.isCustom && (
                      <div className="animate-fade-in flex flex-col h-full">
                          <input 
                              type="text"
                              value={selectedProgram.title}
                              onChange={(e) => handleUpdateCustomTitle(selectedProgram.id, e.target.value)}
                              className="text-[34px] font-bold bg-transparent focus:outline-none mb-4 w-full text-black dark:text-white px-2"
                              placeholder="Título de la nota"
                          />
                          <div className="flex-1 mb-8">
                              <RichNoteEditor 
                                  id={selectedProgram.id} value={notes[selectedProgram.id] || ''} onChange={handleNoteChange}
                                  onFocus={handleNoteFocus} fontSize={fontSize} placeholder="Escribe tus apuntes aquí..."
                              />
                          </div>
                      </div>
                  )}

                  {/* VISTA DE PROGRAMA NORMAL */}
                  {!selectedProgram?.isCustom && activeTab !== 'repaso' && selectedProgram?.data[activeTab]?.map((item, index) => {
                    const isMorningStart = index === 0;
                    const isAfternoonStart = item.isAfternoonStartItem;
                    const isLastMorningItem = item.isLastMorningItem;
                    const isLastAfternoonItem = item.isLastAfternoonItem;

                    const titleMatch = item.title.match(/^(.*?)\s*(\(.*?\))?$/);
                    const mainTitle = titleMatch ? titleMatch[1] : item.title;
                    const bibleRef = titleMatch && titleMatch[2] ? titleMatch[2] : null;

                    return (
                      <React.Fragment key={item.id}>
                        {isMorningStart && <p className="text-[13px] text-[#8E8E93] uppercase pl-2 mb-2 mt-4 font-medium">Sesión de la Mañana</p>}
                        {isAfternoonStart && <p className="text-[13px] text-[#8E8E93] uppercase pl-2 mb-2 mt-8 font-medium">Sesión de la Tarde</p>}

                        <div className="mb-4">
                            <div className="bg-white dark:bg-[#1C1C1E] rounded-[10px] overflow-hidden shadow-sm">
                                <div 
                                    className={`p-4 ${item.type === 'talk' ? 'active:bg-[#E5E5EA] dark:active:bg-[#2C2C2E] cursor-pointer' : ''}`}
                                    onClick={item.type === 'talk' ? () => toggleItem(item.id) : undefined}
                                >
                                    <div className="flex gap-3">
                                        <span className="text-[15px] font-medium text-[#8E8E93] w-10 shrink-0">{item.time}</span>
                                        <div className="flex-1 pr-2">
                                            <h3 className={`text-[17px] leading-snug ${item.type === 'info' ? 'font-semibold text-ios-blue' : 'font-semibold text-black dark:text-white'}`}>{mainTitle}</h3>
                                            {bibleRef && <p className="text-[14px] text-[#8E8E93] mt-1">{bibleRef}</p>}
                                        </div>
                                        {item.type === 'talk' && (
                                            <div className="shrink-0 text-[#C6C6C8] dark:text-[#38383A] flex items-center">
                                                {expandedItems[item.id] ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {item.type === 'talk' && expandedItems[item.id] && (
                                    <div className="px-4 pb-4 pt-1 bg-[#F2F2F7] dark:bg-black border-t border-[#C6C6C8] dark:border-[#38383A]">
                                        <RichNoteEditor 
                                            id={item.id} value={notes[item.id] || ''} onChange={handleNoteChange}
                                            onFocus={handleNoteFocus} fontSize={fontSize} placeholder="Escribe tus apuntes aquí..."
                                        />
                                    </div>
                                )}

                                {item.type === 'symposium' && (
                                    <div className="border-t border-[#C6C6C8] dark:border-[#38383A]">
                                        {item.parts.map((part, pIndex) => {
                                            const pTitleMatch = part.title.match(/^(.*?)\s*(\(.*?\))?$/);
                                            const pMainTitle = pTitleMatch ? pTitleMatch[1] : part.title;
                                            const pBibleRef = pTitleMatch && pTitleMatch[2] ? pTitleMatch[2] : null;
                                            return (
                                                <div key={part.id} className="relative">
                                                    {pIndex !== 0 && <div className="absolute top-0 left-12 right-0 h-[1px] bg-[#C6C6C8] dark:bg-[#38383A]"></div>}
                                                    <div 
                                                        className="p-4 pl-12 pr-4 active:bg-[#E5E5EA] dark:active:bg-[#2C2C2E] cursor-pointer flex justify-between"
                                                        onClick={() => toggleItem(part.id)}
                                                    >
                                                        <div className="flex-1 pr-2 relative">
                                                            <div className="absolute -left-6 top-1 w-2 h-2 rounded-full border-2 border-ios-blue"></div>
                                                            <h4 className="text-[17px] font-medium leading-snug">{pMainTitle}</h4>
                                                            {pBibleRef && <p className="text-[14px] text-[#8E8E93] mt-1">{pBibleRef}</p>}
                                                        </div>
                                                        <div className="shrink-0 text-[#C6C6C8] dark:text-[#38383A] flex items-center">
                                                            {expandedItems[part.id] ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                                                        </div>
                                                    </div>
                                                    {expandedItems[part.id] && (
                                                        <div className="px-4 pb-4 pt-1 bg-[#F2F2F7] dark:bg-black border-t border-[#C6C6C8] dark:border-[#38383A]">
                                                            <RichNoteEditor 
                                                                id={part.id} value={notes[part.id] || ''} onChange={handleNoteChange}
                                                                onFocus={handleNoteFocus} fontSize={fontSize} placeholder="Escribe tus apuntes aquí..."
                                                            />
                                                        </div>
                                                    )}
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        {isLastMorningItem && renderAttendanceInput('manana')}
                        {isLastAfternoonItem && renderAttendanceInput('tarde')}
                        
                      </React.Fragment>
                    );
                  })}

                  {/* PREGUNTAS DE REPASO */}
                  {selectedProgram?.reviewQuestions && activeTab === 'repaso' && (
                    <div className="space-y-4 pb-8 mt-4">
                      {selectedProgram.reviewQuestions.map((question, index) => {
                        const qId = `repaso_${index}`;
                        return (
                          <div key={qId} className="bg-white dark:bg-[#1C1C1E] rounded-[10px] overflow-hidden shadow-sm">
                            <div 
                              className="p-4 active:bg-[#E5E5EA] dark:active:bg-[#2C2C2E] cursor-pointer flex justify-between"
                              onClick={() => toggleItem(qId)}
                            >
                              <div className="flex-1 pr-2">
                                 <h3 className="font-semibold text-[17px] leading-snug">{question}</h3>
                              </div>
                              <div className="shrink-0 text-[#C6C6C8] dark:text-[#38383A] flex items-center">
                                  {expandedItems[qId] ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                              </div>
                            </div>
                            
                            {expandedItems[qId] && (
                                <div className="px-4 pb-4 pt-1 bg-[#F2F2F7] dark:bg-black border-t border-[#C6C6C8] dark:border-[#38383A]">
                                   <RichNoteEditor 
                                        id={qId} value={notes[qId] || ''} onChange={handleNoteChange}
                                        onFocus={handleNoteFocus} fontSize={fontSize} placeholder="Escribe tu respuesta aquí..."
                                    />
                                </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

              </main>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body></html>
