    const RichNoteEditor = ({ id, value, onChange, placeholder, fontSize, isCustomNote = false }) => {
      const mountRef = useRef(null);
      const editorNodeRef = useRef(null);
      const onChangeRef = useRef(onChange);
      onChangeRef.current = onChange;

      const [activeFormats, setActiveFormats] = useState({ bold: false, underline: false });

      const checkActiveFormats = () => {
        if (!editorNodeRef.current) return;
        try {
          const isBold = document.queryCommandState('bold');
          const isUnderline = document.queryCommandState('underline');
          setActiveFormats(prev => (
            prev.bold === isBold && prev.underline === isUnderline
              ? prev
              : { bold: isBold, underline: isUnderline }
          ));
        } catch (e) {}
      };

      // Crear el nodo contentEditable de forma imperativa para que React jamás toque sus hijos internos
      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        container.innerHTML = '';
        const div = document.createElement('div');
        div.contentEditable = 'true';
        div.setAttribute('data-placeholder', placeholder || '');
        div.className = 'p-4 min-h-[140px] focus:outline-none text-black dark:text-white bg-white dark:bg-[#1C1C1E] leading-relaxed whitespace-pre-wrap break-words';
        div.style.fontSize = `${fontSize}px`;

        const defaultContent = (!value && !isCustomNote && !id.includes('rep')) ? '<b>Orador: </b><br><br>' : (value || '');
        div.innerHTML = value || defaultContent;

        const handleInput = () => {
          if (onChangeRef.current) {
            onChangeRef.current(div.innerHTML);
          }
          checkActiveFormats();
        };

        div.addEventListener('input', handleInput);
        div.addEventListener('keyup', checkActiveFormats);
        div.addEventListener('mouseup', checkActiveFormats);
        div.addEventListener('touchend', checkActiveFormats);
        div.addEventListener('focus', checkActiveFormats);

        container.appendChild(div);
        editorNodeRef.current = div;

        return () => {
          div.removeEventListener('input', handleInput);
          div.removeEventListener('keyup', checkActiveFormats);
          div.removeEventListener('mouseup', checkActiveFormats);
          div.removeEventListener('touchend', checkActiveFormats);
          div.removeEventListener('focus', checkActiveFormats);
        };
      }, [id]);

      useEffect(() => {
        if (editorNodeRef.current) {
          editorNodeRef.current.style.fontSize = `${fontSize}px`;
        }
      }, [fontSize]);

      useEffect(() => {
        const handleSelectionChange = () => {
          if (editorNodeRef.current && document.activeElement === editorNodeRef.current) {
            checkActiveFormats();
          }
        };
        document.addEventListener('selectionchange', handleSelectionChange);
        return () => document.removeEventListener('selectionchange', handleSelectionChange);
      }, []);

      const applyFormat = (e, command, arg = null) => {
        e.preventDefault();
        const ed = editorNodeRef.current;
        if (!ed) return;
        try {
          ed.focus();
          document.execCommand(command, false, arg);
          if (onChangeRef.current) {
            onChangeRef.current(ed.innerHTML);
          }
          checkActiveFormats();
        } catch (err) {}
      };

      const insertText = (e, text) => {
        e.preventDefault();
        const ed = editorNodeRef.current;
        if (!ed) return;
        try {
          ed.focus();
          document.execCommand('insertText', false, text);
          if (onChangeRef.current) {
            onChangeRef.current(ed.innerHTML);
          }
        } catch (err) {}
      };

      return (
        <div className="mt-3 rounded-[14px] overflow-hidden border border-[#C6C6C8]/60 dark:border-[#38383A] bg-white dark:bg-[#1C1C1E] shadow-sm transition-colors">
          <div className="flex items-center gap-1.5 px-3 py-2 bg-[#F2F2F7] dark:bg-[#2C2C2E] border-b border-[#C6C6C8]/50 dark:border-[#38383A] overflow-x-auto">
            <button
              type="button"
              onMouseDown={(e) => applyFormat(e, 'bold')}
              aria-pressed={activeFormats.bold}
              className={`w-9 h-8 rounded-[8px] font-bold text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0 ${
                activeFormats.bold
                  ? 'bg-[#007AFF] text-white ring-2 ring-[#007AFF]/30'
                  : 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white'
              }`}
            >
              B
            </button>
            <button
              type="button"
              onMouseDown={(e) => applyFormat(e, 'underline')}
              aria-pressed={activeFormats.underline}
              className={`w-9 h-8 rounded-[8px] underline font-semibold text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0 ${
                activeFormats.underline
                  ? 'bg-[#007AFF] text-white ring-2 ring-[#007AFF]/30'
                  : 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white'
              }`}
            >
              U
            </button>
            <div className="w-px h-5 bg-[#C6C6C8] dark:bg-[#48484A] mx-1 shrink-0"></div>
            <button type="button" onMouseDown={(e) => insertText(e, '\n• ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-black dark:text-white font-bold text-[18px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">•</button>
            <div className="w-px h-5 bg-[#C6C6C8] dark:bg-[#48484A] mx-1 shrink-0"></div>
            <button type="button" onMouseDown={(e) => insertText(e, '💎 ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">💎</button>
            <button type="button" onMouseDown={(e) => insertText(e, '❤️ ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">❤️</button>
            <button type="button" onMouseDown={(e) => insertText(e, '✅ ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">✅</button>
          </div>
          <div ref={mountRef}></div>
        </div>
      );
    };

    function App() {
      const rescueAndLoadUserData = (username) => {
        const cleanU = (username || '').trim().toLowerCase();
        let mergedNotes = {};
        let mergedCustomList = [];
        const seenCustomIds = {};

        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!key) continue;

            if (key.startsWith('asamblea-notas-')) {
              try {
                const parsedN = JSON.parse(localStorage.getItem(key) || '{}');
                if (parsedN && typeof parsedN === 'object') {
                  Object.keys(parsedN).forEach(noteKey => {
                    if (parsedN[noteKey] && (!mergedNotes[noteKey] || String(parsedN[noteKey]).length > String(mergedNotes[noteKey]).length)) {
                      mergedNotes[noteKey] = parsedN[noteKey];
                    }
                  });
                }
              } catch (e) {}
            }

            if (key.startsWith('asamblea-custom-list-')) {
              try {
                const parsedL = JSON.parse(localStorage.getItem(key) || '[]');
                if (Array.isArray(parsedL)) {
                  parsedL.forEach(item => {
                    if (item && item.id && !seenCustomIds[item.id]) {
                      seenCustomIds[item.id] = true;
                      mergedCustomList.push(item);
                    }
                  });
                }
              } catch (e) {}
            }
          }

          if (cleanU) {
            const userNotesRaw = localStorage.getItem(`asamblea-notas-${cleanU}`);
            if (userNotesRaw) {
              const userNotes = JSON.parse(userNotesRaw);
              mergedNotes = { ...mergedNotes, ...userNotes };
            }
          }

          Object.keys(mergedNotes).forEach(noteId => {
            if (noteId.startsWith('custom_') && !seenCustomIds[noteId]) {
              seenCustomIds[noteId] = true;
              const timestamp = parseInt(noteId.replace('custom_', ''), 10) || Date.now();
              mergedCustomList.push({
                id: noteId,
                title: 'Nota recuperada',
                createdAt: timestamp
              });
            }
          });

          mergedCustomList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

          if (cleanU) {
            localStorage.setItem(`asamblea-notas-${cleanU}`, JSON.stringify(mergedNotes));
            localStorage.setItem(`asamblea-custom-list-${cleanU}`, JSON.stringify(mergedCustomList));
          }
        } catch (e) {}

        return { notes: mergedNotes, customList: mergedCustomList };
      };

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const savedUser = localStorage.getItem('asamblea-active-user');
          if (savedUser) return JSON.parse(savedUser);
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('asamblea-notas-')) {
              const extractedUser = k.replace('asamblea-notas-', '').trim();
              if (extractedUser) {
                const uObj = { username: extractedUser };
                localStorage.setItem('asamblea-active-user', JSON.stringify(uObj));
                return uObj;
              }
            }
          }
          return null;
        } catch (e) { return null; }
      });

      const [currentScreen, setCurrentScreen] = useState(() => {
        try {
          if (localStorage.getItem('asamblea-active-user')) return 'programs';
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('asamblea-notas-')) return 'programs';
          }
          return 'login';
        } catch (e) { return 'login'; }
      });

      const [isDbReady] = useState(true);
      const [loginForm, setLoginForm] = useState({ username: '' });
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      const initialDataRef = useRef(null);
      if (!initialDataRef.current) {
        initialDataRef.current = rescueAndLoadUserData(currentUser?.username || '');
      }

      const [activeProgram, setActiveProgram] = useState(null);
      const [activeTab, setActiveTab] = useState('');
      const [notes, setNotes] = useState(initialDataRef.current.notes);
      const notesRef = useRef(initialDataRef.current.notes);
      const [expandedItems, setExpandedItems] = useState({});
      const [isSaving, setIsSaving] = useState(false);

      const [isDarkMode, setIsDarkMode] = useState(() => {
        try { return localStorage.getItem('asamblea-dark-mode') === 'true'; } catch (e) { return false; }
      });

      const [fontSize, setFontSize] = useState(() => {
        try { return parseInt(localStorage.getItem('asamblea-fontsize') || '16', 10); } catch (e) { return 16; }
      });

      const [archivedPrograms, setArchivedPrograms] = useState({});
      const [deletedPrograms, setDeletedPrograms] = useState({});
      const [customNotesList, setCustomNotesList] = useState(initialDataRef.current.customList);

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [contextMenu, setContextMenu] = useState(null);
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const saveTimeoutRef = useRef(null);

      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      const handleInstallClick = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          setDeferredPrompt(null);
        }
        setIsSettingsOpen(false);
        setIsDrawerOpen(false);
      };

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        try { localStorage.setItem('asamblea-dark-mode', isDarkMode); } catch (e) {}
      }, [isDarkMode]);

      useEffect(() => {
        if (currentUser?.username) {
          const u = currentUser.username;
          try {
            const rescued = rescueAndLoadUserData(u);
            notesRef.current = rescued.notes;
            setNotes(rescued.notes);
            setCustomNotesList(rescued.customList);

            const savedArch = localStorage.getItem(`asamblea-archived-${u}`);
            setArchivedPrograms(savedArch ? JSON.parse(savedArch) : {});

            const savedDel = localStorage.getItem(`asamblea-deleted-${u}`);
            setDeletedPrograms(savedDel ? JSON.parse(savedDel) : {});
          } catch (e) {}
        }
      }, [currentUser]);

      const handleLogin = () => {
        const cleanUser = loginForm.username.trim().toLowerCase();
        if (!cleanUser) {
          setLoginError('Por favor, ingresa tu nombre de usuario');
          return;
        }
        setIsLoggingIn(true);
        setTimeout(() => {
          const userObj = { username: cleanUser };
          setCurrentUser(userObj);
          try { localStorage.setItem('asamblea-active-user', JSON.stringify(userObj)); } catch (e) {}
          setIsLoggingIn(false);
          setLoginError('');
          setCurrentScreen('programs');
        }, 250);
      };

      const handleLogout = () => {
        try { localStorage.removeItem('asamblea-active-user'); } catch (e) {}
        setCurrentUser(null);
        setIsSettingsOpen(false);
        setIsDrawerOpen(false);
        setCurrentScreen('login');
      };

      const saveNotesNow = (updatedNotes) => {
        const u = currentUser?.username || 'default';
        try {
          localStorage.setItem(`asamblea-notas-${u}`, JSON.stringify(updatedNotes));
        } catch (e) {}
      };

      const handleNoteChange = (id, val) => {
        setIsSaving(true);
        const next = { ...notesRef.current, [id]: val };
        notesRef.current = next;
        saveNotesNow(next);

        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        saveTimeoutRef.current = setTimeout(() => {
          setNotes({ ...notesRef.current });
          setIsSaving(false);
        }, 500);
      };

      const handleOpenProgram = (progId) => {
        const prog = programsDB.find(p => p.id === progId);
        if (!prog) return;
        setActiveProgram(progId);
        setActiveTab(prog.days === 3 ? 'viernes' : 'programa');
        setCurrentScreen('program_view');
        window.scrollTo(0, 0);
      };

      const createNewCustomNote = () => {
        const u = currentUser?.username || 'default';
        const newId = `custom_${Date.now()}`;
        const newNote = { id: newId, title: 'Nueva nota', createdAt: Date.now() };
        const updatedList = [newNote, ...customNotesList];
        setCustomNotesList(updatedList);
        try {
          localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(updatedList));
        } catch (e) {}
        setActiveProgram(newId);
        setCurrentScreen('custom_note');
        window.scrollTo(0, 0);
      };

      const handleOpenCustomNote = (noteId) => {
        setActiveProgram(noteId);
        setCurrentScreen('custom_note');
        window.scrollTo(0, 0);
      };

      const handleUpdateCustomNoteTitle = (e) => {
        const newTitle = e.target.value;
        const u = currentUser?.username || 'default';
        const updatedList = customNotesList.map(n => n.id === activeProgram ? { ...n, title: newTitle } : n);
        setCustomNotesList(updatedList);
        try {
          localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(updatedList));
        } catch (e) {}
      };

      const toggleItem = (id) => {
        setExpandedItems(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleDarkMode = () => setIsDarkMode(prev => !prev);
      
      const increaseFontSize = () => {
        setFontSize(prev => {
          const next = Math.min(prev + 2, 28);
          try { localStorage.setItem('asamblea-fontsize', next.toString()); } catch (e) {}
          return next;
        });
      };

      const decreaseFontSize = () => {
        setFontSize(prev => {
          const next = Math.max(prev - 2, 12);
          try { localStorage.setItem('asamblea-fontsize', next.toString()); } catch (e) {}
          return next;
        });
      };

      const handleLongPress = (e, prog) => {
        if (e && e.preventDefault) e.preventDefault();
        setContextMenu(prog);
      };

      const toggleArchive = (id) => {
        setArchivedPrograms(prev => {
          const newState = { ...prev, [id]: !prev[id] };
          if (currentUser?.username) {
            try { localStorage.setItem(`asamblea-archived-${currentUser.username}`, JSON.stringify(newState)); } catch (e) {}
          }
          return newState;
        });
      };

      const deleteProgram = (id) => {
        setDeletedPrograms(prev => {
          const newState = { ...prev, [id]: true };
          if (currentUser?.username) {
            try { localStorage.setItem(`asamblea-deleted-${currentUser.username}`, JSON.stringify(newState)); } catch (e) {}
          }
          return newState;
        });
      };

      const handleBackToPrograms = () => {
        if (saveTimeoutRef.current) {
          clearTimeout(saveTimeoutRef.current);
        }
        saveNotesNow(notesRef.current);
        setNotes({ ...notesRef.current });
        setIsSaving(false);
        setCurrentScreen('programs');
        setActiveProgram(null);
        setActiveTab('');
      };

      const handleExportPDF = () => {
        setIsSettingsOpen(false);
        const currentNotes = notesRef.current;
        const element = document.createElement('div');
        element.style.padding = '30px';
        element.style.fontFamily = '-apple-system, BlinkMacSystemFont, Arial, sans-serif';
        element.style.color = '#1C1C1E';

        let html = `<h1 style="color: #007AFF; text-align: center; margin-bottom: 5px; font-size: 24px;">Mis Apuntes</h1>`;
        html += `<p style="text-align: center; color: #8E8E93; margin-top: 0; margin-bottom: 30px; font-size: 14px;">Usuario: ${currentUser?.username || ''}</p>`;

        if (currentScreen === 'custom_note' && activeProgram) {
          const noteObj = customNotesList.find(n => n.id === activeProgram);
          html += `<h2 style="color: #000; border-bottom: 2px solid #E5E5EA; padding-bottom: 8px;">${noteObj?.title || 'Nota Libre'}</h2>`;
          html += `<div style="margin-top: 15px; font-size: 15px; line-height: 1.6;">${currentNotes[activeProgram] || 'Sin contenido.'}</div>`;
        } else {
          const targetPrograms = activeProgram ? programsDB.filter(p => p.id === activeProgram) : programsDB;
          targetPrograms.forEach(prog => {
            html += `<h2 style="color: #007AFF; margin-top: 25px; border-bottom: 2px solid #E5E5EA; padding-bottom: 6px;">${prog.title} (${prog.year})</h2>`;
            const sections = prog.days === 3 ? ['viernes', 'sabado', 'domingo'] : ['programa', 'repaso'];
            sections.forEach(sec => {
              if (!prog[sec]) return;
              prog[sec].forEach(item => {
                if (item.type === 'attendance') {
                  const gen = currentNotes[item.id + '_general'];
                  const str = currentNotes[item.id + '_stream'];
                  if (gen || str) {
                    html += `<p style="font-size: 13px; color: #636366;"><strong>${item.title}:</strong> General: ${gen || 0} | Stream: ${str || 0}</p>`;
                  }
                } else {
                  if (currentNotes[item.id] && currentNotes[item.id].trim() !== '' && currentNotes[item.id] !== '<b>Orador: </b><br><br>') {
                    html += `<h3 style="color: #000; margin-top: 16px; margin-bottom: 6px; font-size: 16px;">${item.time ? item.time + ' - ' : ''}${item.title}</h3>`;
                    html += `<div style="background: #F2F2F7; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.5;">${currentNotes[item.id]}</div>`;
                  }
                  if (item.type === 'symposium' && item.parts) {
                    item.parts.forEach(part => {
                      if (currentNotes[part.id] && currentNotes[part.id].trim() !== '' && currentNotes[part.id] !== '<b>Orador: </b><br><br>') {
                        html += `<h4 style="color: #3A3A3C; margin-top: 12px; margin-left: 15px; margin-bottom: 4px; font-size: 15px;">${part.title}</h4>`;
                        html += `<div style="background: #F2F2F7; padding: 12px; border-radius: 8px; margin-left: 15px; font-size: 14px; line-height: 1.5;">${currentNotes[part.id]}</div>`;
                      }
                    });
                  }
                }
              });
            });
          });
        }

        element.innerHTML = html;
        if (window.html2pdf) {
          window.html2pdf().set({
            margin: 15,
            filename: `Apuntes_${currentUser?.username || 'Asamblea'}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          }).from(element).save();
        }
      };

      if (currentScreen === 'login') {
        return (
          <div className="min-h-screen flex flex-col justify-center px-6 animate-fade-in bg-[#F2F2F7] dark:bg-[#000000]">
            <div className="max-w-sm w-full mx-auto">
              <div className="text-center mb-6">
                <h1 className="text-[34px] font-bold tracking-tight mb-1 text-black dark:text-white">Mis Apuntes</h1>
                <p className="text-[#8E8E93] text-[17px]">Inicia sesión para continuar</p>
              </div>
              
              {!isDbReady ? (
                <div className="flex flex-col items-center justify-center py-8">
                  <Loader2 className="animate-spin text-[#8E8E93] mb-4" size={32} />
                  <p className="text-[#8E8E93] text-[15px]">Conectando...</p>
                </div>
              ) : (
                <form onSubmit={(e) => { e.preventDefault(); handleLogin(); }} className="space-y-3">
                  {loginError && (
                    <div className="bg-[#FF3B30]/10 text-[#FF3B30] p-3 rounded-2xl text-[15px] text-center mb-2">
                      {loginError}
                    </div>
                  )}
                  
                  <div className="bg-white dark:bg-[#1C1C1E] rounded-full overflow-hidden border border-[#C6C6C8] dark:border-[#38383A] shadow-sm">
                    <input 
                      type="text"
                      value={loginForm.username}
                      onChange={(e) => setLoginForm({ username: e.target.value })}
                      className="w-full px-5 py-3 text-[17px] bg-transparent focus:outline-none text-black dark:text-white placeholder-[#8E8E93]"
                      placeholder="Tu usuario"
                      autoCapitalize="none"
                      autoCorrect="off"
                    />
                  </div>
                  
                  <button
                    type="submit"
                    disabled={isLoggingIn}
                    className="w-full bg-[#007AFF] text-white font-semibold text-[17px] py-3 rounded-full active:bg-[#0062CC] transition-colors flex justify-center items-center shadow-sm"
                  >
                    {isLoggingIn ? <Loader2 className="animate-spin" size={20} /> : 'Continuar'}
                  </button>

                  <p className="text-[13px] text-[#8E8E93] text-center pt-3 px-4">
                    Tus apuntes se sincronizarán automáticamente en tu dispositivo.
                  </p>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#F2F2F7] dark:bg-[#000000] text-black dark:text-white font-sans pb-20 selection:bg-[#007AFF]/30">
          
          {/* Barra de Navegación Superior Nativa de iOS */}
          <header className="sticky top-0 z-40 bg-[#F2F2F7]/80 dark:bg-[#000000]/80 backdrop-blur-md border-b border-[#C6C6C8]/60 dark:border-[#38383A]">
            <div className="flex items-center justify-between px-2 h-12 max-w-2xl mx-auto">
              <div className="w-24 flex items-center justify-start">
                {(currentScreen === 'program_view' || currentScreen === 'custom_note') ? (
                  <button onClick={handleBackToPrograms} className="flex items-center text-[#007AFF] font-medium text-[17px] px-2 active:opacity-50">
                    <ChevronLeft size={24} className="-ml-1" />
                    <span>Atrás</span>
                  </button>
                ) : (
                  <button onClick={() => setIsDrawerOpen(true)} className="p-2 text-[#007AFF] active:opacity-50" aria-label="Menú">
                    <Menu size={24} />
                  </button>
                )}
              </div>
              
              <div className="flex-1 flex justify-center items-center">
                {(currentScreen === 'program_view' || currentScreen === 'custom_note') && (
                  <div className="flex items-center text-[12px] text-[#8E8E93] font-medium gap-1 bg-[#8E8E93]/10 px-2.5 py-1 rounded-full">
                    {isSaving ? <CloudLightning size={12} className="text-[#007AFF]" /> : <Cloud size={12} />}
                    <span>{isSaving ? 'Guardando...' : 'Guardado'}</span>
                  </div>
                )}
              </div>

              <div className="w-24 flex justify-end">
                <button onClick={() => setIsSettingsOpen(true)} className="p-2 text-[#007AFF] active:opacity-50" aria-label="Ajustes">
                  <MoreVertical size={24} />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-2xl mx-auto px-4 mt-6">
            
            {/* VISTA DE LISTA DE PROGRAMAS Y MIS NOTAS */}
            {currentScreen === 'programs' && (
              <div className="animate-fade-in">
                <div className="flex justify-between items-center mb-4 px-2">
                  <h1 className="text-[34px] font-bold tracking-tight">Programas</h1>
                  <button onClick={createNewCustomNote} className="p-2 bg-[#007AFF]/10 text-[#007AFF] rounded-full active:bg-[#007AFF]/20 transition-colors" aria-label="Nueva nota libre">
                    <Plus size={24} />
                  </button>
                </div>
                
                <div className="space-y-3.5">
                  {programsDB.filter(p => !archivedPrograms[p.id] && !deletedPrograms[p.id]).map(prog => (
                    <div 
                      key={prog.id}
                      onClick={() => handleOpenProgram(prog.id)}
                      onContextMenu={(e) => handleLongPress(e, prog)}
                      onTouchStart={() => {
                        window.pressTimer = setTimeout(() => handleLongPress({ preventDefault: ()=>{} }, prog), 600);
                      }}
                      onTouchEnd={() => clearTimeout(window.pressTimer)}
                      onTouchMove={() => clearTimeout(window.pressTimer)}
                      className="bg-white dark:bg-[#1C1C1E] rounded-[16px] p-5 shadow-sm active:scale-[0.98] transition-transform cursor-pointer select-none"
                    >
                      <h3 className="text-[19px] font-semibold tracking-tight text-black dark:text-white leading-snug mb-1">{prog.title}</h3>
                      <p className="text-[#8E8E93] text-[15px]">{prog.year} • {prog.days === 1 ? '1 día' : '3 días'}</p>
                    </div>
                  ))}
                </div>

                {customNotesList.length > 0 && (
                  <div className="mt-8">
                    <h2 className="text-[22px] font-bold tracking-tight mb-3.5 px-2 text-black dark:text-white">Mis Notas</h2>
                    <div className="space-y-3.5">
                      {customNotesList.map(note => (
                        <div 
                          key={note.id}
                          onClick={() => handleOpenCustomNote(note.id)}
                          className="bg-white dark:bg-[#1C1C1E] rounded-[16px] p-5 shadow-sm active:scale-[0.98] transition-transform cursor-pointer border-l-4 border-[#007AFF]"
                        >
                          <h3 className="text-[19px] font-semibold tracking-tight text-black dark:text-white leading-snug mb-1">{note.title || 'Sin título'}</h3>
                          <p className="text-[#8E8E93] text-[15px]">Nota libre</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* VISTA DE PROGRAMA DETALLADO */}
            {currentScreen === 'program_view' && activeProgram && (
              <div className="animate-fade-in">
                <h1 className="text-[28px] font-bold tracking-tight mb-1 leading-tight text-black dark:text-white px-2">
                  {programsDB.find(p => p.id === activeProgram)?.title}
                </h1>
                <p className="text-[#8E8E93] text-[14px] px-2 mb-5 uppercase tracking-wider font-semibold">
                  Asamblea {programsDB.find(p => p.id === activeProgram)?.year}
                </p>

                {programsDB.find(p => p.id === activeProgram)?.days === 3 ? (
                  <div className="bg-[#767680]/12 dark:bg-[#767680]/24 p-1 rounded-[10px] flex mb-6 mx-1">
                    {['viernes', 'sabado', 'domingo'].map(tab => (
                      <button 
                        key={tab}
                        onClick={() => setActiveTab(tab)}
                        className={`flex-1 py-1.5 text-[14px] font-semibold rounded-[8px] capitalize transition-all ${activeTab === tab ? 'bg-white dark:bg-[#636366] text-black dark:text-white shadow-sm' : 'text-[#8E8E93] dark:text-[#EBEBF5]/60'}`}
                      >
                        {tab === 'sabado' ? 'Sábado' : tab}
                      </button>
                    ))}
                  </div>
                ) : (
                  <div className="bg-[#767680]/12 dark:bg-[#767680]/24 p-1 rounded-[10px] flex mb-6 mx-1">
                    <button onClick={() => setActiveTab('programa')} className={`flex-1 py-1.5 text-[14px] font-semibold rounded-[8px] transition-all ${activeTab === 'programa' ? 'bg-white dark:bg-[#636366] text-black dark:text-white shadow-sm' : 'text-[#8E8E93] dark:text-[#EBEBF5]/60'}`}>Programa</button>
                    <button onClick={() => setActiveTab('repaso')} className={`flex-1 py-1.5 text-[14px] font-semibold rounded-[8px] transition-all ${activeTab === 'repaso' ? 'bg-white dark:bg-[#636366] text-black dark:text-white shadow-sm' : 'text-[#8E8E93] dark:text-[#EBEBF5]/60'}`}>Repaso</button>
                  </div>
                )}

                <div className="space-y-3.5">
                  {programsDB.find(p => p.id === activeProgram)?.[activeTab]?.map((item) => (
                    <div key={item.id} className="bg-white dark:bg-[#1C1C1E] rounded-[16px] p-4 sm:p-5 shadow-sm">
                      {item.type === 'attendance' ? (
                        <div>
                          <h3 className="font-semibold text-black dark:text-white mb-3 text-[16px]">{item.title}</h3>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <div className="flex justify-between items-center bg-[#F2F2F7] dark:bg-[#2C2C2E] px-3.5 py-2.5 rounded-xl">
                              <span className="text-[#8E8E93] text-[15px] font-medium">Asistencia General</span>
                              <input
                                type="number"
                                defaultValue={notesRef.current[item.id + '_general'] || ''}
                                onChange={(e) => handleNoteChange(item.id + '_general', e.target.value)}
                                className="w-20 bg-white dark:bg-[#1C1C1E] text-black dark:text-white text-center py-1 rounded-lg border border-[#C6C6C8] dark:border-[#38383A] focus:outline-none focus:border-[#007AFF] font-semibold text-[16px]"
                                placeholder="0"
                              />
                            </div>
                            {item.hasStream && (
                              <div className="flex justify-between items-center bg-[#F2F2F7] dark:bg-[#2C2C2E] px-3.5 py-2.5 rounded-xl">
                                <span className="text-[#8E8E93] text-[15px] font-medium">Conectados (Stream)</span>
                                <input
                                  type="number"
                                  defaultValue={notesRef.current[item.id + '_stream'] || ''}
                                  onChange={(e) => handleNoteChange(item.id + '_stream', e.target.value)}
                                  className="w-20 bg-white dark:bg-[#1C1C1E] text-black dark:text-white text-center py-1 rounded-lg border border-[#C6C6C8] dark:border-[#38383A] focus:outline-none focus:border-[#007AFF] font-semibold text-[16px]"
                                  placeholder="0"
                                />
                              </div>
                            )}
                          </div>
                        </div>
                      ) : (
                        <div>
                          <div 
                            className={`flex items-start gap-3 ${(item.type === 'talk' || item.type === 'song') ? 'cursor-pointer select-none' : ''}`}
                            onClick={() => (item.type === 'talk' || item.type === 'song') && toggleItem(item.id)}
                          >
                            {item.time && (
                              <div className="text-[#007AFF] font-semibold text-[15px] pt-0.5 shrink-0 w-[44px]">
                                {item.time}
                              </div>
                            )}
                            <div className="flex-1 flex justify-between items-start gap-2">
                              <h3 className={`font-semibold text-[17px] leading-snug ${item.type === 'music' ? 'text-[#8E8E93]' : 'text-black dark:text-white'}`}>
                                {item.title}
                              </h3>
                              {(item.type === 'talk' || item.type === 'song') && (
                                expandedItems[item.id] 
                                  ? <ChevronUp size={20} className="text-[#8E8E93] shrink-0 mt-0.5" /> 
                                  : <ChevronDown size={20} className="text-[#8E8E93] shrink-0 mt-0.5" />
                              )}
                            </div>
                          </div>
                          
                          {(item.type === 'talk' || item.type === 'song') && expandedItems[item.id] && (
                            <div className="mt-3">
                              <RichNoteEditor
                                id={item.id}
                                value={notesRef.current[item.id] || ''}
                                onChange={(val) => handleNoteChange(item.id, val)}
                                placeholder="Escribe tus apuntes aquí..."
                                fontSize={fontSize}
                              />
                            </div>
                          )}
                          
                          {/* Serie de Discursos perfectamente alineada */}
                          {item.type === 'symposium' && (
                            <div className="mt-3 pt-1 border-t border-[#C6C6C8]/30 dark:border-[#38383A]/60 divide-y divide-[#C6C6C8]/30 dark:divide-[#38383A]/60">
                              {item.parts.map((part) => (
                                <div key={part.id} className="py-3 first:pt-2 last:pb-0">
                                  <div 
                                    onClick={() => toggleItem(part.id)} 
                                    className="flex items-start justify-between gap-3 cursor-pointer select-none"
                                  >
                                    <div className="flex items-start gap-2.5 flex-1">
                                      <div className="w-2.5 h-2.5 rounded-full border-2 border-[#007AFF] bg-transparent mt-1.5 shrink-0"></div>
                                      <h4 className="text-[16px] font-medium text-black dark:text-white leading-snug flex-1">
                                        {part.title.replace(/^•\s*/, '')}
                                      </h4>
                                    </div>
                                    {expandedItems[part.id] 
                                      ? <ChevronUp size={18} className="text-[#8E8E93] shrink-0 mt-0.5" /> 
                                      : <ChevronDown size={18} className="text-[#8E8E93] shrink-0 mt-0.5" />
                                    }
                                  </div>
                                  {expandedItems[part.id] && (
                                    <div className="mt-2.5">
                                      <RichNoteEditor
                                        id={part.id}
                                        value={notesRef.current[part.id] || ''}
                                        onChange={(val) => handleNoteChange(part.id, val)}
                                        placeholder="Escribe tus apuntes aquí..."
                                        fontSize={fontSize}
                                      />
                                    </div>
                                  )}
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VISTA DE NOTA LIBRE (MIS NOTAS) */}
            {currentScreen === 'custom_note' && activeProgram && (
              <div className="animate-fade-in">
                <input 
                  type="text" 
                  value={customNotesList.find(n => n.id === activeProgram)?.title || ''}
                  onChange={handleUpdateCustomNoteTitle}
                  className="w-full text-[32px] font-bold tracking-tight mb-2 px-1 text-black dark:text-white bg-transparent focus:outline-none placeholder-[#8E8E93]"
                  placeholder="Título de la nota..."
                />
                <RichNoteEditor 
                  id={activeProgram} 
                  value={notesRef.current[activeProgram] || ''} 
                  onChange={(val) => handleNoteChange(activeProgram, val)} 
                  placeholder="Empieza a escribir tu nota..." 
                  fontSize={fontSize}
                  isCustomNote={true}
                />
              </div>
            )}
          </main>

          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={() => setIsSettingsOpen(false)}></div>
              <div className="bg-[#F2F2F7] dark:bg-[#1C1C1E] w-full max-w-sm rounded-[20px] overflow-hidden z-10 animate-slide-up shadow-2xl">
                <div className="p-4 border-b border-[#C6C6C8]/50 dark:border-[#38383A]">
                  <h3 className="text-center font-semibold text-[17px] text-black dark:text-white">Ajustes de Vista</h3>
                </div>
                <div className="p-4 space-y-3">
                  <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden">
                    <div className="flex justify-between items-center p-4 border-b border-[#C6C6C8]/30 dark:border-[#38383A]">
                      <span className="text-[17px] text-black dark:text-white">Modo Oscuro</span>
                      <button onClick={toggleDarkMode} className={`w-12 h-7 rounded-full transition-colors relative ${isDarkMode ? 'bg-[#34C759]' : 'bg-[#E5E5EA] dark:bg-[#3A3A3C]'}`}>
                        <div className={`w-6 h-6 bg-white rounded-full absolute top-0.5 transition-transform ${isDarkMode ? 'translate-x-5' : 'translate-x-0.5'} shadow-sm`}></div>
                      </button>
                    </div>
                    <div className="flex justify-between items-center p-4">
                      <span className="text-[17px] text-black dark:text-white">Tamaño de letra</span>
                      <div className="flex items-center gap-3">
                        <button onClick={decreaseFontSize} className="w-9 h-8 rounded-lg bg-[#F2F2F7] dark:bg-[#3A3A3C] font-semibold flex items-center justify-center active:opacity-50 text-black dark:text-white">A-</button>
                        <span className="font-semibold text-[16px] w-7 text-center text-black dark:text-white">{fontSize}</span>
                        <button onClick={increaseFontSize} className="w-9 h-8 rounded-lg bg-[#F2F2F7] dark:bg-[#3A3A3C] font-semibold flex items-center justify-center active:opacity-50 text-black dark:text-white">A+</button>
                      </div>
                    </div>
                  </div>

                  {currentScreen !== 'programs' && (
                    <button onClick={() => { setIsSettingsOpen(false); handleBackToPrograms(); }} className="w-full bg-white dark:bg-[#2C2C2E] text-[#007AFF] font-semibold text-[17px] p-3.5 rounded-xl active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors text-center">
                      Volver al menú de Programas
                    </button>
                  )}

                  {deferredPrompt && (
                    <button onClick={handleInstallClick} className="w-full bg-[#007AFF] text-white font-semibold text-[17px] p-3.5 rounded-xl active:bg-[#0062CC] transition-colors text-center shadow-sm">
                      Instalar Aplicación en el celular
                    </button>
                  )}

                  <button onClick={handleExportPDF} className="w-full bg-white dark:bg-[#2C2C2E] text-[#007AFF] font-semibold text-[17px] p-3.5 rounded-xl active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors text-center">
                    Exportar apuntes en PDF
                  </button>
                  <button onClick={handleLogout} className="w-full bg-white dark:bg-[#2C2C2E] text-[#FF3B30] font-semibold text-[17px] p-3.5 rounded-xl active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors text-center">
                    Cerrar Sesión
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Menú Lateral (Hamburguesa) con Archivados y Controles Rápidos */}
          {isDrawerOpen && (
            <div className="fixed inset-0 z-50 flex items-stretch justify-start">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={() => setIsDrawerOpen(false)}></div>
              <div className="bg-[#F2F2F7] dark:bg-[#1C1C1E] w-[82%] max-w-sm shadow-2xl z-10 animate-slide-right flex flex-col">
                <div className="p-6 pt-10 border-b border-[#C6C6C8]/50 dark:border-[#38383A] bg-white dark:bg-[#2C2C2E]">
                  <div className="w-14 h-14 bg-[#007AFF]/10 text-[#007AFF] rounded-full flex items-center justify-center mb-3 mx-auto">
                    <User size={28} />
                  </div>
                  <h3 className="text-center font-semibold text-[19px] text-black dark:text-white">{currentUser?.username}</h3>
                  <p className="text-center text-[13px] text-[#8E8E93]">Sesión activa</p>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-6">
                  <div>
                    <h4 className="text-[#8E8E93] text-[13px] uppercase tracking-wider font-semibold mb-2 px-2">Apariencia</h4>
                    <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden">
                      <div className="flex justify-between items-center p-3.5 border-b border-[#C6C6C8]/30 dark:border-[#38383A]">
                        <span className="text-[16px] text-black dark:text-white">Modo Oscuro</span>
                        <button onClick={toggleDarkMode} className={`w-12 h-7 rounded-full transition-colors relative ${isDarkMode ? 'bg-[#34C759]' : 'bg-[#E5E5EA] dark:bg-[#3A3A3C]'}`}>
                          <div className={`w-6 h-6 bg-white rounded-full absolute top-0.5 transition-transform ${isDarkMode ? 'translate-x-5' : 'translate-x-0.5'} shadow-sm`}></div>
                        </button>
                      </div>
                      <div className="flex justify-between items-center p-3.5">
                        <span className="text-[16px] text-black dark:text-white">Tamaño de texto</span>
                        <div className="flex items-center gap-2">
                          <button onClick={decreaseFontSize} className="w-8 h-8 rounded-lg bg-[#F2F2F7] dark:bg-[#3A3A3C] font-semibold flex items-center justify-center text-black dark:text-white">A-</button>
                          <span className="font-semibold text-[15px] w-6 text-center text-black dark:text-white">{fontSize}</span>
                          <button onClick={increaseFontSize} className="w-8 h-8 rounded-lg bg-[#F2F2F7] dark:bg-[#3A3A3C] font-semibold flex items-center justify-center text-black dark:text-white">A+</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div>
                    <h4 className="text-[#8E8E93] text-[13px] uppercase tracking-wider font-semibold mb-2 px-2">Archivados</h4>
                    <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden">
                      {programsDB.filter(p => archivedPrograms[p.id] && !deletedPrograms[p.id]).length === 0 ? (
                        <div className="p-4 text-center text-[#8E8E93] text-[15px]">No hay programas archivados</div>
                      ) : (
                        programsDB.filter(p => archivedPrograms[p.id] && !deletedPrograms[p.id]).map(prog => (
                          <div key={prog.id} className="flex justify-between items-center border-b border-[#C6C6C8]/30 dark:border-[#38383A] last:border-0 p-3.5">
                            <span className="text-[15px] font-medium text-black dark:text-white truncate pr-2">{prog.title}</span>
                            <button onClick={() => toggleArchive(prog.id)} className="text-[#007AFF] text-[13px] font-semibold px-3 py-1 bg-[#007AFF]/10 rounded-full shrink-0">
                              Restaurar
                            </button>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-[#C6C6C8]/40 dark:border-[#38383A]">
                  <button onClick={handleLogout} className="w-full py-3 rounded-xl bg-[#FF3B30]/10 text-[#FF3B30] font-semibold text-[16px]">
                    Cerrar Sesión
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Action Sheet iOS (Menú Contextual al mantener presionado un programa) */}
          {contextMenu && (
            <div className="fixed inset-0 z-50 flex items-end justify-center p-4">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={() => setContextMenu(null)}></div>
              <div className="w-full max-w-sm z-10 pb-2 animate-slide-up space-y-2">
                <div className="bg-[#F2F2F7]/95 dark:bg-[#2C2C2E]/95 backdrop-blur-xl rounded-[14px] overflow-hidden shadow-lg">
                  <div className="p-3 border-b border-[#C6C6C8]/40 dark:border-[#38383A] text-center">
                    <span className="text-[13px] text-[#8E8E93] font-semibold truncate block px-4">{contextMenu.title}</span>
                  </div>
                  <button 
                    onClick={() => { toggleArchive(contextMenu.id); setContextMenu(null); }} 
                    className="w-full p-4 text-[17px] text-[#007AFF] bg-transparent active:bg-black/5 dark:active:bg-white/5 transition-colors border-b border-[#C6C6C8]/40 dark:border-[#38383A] font-medium"
                  >
                    {archivedPrograms[contextMenu.id] ? 'Desarchivar Programa' : 'Archivar Programa'}
                  </button>
                  <button 
                    onClick={() => { deleteProgram(contextMenu.id); setContextMenu(null); }} 
                    className="w-full p-4 text-[17px] text-[#FF3B30] bg-transparent active:bg-black/5 dark:active:bg-white/5 transition-colors font-medium"
                  >
                    Eliminar Programa
                  </button>
                </div>
                <div className="bg-white dark:bg-[#2C2C2E] rounded-[14px] overflow-hidden shadow-lg">
                  <button onClick={() => setContextMenu(null)} className="w-full p-4 text-[17px] text-[#007AFF] font-semibold bg-transparent active:bg-black/5 dark:active:bg-white/5 transition-colors">
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const mountApplication = () => {
      const rootElement = document.getElementById('root');
      if (!rootElement) return;
      rootElement.innerHTML = '';
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mountApplication);
    } else {
      mountApplication();
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
