    // --- EDITOR ENRIQUECIDO 100% IMPERATIVO (INMUNE A COLISIONES DE VIRTUAL DOM) ---
    const RichNoteEditor = memo(({ id, initialValue, onChange, placeholder, fontSize, isCustomNote = false }) => {
      const mountRef = useRef(null);
      const editorNodeRef = useRef(null);
      const onChangeRef = useRef(onChange);
      const [isBold, setIsBold] = useState(false);
      const [isUnderline, setIsUnderline] = useState(false);

      useEffect(() => {
        onChangeRef.current = onChange;
      }, [onChange]);

      const syncToolbarState = () => {
        if (!editorNodeRef.current) return;
        try {
          const b = !!document.queryCommandState('bold');
          const u = !!document.queryCommandState('underline');
          setIsBold(prev => (prev !== b ? b : prev));
          setIsUnderline(prev => (prev !== u ? u : prev));
        } catch (err) {}
      };

      // Creación imperativa del nodo editable para que React jamás rastree sus hijos internos
      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        container.innerHTML = '';
        const editable = document.createElement('div');
        editable.contentEditable = 'true';
        editable.setAttribute('data-placeholder', placeholder || '');
        editable.className = 'ios-editor-surface p-4 min-h-[140px] focus:outline-none text-black dark:text-white bg-white dark:bg-[#1C1C1E] leading-relaxed whitespace-pre-wrap break-words';
        editable.style.fontSize = `${fontSize}px`;

        const defaultText = (!initialValue && !isCustomNote && !id.includes('rep'))
          ? '<b>Orador: </b><br><br>'
          : (initialValue || '');
        editable.innerHTML = defaultText;

        const handleInput = () => {
          if (onChangeRef.current) {
            onChangeRef.current(editable.innerHTML);
          }
          syncToolbarState();
        };

        const handleCursorActivity = () => {
          syncToolbarState();
        };

        editable.addEventListener('input', handleInput);
        editable.addEventListener('keyup', handleCursorActivity);
        editable.addEventListener('mouseup', handleCursorActivity);
        editable.addEventListener('touchend', handleCursorActivity);
        editable.addEventListener('focus', handleCursorActivity);

        container.appendChild(editable);
        editorNodeRef.current = editable;

        return () => {
          editable.removeEventListener('input', handleInput);
          editable.removeEventListener('keyup', handleCursorActivity);
          editable.removeEventListener('mouseup', handleCursorActivity);
          editable.removeEventListener('touchend', handleCursorActivity);
          editable.removeEventListener('focus', handleCursorActivity);
          container.innerHTML = '';
          editorNodeRef.current = null;
        };
      }, [id]);

      // Actualizar tamaño de fuente dinámicamente sin recrear el nodo
      useEffect(() => {
        if (editorNodeRef.current) {
          editorNodeRef.current.style.fontSize = `${fontSize}px`;
        }
      }, [fontSize]);

      const handleCommand = (e, command, arg = null) => {
        e.preventDefault();
        e.stopPropagation();
        const editable = editorNodeRef.current;
        if (!editable) return;
        try {
          if (document.activeElement !== editable) {
            editable.focus();
          }
          document.execCommand(command, false, arg);
          syncToolbarState();
          if (onChangeRef.current) {
            onChangeRef.current(editable.innerHTML);
          }
        } catch (err) {}
      };

      return (
        <div className="mt-3 rounded-[14px] overflow-hidden border border-[#C6C6C8]/60 dark:border-[#38383A] bg-white dark:bg-[#1C1C1E] shadow-sm transition-colors">
          <div className="flex items-center gap-1.5 px-3 py-2 bg-[#F2F2F7] dark:bg-[#2C2C2E] border-b border-[#C6C6C8]/50 dark:border-[#38383A] overflow-x-auto select-none">
            <button
              type="button"
              onMouseDown={(e) => handleCommand(e, 'bold')}
              className={`w-9 h-8 rounded-[8px] font-bold text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0 ${
                isBold
                  ? 'bg-[#007AFF] text-white ring-2 ring-[#007AFF]/30'
                  : 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white'
              }`}
            >
              B
            </button>
            <button
              type="button"
              onMouseDown={(e) => handleCommand(e, 'underline')}
              className={`w-9 h-8 rounded-[8px] underline font-semibold text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0 ${
                isUnderline
                  ? 'bg-[#007AFF] text-white ring-2 ring-[#007AFF]/30'
                  : 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white'
              }`}
            >
              U
            </button>
            <div className="w-px h-5 bg-[#C6C6C8] dark:bg-[#48484A] mx-1 shrink-0"></div>
            <button
              type="button"
              onMouseDown={(e) => handleCommand(e, 'insertText', '\n• ')}
              className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-black dark:text-white font-bold text-[18px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0"
            >
              •
            </button>
            <div className="w-px h-5 bg-[#C6C6C8] dark:bg-[#48484A] mx-1 shrink-0"></div>
            <button
              type="button"
              onMouseDown={(e) => handleCommand(e, 'insertText', '💎 ')}
              className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0"
            >
              💎
            </button>
            <button
              type="button"
              onMouseDown={(e) => handleCommand(e, 'insertText', '❤️ ')}
              className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0"
            >
              ❤️
            </button>
            <button
              type="button"
              onMouseDown={(e) => handleCommand(e, 'insertText', '✅ ')}
              className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0"
            >
              ✅
            </button>
          </div>
          {/* Contenedor imperativo aislado */}
          <div ref={mountRef}></div>
        </div>
      );
    });

                      ) : (
                        programsDB.filter(p => archivedPrograms[p.id] && !deletedPrograms[p.id]).map(prog => (
                          <div key={prog.id} className="flex justify-between items-center border-b border-[#C6C6C8]/30 dark:border-[#38383A] last:border-0 p-3.5">
                            <span className="text-[15px] font-medium text-black dark:text-white truncate pr-2">{prog.title}</span>
                            <button onClick={() => toggleArchive(prog.id)} className="text-[#007AFF] text-[13px] font-semibold px-3 py-1 bg-[#007AFF]/10 rounded-full shrink-0">
                              Restaurar
                            </button>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-[#C6C6C8]/40 dark:border-[#38383A]">
                  <button onClick={handleLogout} className="w-full py-3 rounded-xl bg-[#FF3B30]/10 text-[#FF3B30] font-semibold text-[16px]">
                    Cerrar Sesión
                  </button>
                </div>
              </div>
            </div>
          )}

          {contextMenu && (
            <div className="fixed inset-0 z-50 flex items-end justify-center p-4">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={() => setContextMenu(null)}></div>
              <div className="w-full max-w-sm z-10 pb-2 animate-slide-up space-y-2">
                <div className="bg-[#F2F2F7]/95 dark:bg-[#2C2C2E]/95 backdrop-blur-xl rounded-[14px] overflow-hidden shadow-lg">
                  <div className="p-3 border-b border-[#C6C6C8]/40 dark:border-[#38383A] text-center">
                    <span className="text-[13px] text-[#8E8E93] font-semibold truncate block px-4">{contextMenu.title}</span>
                  </div>
                  <button 
                    onClick={() => { toggleArchive(contextMenu.id); setContextMenu(null); }} 
                    className="w-full p-4 text-[17px] text-[#007AFF] bg-transparent active:bg-black/5 dark:active:bg-white/5 transition-colors border-b border-[#C6C6C8]/40 dark:border-[#38383A] font-medium"
                  >
                    {archivedPrograms[contextMenu.id] ? 'Desarchivar Programa' : 'Archivar Programa'}
                  </button>
                  <button 
                    onClick={() => { deleteProgram(contextMenu.id); setContextMenu(null); }} 
                    className="w-full p-4 text-[17px] text-[#FF3B30] bg-transparent active:bg-black/5 dark:active:bg-white/5 transition-colors font-medium"
                  >
                    Eliminar Programa
                  </button>
                </div>
                <div className="bg-white dark:bg-[#2C2C2E] rounded-[14px] overflow-hidden shadow-lg">
                  <button onClick={() => setContextMenu(null)} className="w-full p-4 text-[17px] text-[#007AFF] font-semibold bg-transparent active:bg-black/5 dark:active:bg-white/5 transition-colors">
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    rootElement.innerHTML = '';
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

</body></html>
