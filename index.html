  <script>
    window.addEventListener('unhandledrejection', function(event) {
      if (event && event.reason && String(event.reason).indexOf('ServiceWorker') !== -1) {
        event.preventDefault();
      }
    });

    (function() {
      try {
        var savedMode = localStorage.getItem('asamblea-dark-mode');
        var dark = savedMode === null ? true : savedMode === 'true';
        if (savedMode === null) {
          localStorage.setItem('asamblea-dark-mode', 'true');
        }
        var docEl = document.documentElement;
        var themeMeta = document.getElementById('theme-color-meta');
        var schemeMeta = document.getElementById('color-scheme-meta');
        if (dark) {
          docEl.classList.add('dark');
          docEl.style.backgroundColor = '#000000';
          docEl.style.colorScheme = 'dark';
          if (themeMeta) themeMeta.setAttribute('content', '#000000');
          if (schemeMeta) schemeMeta.setAttribute('content', 'dark');
        } else {
          docEl.classList.remove('dark');
          docEl.style.backgroundColor = '#F2F2F7';
          docEl.style.colorScheme = 'light';
          if (themeMeta) themeMeta.setAttribute('content', '#F2F2F7');
          if (schemeMeta) schemeMeta.setAttribute('content', 'light');
        }
      } catch (e) {}
    })();
  </script>

    const SwipeableItem = ({ children, onArchive, onDelete, isArchived = false }) => {
      const [offsetX, setOffsetX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const startXRef = useRef(0);
      const startYRef = useRef(0);
      const currentOffsetRef = useRef(0);
      const swipedRef = useRef(false);
      const isHorizontalDragRef = useRef(null);

      const MAX_SWIPE = 148;

      const handleStart = (clientX, clientY) => {
        startXRef.current = clientX - currentOffsetRef.current;
        startYRef.current = clientY;
        setIsDragging(true);
        swipedRef.current = false;
        isHorizontalDragRef.current = null;
      };

      const handleMove = (clientX, clientY, e) => {
        if (!isDragging) return;
        const rawDeltaX = clientX - (startXRef.current + currentOffsetRef.current);
        const rawDeltaY = clientY - startYRef.current;

        if (isHorizontalDragRef.current === null) {
          if (Math.abs(rawDeltaX) > 8 || Math.abs(rawDeltaY) > 8) {
            isHorizontalDragRef.current = Math.abs(rawDeltaX) > Math.abs(rawDeltaY);
          }
        }

        if (isHorizontalDragRef.current === false) return;
        if (e && e.cancelable) e.preventDefault();

        const deltaX = clientX - startXRef.current;
        if (Math.abs(deltaX - currentOffsetRef.current) > 8) {
          swipedRef.current = true;
        }
        const clamped = Math.max(0, Math.min(MAX_SWIPE + 24, deltaX));
        setOffsetX(clamped);
      };

      const handleEnd = () => {
        if (!isDragging) return;
        setIsDragging(false);
        if (offsetX > 55) {
          setOffsetX(MAX_SWIPE);
          currentOffsetRef.current = MAX_SWIPE;
        } else {
          setOffsetX(0);
          currentOffsetRef.current = 0;
        }
      };

      const closeSwipe = () => {
        setOffsetX(0);
        currentOffsetRef.current = 0;
      };

      return (
        <div className="relative overflow-hidden rounded-[16px] select-none">
          <div
            className="absolute inset-y-0 left-0 flex items-stretch z-0"
            style={{
              width: `${MAX_SWIPE}px`,
              opacity: offsetX > 2 ? 1 : 0,
              pointerEvents: offsetX > 20 ? 'auto' : 'none',
              transition: isDragging ? 'none' : 'opacity 0.2s ease'
            }}
          >
            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                closeSwipe();
                onArchive && onArchive();
              }}
              className="flex-1 bg-[#5856D6] active:bg-[#4745B5] text-white flex flex-col items-center justify-center gap-1 transition-colors"
            >
              <AppleArchiveIcon size={21} />
              <span className="text-[11px] font-semibold tracking-tight">{isArchived ? 'Restaurar' : 'Archivar'}</span>
            </button>
            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                closeSwipe();
                onDelete && onDelete();
              }}
              className="flex-1 bg-[#FF3B30] active:bg-[#D7281E] text-white flex flex-col items-center justify-center gap-1 transition-colors"
            >
              <AppleTrashIcon size={21} />
              <span className="text-[11px] font-semibold tracking-tight">Eliminar</span>
            </button>
          </div>

          <div
            onTouchStart={(e) => handleStart(e.touches[0].clientX, e.touches[0].clientY)}
            onTouchMove={(e) => handleMove(e.touches[0].clientX, e.touches[0].clientY, e)}
            onTouchEnd={handleEnd}
            onMouseDown={(e) => handleStart(e.clientX, e.clientY)}
            onMouseMove={(e) => isDragging && handleMove(e.clientX, e.clientY, e)}
            onMouseUp={handleEnd}
            onMouseLeave={() => isDragging && handleEnd()}
            onClickCapture={(e) => {
              if (swipedRef.current) {
                e.stopPropagation();
                e.preventDefault();
                swipedRef.current = false;
                return;
              }
              if (offsetX > 0) {
                e.stopPropagation();
                e.preventDefault();
                closeSwipe();
              }
            }}
            style={{
              transform: `translateX(${offsetX}px)`,
              transition: isDragging ? 'none' : 'transform 0.28s cubic-bezier(0.16, 1, 0.3, 1)'
            }}
            className="relative z-10 bg-white dark:bg-[#1C1C1E] rounded-[16px]"
          >
            {children}
          </div>
        </div>
      );
    };

    const rgbToHex = (r, g, b) => {
      const toHex = (c) => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
    };

    const sampleDominantAccentColorFromRect = (ctx, x, y, w, h, canvasWidth, canvasHeight) => {
      try {
        const sx = Math.max(0, Math.floor(x - 4));
        const sy = Math.max(0, Math.floor(y - 4));
        const sw = Math.min(canvasWidth - sx, Math.max(8, Math.ceil(w + 8)));
        const sh = Math.min(canvasHeight - sy, Math.max(8, Math.ceil(h + 8)));
        if (sw <= 0 || sh <= 0) return null;

        const imgData = ctx.getImageData(sx, sy, sw, sh).data;
        let rSum = 0, gSum = 0, bSum = 0, count = 0;

        for (let i = 0; i < imgData.length; i += 4) {
          const r = imgData[i];
          const g = imgData[i + 1];
          const b = imgData[i + 2];
          const a = imgData[i + 3];
          if (a < 180) continue;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const chroma = max - min;
          const lum = (r + g + b) / 3;

          if (chroma > 28 && lum > 45 && lum < 235) {
            if (b > r + 25 && b > g + 15 && r < 95) continue;
            rSum += r;
            gSum += g;
            bSum += b;
            count++;
          }
        }

        if (count >= 4) {
          return rgbToHex(rSum / count, gSum / count, bSum / count);
        }
      } catch (e) {}
      return null;
    };

    const samplePageDominantAccentColor = (ctx, canvasWidth, canvasHeight) => {
      try {
        const imgData = ctx.getImageData(0, 0, canvasWidth, Math.floor(canvasHeight * 0.45)).data;
        const buckets = {};
        for (let i = 0; i < imgData.length; i += 16) {
          const r = imgData[i];
          const g = imgData[i + 1];
          const b = imgData[i + 2];
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const chroma = max - min;
          const lum = (r + g + b) / 3;
          if (chroma > 35 && lum > 55 && lum < 225) {
            if (b > r + 30 && b > g + 20 && r < 90) continue;
            const qr = Math.round(r / 16) * 16;
            const qg = Math.round(g / 16) * 16;
            const qb = Math.round(b / 16) * 16;
            const key = `${qr},${qg},${qb}`;
            buckets[key] = (buckets[key] || 0) + 1;
          }
        }
        let bestKey = null;
        let bestCount = 0;
        Object.keys(buckets).forEach(k => {
          if (buckets[k] > bestCount) {
            bestCount = buckets[k];
            bestKey = k;
          }
        });
        if (bestKey && bestCount > 10) {
          const [r, g, b] = bestKey.split(',').map(Number);
          return rgbToHex(r, g, b);
        }
      } catch (e) {}
      return null;
    };

    const extractPageLinesAndColors = async (pdf) => {
      const allLines = [];
      const detectedDayColors = {};

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.5 });
        const textContent = await page.getTextContent();

        let ctx = null;
        let pageFallbackColor = null;
        try {
          const canvas = document.createElement('canvas');
          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          ctx = canvas.getContext('2d', { willReadFrequently: true });
          await page.render({ canvasContext: ctx, viewport }).promise;
          pageFallbackColor = samplePageDominantAccentColor(ctx, canvas.width, canvas.height);
        } catch (err) {
          ctx = null;
        }

        const rawItems = [];
        for (const item of textContent.items) {
          if (!item.str) continue;
          const [vx, vy] = viewport.convertToViewportPoint(item.transform[4], item.transform[5]);
          const fontHeight = Math.hypot(item.transform[2], item.transform[3]) * 1.5 || Math.abs(item.height * 1.5) || 14;
          const width = (item.width || 0) * 1.5;
          rawItems.push({
            str: item.str,
            x: vx,
            y: vy,
            w: width,
            h: fontHeight
          });
        }

        rawItems.sort((a, b) => {
          if (Math.abs(a.y - b.y) > 5) return a.y - b.y;
          return a.x - b.x;
        });

        const rows = [];
        for (const it of rawItems) {
          const existingRow = rows.find(r => Math.abs(r.y - it.y) <= Math.max(5.5, it.h * 0.42));
          if (existingRow) {
            existingRow.items.push(it);
            existingRow.y = (existingRow.y * (existingRow.items.length - 1) + it.y) / existingRow.items.length;
          } else {
            rows.push({ y: it.y, items: [it] });
          }
        }

        rows.sort((a, b) => a.y - b.y);

        for (const r of rows) {
          r.items.sort((a, b) => a.x - b.x);
          let lineText = '';
          let prevEnd = null;
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxH = 14;

          for (const seg of r.items) {
            const s = seg.str;
            if (!s) continue;
            minX = Math.min(minX, seg.x);
            maxX = Math.max(maxX, seg.x + (seg.w || s.length * 6));
            minY = Math.min(minY, seg.y - seg.h);
            maxH = Math.max(maxH, seg.h);

            if (prevEnd !== null) {
              const gap = seg.x - prevEnd;
              const needsSpace = gap > 2.2 && !lineText.endsWith(' ') && !s.startsWith(' ') && !/^[.,;:!?)]/.test(s);
              if (needsSpace) lineText += ' ';
            }
            lineText += s;
            prevEnd = seg.x + (seg.w || s.length * 5.5);
          }

          const cleaned = lineText.replace(/\s+/g, ' ').trim();
          if (!cleaned) continue;

          if (ctx) {
            const sampled = sampleDominantAccentColorFromRect(ctx, minX, minY, maxX - minX, maxH * 1.25, ctx.canvas.width, ctx.canvas.height) || pageFallbackColor;
            if (/^viernes$/i.test(cleaned) && sampled) detectedDayColors.viernes = sampled;
            if (/^s[áa]bado$/i.test(cleaned) && sampled) detectedDayColors.sabado = sampled;
            if (/^domingo$/i.test(cleaned) && sampled) detectedDayColors.domingo = sampled;
            if (/^(programa|ma[ñn]ana)$/i.test(cleaned) && sampled && !detectedDayColors.programa) {
              detectedDayColors.programa = sampled;
            }
            if (/^preguntas\s+de\s+repaso/i.test(cleaned) && sampled && !detectedDayColors.repaso) {
              detectedDayColors.repaso = sampled;
            }
          }

          allLines.push({ text: cleaned, page: pageNum });
        }
      }

      return { allLines, detectedDayColors };
    };

    const parseProgramFromExtractedData = (lineObjects, fileName, detectedDayColors = {}) => {
      const noiseRegex = /^(?:CO-pgm\d*|CA-br\d*|CA-co\d*|S-\d+|Printed in.*|\d{1,2})$/i;

        .map(l => l.text.replace(/[\u200B-\u200D\uFEFF]/g, '').trim())

      const isRegional = hasViernes && (hasSabado || hasDomingo);

      let yearMatch = lines.slice(0, 35).join(' ').match(/\b(202[4-9]|203[0-5])\b/);

      const quotedCover = coverLines.find(l => /^[“"«].+[”"»]$/.test(l) && !/\([^)]+\d+:\d+/.test(l));
      if (quotedCover) {

          !/\([^)]+\d+:\d+/.test(l)
        );

          detectedTitle = titleCandidate.slice(0, 2).join(' ');

      }

      if (!detectedTitle) {
        detectedTitle = fileName.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim() || 'Programa de Asamblea';

      const progId = `pdf_prog_${Date.now()}`;
      const KNOWN_PREFIXES = [

            };

        const genericMatch = text.match(/^([A-ZÁÉÍÓÚÑ\s]{6,42}:)\s*(.*)$/);
        if (genericMatch) {

          };

      const classifyTalkOrSong = (text) => {

        if (/^(video\s+musical|m[úu]sica)\b/i.test(clean)) return 'music';

        const flushCurrent = () => {
          if (currentItem) {
            finalizeAudioVisualFormat(currentItem);
            items.push(currentItem);
            currentItem = null;
          }
        };

        for (let i = 0; i < secLines.length; i++) {
          const rawLine = secLines[i];
          const line = rawLine.replace(/^[\u2022\u25CF\u25AA\u25E6\u2023\u2043\uf0b7\-\*]\s*/, '• ').trim();

          if (/^ma[ñn]ana$/i.test(line)) {
            collectingScripture = false;
            flushCurrent();
            currentSymposium = null;
            items.push({ id: `${progId}_${secKey}_hdr_am`, title: 'Mañana', type: 'session_header' });
            continue;
          }

          if (/^tarde$/i.test(line)) {
            collectingScripture = false;
            flushCurrent();
            currentSymposium = null;
            if (!morningClosed) {
              items.push({ id: `${progId}_${secKey}_att_am`, title: 'Asistencia (Mañana)', type: 'attendance', hasStream });
              morningClosed = true;
            }
            items.push({ id: `${progId}_${secKey}_hdr_pm`, title: 'Tarde', type: 'session_header' });
            continue;
          }

          const timeMatch = line.match(/^(\d{1,2}\s*[:.]\s*\d{2})\s+(.*)$/);
          if (timeMatch) {
            collectingScripture = false;
            flushCurrent();
            const normalizedTime = timeMatch[1].replace(/\s+/g, '').replace('.', ':');
            const restText = timeMatch[2].trim();

            if (!items.some(it => it.type === 'session_header')) {
              items.push({ id: `${progId}_${secKey}_hdr_am`, title: 'Mañana', type: 'session_header' });
            }

            const itemType = classifyTalkOrSong(restText);
            const { prefix, rest } = extractPrefix(restText);

            const newItem = {
              id: `${progId}_${secKey}_${itemCounter++}`,
              time: normalizedTime,
              title: prefix ? rest : restText,
              type: itemType
            };
            if (prefix) newItem.prefix = prefix;

            if (itemType === 'symposium') {
              newItem.parts = [];
              currentSymposium = newItem;
              currentItem = newItem;
            } else {
              currentSymposium = null;
              currentItem = newItem;
            }

            if (itemType === 'song' && /intermedio/i.test(restText) && !morningClosed) {
              flushCurrent();
              items.push({ id: `${progId}_${secKey}_att_am`, title: 'Asistencia (Mañana)', type: 'attendance', hasStream });
              morningClosed = true;
            }
            continue;
          }

          if (collectingScripture) {
            if (line.length > 2 && !/^(viernes|s[áa]bado|domingo|programa)$/i.test(line)) {
              scriptureLines.push(line);
            }
            continue;
          }

          if (line.startsWith('• ')) {
            const bulletTitle = '• ' + line.slice(2).trim();
            if (currentSymposium) {
              if (currentItem && currentItem === currentSymposium) {
                items.push(currentSymposium);
                currentItem = null;
              }
              currentSymposium.parts.push({
                id: `${currentSymposium.id}_p${currentSymposium.parts.length + 1}`,
                title: bulletTitle
              });
            } else if (currentItem) {
              currentItem.type = 'symposium';
              currentItem.parts = [{
                id: `${currentItem.id}_p1`,
                title: bulletTitle
              }];
              currentSymposium = currentItem;
              items.push(currentSymposium);
              currentItem = null;
            }
            continue;
          }

          if (currentSymposium && currentSymposium.parts.length > 0 && !currentItem) {
            const lastPart = currentSymposium.parts[currentSymposium.parts.length - 1];
            const endsWithClosedCitation = /\)\s*$/.test(lastPart.title);
            if (!endsWithClosedCitation) {
              lastPart.title = `${lastPart.title} ${line}`.replace(/\s+/g, ' ').trim();
            } else {
              currentSymposium.parts.push({
                id: `${currentSymposium.id}_p${currentSymposium.parts.length + 1}`,
                title: `• ${line}`
              });
            }
            continue;
          }

          if (currentItem) {
            if (currentItem.type === 'symposium' && /[!?.”"»]$/.test(currentItem.title) && (/[“"«(]/.test(line) || /^[A-ZÁÉÍÓÚÑ]/.test(line))) {
              items.push(currentItem);
              currentSymposium = currentItem;
              currentItem = null;
              currentSymposium.parts.push({
                id: `${currentSymposium.id}_p1`,
                title: `• ${line}`
              });
              continue;
            }

            currentItem.title = `${currentItem.title} ${line}`.replace(/\s+/g, ' ').trim();
            if (!currentItem.prefix) {
              const { prefix, rest } = extractPrefix(currentItem.title);
              if (prefix) {
                currentItem.prefix = prefix;
                currentItem.title = rest;
              }
            }
            if (/serie\s+de\s+discursos/i.test(currentItem.prefix || '') && currentItem.type !== 'symposium') {
              currentItem.type = 'symposium';
              currentItem.parts = currentItem.parts || [];
              currentSymposium = currentItem;
            }
            if (currentItem.type === 'song' && /intermedio/i.test(currentItem.title) && !morningClosed) {
              flushCurrent();
              items.push({ id: `${progId}_${secKey}_att_am`, title: 'Asistencia (Mañana)', type: 'attendance', hasStream });
              morningClosed = true;
            }
          }
        }

        flushCurrent();

        if (!morningClosed && items.length > 0) {
          items.push({ id: `${progId}_${secKey}_att_am`, title: 'Asistencia (Mañana)', type: 'attendance', hasStream });
        }
        if (items.some(it => it.title === 'Tarde' && it.type === 'session_header')) {
          items.push({ id: `${progId}_${secKey}_att_pm`, title: 'Asistencia (Tarde)', type: 'attendance', hasStream });
        }

        return {
          items,
          scripture: scriptureLines.join(' ').replace(/\s+/g, ' ').trim()
        };
      };

      if (isRegional) {
        const daySections = { viernes: [], sabado: [], domingo: [] };
        let activeDay = null;

        for (const l of lines) {
          if (/^viernes$/i.test(l)) { activeDay = 'viernes'; continue; }
          if (/^s[áa]bado$/i.test(l)) { activeDay = 'sabado'; continue; }
          if (/^domingo$/i.test(l)) { activeDay = 'domingo'; continue; }
          if (activeDay) {
            daySections[activeDay].push(l);
          }
        }

        const vBuilt = buildSectionItems(daySections.viernes, 'v', true);
        const sBuilt = buildSectionItems(daySections.sabado, 's', true);
        const dBuilt = buildSectionItems(daySections.domingo, 'd', true);

        return {
          id: progId,
          title: detectedTitle,
          year: year,
          days: 3,
          isCustomProgram: true,
          themes: {
            viernes: {
              dayTitle: 'Viernes',
              scripture: vBuilt.scripture || 'Programa del viernes',
              color: detectedDayColors.viernes || '#E5854B'
            },
            sabado: {
              dayTitle: 'Sábado',
              scripture: sBuilt.scripture || 'Programa del sábado',
              color: detectedDayColors.sabado || '#87B896'
            },
            domingo: {
              dayTitle: 'Domingo',
              scripture: dBuilt.scripture || 'Programa del domingo',
              color: detectedDayColors.domingo || '#6CA6CD'
            }
          },
          viernes: vBuilt.items,
          sabado: sBuilt.items,
          domingo: dBuilt.items
        };
      } else {
        const progLines = [];
        const repasoLines = [];
        let inRepaso = false;

        for (const l of lines) {
          if (/preguntas\s+de\s+repaso/i.test(l)) {
            inRepaso = true;
            continue;
          }
          if (inRepaso) {
            repasoLines.push(l);
          } else {
            progLines.push(l);
          }
        }

        const pBuilt = buildSectionItems(progLines, 'p', false);
        const repasoItems = [];
        let currentRep = null;

        repasoLines.forEach((l) => {
          if (/^\d{1,2}\s*[\.\)]\s+/.test(l)) {
            if (currentRep) repasoItems.push(currentRep);
            currentRep = {
              id: `${progId}_rep_${repasoItems.length + 1}`,
              title: l,
              type: 'talk'
            };
          } else if (currentRep) {
            currentRep.title = `${currentRep.title} ${l}`.replace(/\s+/g, ' ').trim();
          }
        });
        if (currentRep) repasoItems.push(currentRep);

        if (repasoItems.length === 0) {
          repasoItems.push({
            id: `${progId}_rep_1`,
            title: '1. ¿Qué puntos destacados aprendimos en este programa?',
            type: 'talk'
          });
        }

        const mainColor = detectedDayColors.programa || detectedDayColors.viernes || '#D9825B';
        const repColor = detectedDayColors.repaso || mainColor;

        return {
          id: progId,
          title: detectedTitle,
          year: `${year} (Asamblea PDF)`,
          days: 1,
          isCustomProgram: true,
          themes: {
            programa: {
              dayTitle: 'Programa',
              scripture: pBuilt.scripture || detectedTitle,
              color: mainColor
            },
            repaso: {
              dayTitle: 'Preguntas de repaso',
              scripture: pBuilt.scripture || detectedTitle,
              color: repColor
            }
          },
          programa: pBuilt.items,
          repaso: repasoItems
        };
      }
    };

    const RichNoteEditor = ({ id, value, onChange, placeholder, fontSize, isCustomNote = false, syncVersion = 0 }) => {
      const editorRef = useRef(null);
      const lastIdRef = useRef(null);
      const lastSyncRef = useRef(syncVersion);
      const [activeFormats, setActiveFormats] = useState({ bold: false, underline: false });

      const checkActiveFormats = () => {
        if (!editorRef.current) return;
        try {
          const isBold = document.queryCommandState('bold');
          const isUnderline = document.queryCommandState('underline');
          setActiveFormats(prev => (
            prev.bold === isBold && prev.underline === isUnderline
              ? prev
              : { bold: isBold, underline: isUnderline }
          ));
        } catch (e) {}
      };

      useEffect(() => {
        if (editorRef.current && (lastIdRef.current !== id || lastSyncRef.current !== syncVersion)) {
          lastIdRef.current = id;
          lastSyncRef.current = syncVersion;
          const defaultContent = (!value && !isCustomNote && !id.includes('rep')) ? '<b>Orador: </b><br><br>' : (value || '');
          editorRef.current.innerHTML = value || defaultContent;
        }
      }, [id, value, isCustomNote, syncVersion]);

      useEffect(() => {
        const handleSelectionChange = () => {
          if (document.activeElement === editorRef.current) {
            checkActiveFormats();
          }
        };
        document.addEventListener('selectionchange', handleSelectionChange);
        return () => document.removeEventListener('selectionchange', handleSelectionChange);
      }, []);

      const handleInput = () => {
        if (editorRef.current) {
          onChange(editorRef.current.innerHTML);
          checkActiveFormats();
        }
      };

      const applyFormat = (e, command, arg = null) => {
        e.preventDefault();
        if (!editorRef.current) return;
        try {
          editorRef.current.focus();
          document.execCommand(command, false, arg);
          onChange(editorRef.current.innerHTML);
          checkActiveFormats();
        } catch (err) {}
      };

      const insertText = (e, text) => {
        e.preventDefault();
        if (!editorRef.current) return;
        try {
          editorRef.current.focus();
          document.execCommand('insertText', false, text);
          onChange(editorRef.current.innerHTML);
        } catch (err) {}
      };

      return (
        <div className="mt-3 rounded-[14px] overflow-hidden border border-[#C6C6C8]/60 dark:border-[#38383A] bg-white dark:bg-[#1C1C1E] shadow-sm transition-colors">
          <div className="flex items-center gap-1.5 px-3 py-2 bg-[#F2F2F7] dark:bg-[#2C2C2E] border-b border-[#C6C6C8]/50 dark:border-[#38383A] overflow-x-auto">
            <button
              type="button"
              onMouseDown={(e) => applyFormat(e, 'bold')}
              aria-pressed={activeFormats.bold}
              className={`w-9 h-8 rounded-[8px] font-bold text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0 ${
                activeFormats.bold
                  ? 'bg-[#007AFF] text-white ring-2 ring-[#007AFF]/30'
                  : 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white'
              }`}
            >
              B
            </button>
            <button
              type="button"
              onMouseDown={(e) => applyFormat(e, 'underline')}
              aria-pressed={activeFormats.underline}
              className={`w-9 h-8 rounded-[8px] underline font-semibold text-[15px] shadow-sm active:scale-95 transition-all flex items-center justify-center shrink-0 ${
                activeFormats.underline
                  ? 'bg-[#007AFF] text-white ring-2 ring-[#007AFF]/30'
                  : 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white'
              }`}
            >
              U
            </button>
            <div className="w-px h-5 bg-[#C6C6C8] dark:bg-[#48484A] mx-1 shrink-0"></div>
            <button type="button" onMouseDown={(e) => insertText(e, '\n• ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-black dark:text-white font-bold text-[18px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">•</button>
            <div className="w-px h-5 bg-[#C6C6C8] dark:bg-[#48484A] mx-1 shrink-0"></div>
            <button type="button" onMouseDown={(e) => insertText(e, '💎 ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">💎</button>
            <button type="button" onMouseDown={(e) => insertText(e, '❤️ ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">❤️</button>
            <button type="button" onMouseDown={(e) => insertText(e, '✅ ')} className="w-9 h-8 rounded-[8px] bg-white dark:bg-[#3A3A3C] text-[16px] shadow-sm active:scale-95 transition-transform flex items-center justify-center shrink-0">✅</button>
          </div>
          <div>
            <div
              ref={editorRef}
              contentEditable={true}
              suppressContentEditableWarning={true}
              onInput={handleInput}
              onKeyUp={checkActiveFormats}
              onMouseUp={checkActiveFormats}
              onTouchEnd={checkActiveFormats}
              onFocus={checkActiveFormats}
              data-placeholder={placeholder}
              style={{ fontSize: `${fontSize}px` }}
              className="p-4 min-h-[140px] focus:outline-none text-black dark:text-white bg-white dark:bg-[#1C1C1E] leading-relaxed whitespace-pre-wrap break-words"
            />
          </div>
        </div>
      );
    };

    const getOrCreateDeviceUser = () => {
      try {
        const savedUser = localStorage.getItem('asamblea-active-user');
        if (savedUser) {
          const parsed = JSON.parse(savedUser);
          if (parsed && parsed.username) return parsed;
        }
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('asamblea-notas-')) {
            const existingUsername = key.replace('asamblea-notas-', '');
            if (existingUsername) {
              const recoveredUser = { username: existingUsername };
              localStorage.setItem('asamblea-active-user', JSON.stringify(recoveredUser));
              return recoveredUser;
            }
          }
        }
        const randomId = 'disp_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36).slice(-4);
        const newUser = { username: randomId };
        localStorage.setItem('asamblea-active-user', JSON.stringify(newUser));
        return newUser;
      } catch (e) {
        return { username: 'local_user' };
      }
    };

      const isServiceWorkerAllowed = () => {
        try {
          return (
            'serviceWorker' in navigator &&
            (window.location.protocol === 'https:' || window.location.protocol === 'http:') &&
            window.location.origin !== 'null' &&
            !window.location.hostname.includes('usercontent.goog') &&
            !document.URL.startsWith('about:') &&
            !document.URL.startsWith('blob:')
          );
        } catch (e) {
          return false;

      };

      useEffect(() => {
        let isMounted = true;
        const checkServiceWorkerVersion = async () => {
          try {
            const res = await fetch('./sw.js?check=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) return;
            const swText = await res.text();
            const match = swText.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
            if (match && match[1]) {
              const remoteVersion = match[1];
              const installedVersion = localStorage.getItem('asamblea-installed-sw-version');
              if (!installedVersion) {
                localStorage.setItem('asamblea-installed-sw-version', remoteVersion);
              } else if (installedVersion !== remoteVersion && isMounted) {
                setUpdateBanner({ version: remoteVersion });
              }
            }
          } catch (e) {}

          if (isServiceWorkerAllowed()) {
            try {
              const reg = await navigator.serviceWorker.getRegistration();
              if (reg) {
                await reg.update().catch(() => {});
                if (reg.waiting && isMounted) {
                  setUpdateBanner(prev => prev || { version: 'nueva' });
                }
                reg.addEventListener('updatefound', () => {
                  const newWorker = reg.installing;
                  if (newWorker) {
                    newWorker.addEventListener('statechange', () => {
                      if (newWorker.state === 'installed' && navigator.serviceWorker.controller && isMounted) {
                        setUpdateBanner(prev => prev || { version: 'nueva' });
                      }
                    });
                  }
                });
              }
            } catch (err) {}
          }
        };

        checkServiceWorkerVersion();
        const onFocus = () => checkServiceWorkerVersion();
        window.addEventListener('focus', onFocus);
        return () => {
          isMounted = false;
          window.removeEventListener('focus', onFocus);
        };
      }, []);

          if ('caches' in window) {

            await Promise.all(cacheNames.map(name => caches.delete(name)));
          }
          if (isServiceWorkerAllowed()) {
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(r => r.unregister()));

              setCustomNotesList([]);
            }
          } catch (e) {}
        }
      }, [currentUser]);

      const saveNotesNow = (updatedNotes) => {
        if (!currentUser?.username) return;
        try {
          localStorage.setItem(`asamblea-notas-${currentUser.username}`, JSON.stringify(updatedNotes));
        } catch (e) {}
      };

      const handleNoteChange = (id, val) => {
        setIsSaving(true);
        setNotes(prev => {
          const next = { ...prev, [id]: val };
          if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
          saveTimeoutRef.current = setTimeout(() => {
            saveNotesNow(next);
            setIsSaving(false);
          }, 600);
          return next;
        });
      };

      const handleOpenProgram = (progId) => {
        const prog = allProgramsDB.find(p => p.id === progId);
        if (!prog) return;
        setActiveProgram(progId);
        setActiveTab(prog.days === 3 ? 'viernes' : 'programa');
        setCurrentScreen('program_view');
        window.scrollTo(0, 0);
      };

      const createNewCustomNote = () => {
        if (!currentUser?.username) return;
        const newId = `custom_${Date.now()}`;
        const nextColor = NOTE_COLORS[customNotesList.length % NOTE_COLORS.length];
        const assignedFolder = selectedFolderId !== 'all' ? selectedFolderId : null;
        const newNote = {
          id: newId,
          title: 'Nueva nota',
          createdAt: Date.now(),
          color: nextColor,
          folderId: assignedFolder
        };
        const updatedList = [newNote, ...customNotesList];
        setCustomNotesList(updatedList);
        try {
          localStorage.setItem(`asamblea-custom-list-${currentUser.username}`, JSON.stringify(updatedList));
        } catch (e) {}
        setActiveProgram(newId);
        setCurrentScreen('custom_note');
        window.scrollTo(0, 0);
      };

      const handleCreateFolder = (e) => {
        e.preventDefault();
        const cleanName = newFolderName.trim();
        if (!cleanName || !currentUser?.username) return;
        const newFolder = {
          id: `folder_${Date.now()}`,
          name: cleanName,
          color: newFolderColor,
          createdAt: Date.now()
        };
        const updated = [...foldersList, newFolder];
        setFoldersList(updated);
        try {
          localStorage.setItem(`asamblea-folders-${currentUser.username}`, JSON.stringify(updated));
        } catch (err) {}
        setNewFolderName('');
        setIsFolderModalOpen(false);
        setSelectedFolderId(newFolder.id);
        showToast(`Carpeta "${cleanName}" creada`);
      };

      const handleDeleteFolder = (folderId) => {
        if (!currentUser?.username) return;
        const updatedFolders = foldersList.filter(f => f.id !== folderId);
        setFoldersList(updatedFolders);
        const updatedNotes = customNotesList.map(n => n.folderId === folderId ? { ...n, folderId: null } : n);
        setCustomNotesList(updatedNotes);
        if (selectedFolderId === folderId) setSelectedFolderId('all');
        try {
          localStorage.setItem(`asamblea-folders-${currentUser.username}`, JSON.stringify(updatedFolders));
          localStorage.setItem(`asamblea-custom-list-${currentUser.username}`, JSON.stringify(updatedNotes));
        } catch (err) {}
        showToast('Carpeta eliminada');
      };

      const handleMoveNoteToFolder = (noteId, targetFolderId) => {
        if (!currentUser?.username) return;
        const updatedList = customNotesList.map(n => n.id === noteId ? { ...n, folderId: targetFolderId } : n);
        setCustomNotesList(updatedList);
        try {
          localStorage.setItem(`asamblea-custom-list-${currentUser.username}`, JSON.stringify(updatedList));
        } catch (err) {}
        setMovingNoteObj(null);
        const folderName = foldersList.find(f => f.id === targetFolderId)?.name;
        showToast(targetFolderId ? `Movida a "${folderName}"` : 'Quitada de la carpeta');
      };

      const handlePdfUploadChange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setIsParsingPdf(true);
        try {
          const pdfjsLib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
          if (!pdfjsLib) {
            showToast('Librería de PDF aún cargando, intenta en un segundo.');
            setIsParsingPdf(false);
            return;
          }
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

          const { allLines, detectedDayColors } = await extractPageLinesAndColors(pdf);
          const newProgram = parseProgramFromExtractedData(allLines, file.name, detectedDayColors);

          const updatedPrograms = [newProgram, ...customProgramsList];
          setCustomProgramsList(updatedPrograms);
          if (currentUser?.username) {
            localStorage.setItem(`asamblea-custom-programs-${currentUser.username}`, JSON.stringify(updatedPrograms));
          }
          setIsParsingPdf(false);
          setIsDrawerOpen(false);
          setActiveProgram(newProgram.id);
          setActiveTab(newProgram.days === 3 ? 'viernes' : 'programa');
          setCurrentScreen('program_view');
          showToast('Programa de asamblea creado con éxito');
        } catch (err) {
          setIsParsingPdf(false);
          showToast('No se pudo leer el PDF. Verifica que contenga texto.');
        }
        e.target.value = '';
      };

      const handleOpenCustomNote = (noteId) => {
        setActiveProgram(noteId);
        setCurrentScreen('custom_note');
        window.scrollTo(0, 0);
      };

      const handleUpdateCustomNoteTitle = (e) => {
        const newTitle = e.target.value;
        const updatedList = customNotesList.map(n => n.id === activeProgram ? { ...n, title: newTitle } : n);
        setCustomNotesList(updatedList);
        if (currentUser?.username) {
          try {
            localStorage.setItem(`asamblea-custom-list-${currentUser.username}`, JSON.stringify(updatedList));
          } catch (e) {}
        }
      };

      const toggleItem = (id) => {
        setExpandedItems(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const toggleDarkMode = () => setIsDarkMode(prev => !prev);
      
      const increaseFontSize = () => {
        setFontSize(prev => {
          const next = Math.min(prev + 2, 28);
          try { localStorage.setItem('asamblea-fontsize', next.toString()); } catch (e) {}
          return next;
        });
      };

      const decreaseFontSize = () => {
        setFontSize(prev => {
          const next = Math.max(prev - 2, 12);
          try { localStorage.setItem('asamblea-fontsize', next.toString()); } catch (e) {}
          return next;
        });
      };

      const toggleArchiveItem = (id) => {
        setArchivedItems(prev => {
          const isNowArchived = !prev[id];
          const newState = { ...prev, [id]: isNowArchived };
          if (currentUser?.username) {
            try { localStorage.setItem(`asamblea-archived-${currentUser.username}`, JSON.stringify(newState)); } catch (e) {}
          }
          showToast(isNowArchived ? 'Enviado a Archivo' : 'Restaurado de Archivo');
          return newState;
        });
      };

      const deleteItem = (id) => {
        setDeletedItems(prev => {
          const newState = { ...prev, [id]: true };
          if (currentUser?.username) {
            try { localStorage.setItem(`asamblea-deleted-${currentUser.username}`, JSON.stringify(newState)); } catch (e) {}
          }
          showToast('Elemento eliminado');
          return newState;
        });
      };

      const handleBackNavigation = () => {
        if (saveTimeoutRef.current) {
          clearTimeout(saveTimeoutRef.current);
          saveNotesNow(notes);
          setIsSaving(false);
        }
        if (currentScreen === 'program_view') {
          setCurrentScreen('assemblies');
        } else {
          setCurrentScreen('notes_home');
        }
        setActiveProgram(null);
        setActiveTab('');
      };

      const handleExportBackup = () => {
        if (!currentUser?.username) return;
        if (saveTimeoutRef.current) {
          clearTimeout(saveTimeoutRef.current);
          saveNotesNow(notes);
          setIsSaving(false);
        }
        setIsDrawerOpen(false);
        const backupPayload = {
          v: 2,
          user: currentUser.username,
          date: Date.now(),
          notes,
          customNotesList,
          foldersList,
          customProgramsList,
          archivedPrograms: archivedItems,
          deletedPrograms: deletedItems
        };
        const blob = new Blob([JSON.stringify(backupPayload)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `Respaldo_Mis_Apuntes_${dateStr}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Copia de seguridad exportada');
      };

      const handleImportBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file || !currentUser?.username) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data && typeof data === 'object' && (data.notes || data.customNotesList)) {
              const u = currentUser.username;
              const mergedNotes = { ...notes, ...(data.notes || {}) };
              
              const existingIds = new Set(customNotesList.map(n => n.id));
              const incomingCustom = (data.customNotesList || []).map((item, idx) => ({
                ...item,
                color: item.color || NOTE_COLORS[idx % NOTE_COLORS.length],
                createdAt: item.createdAt || Date.now(),
                folderId: item.folderId || null
              }));
              const mergedCustomList = [
                ...customNotesList,
                ...incomingCustom.filter(n => !existingIds.has(n.id))
              ];

              const existingFolderIds = new Set(foldersList.map(f => f.id));
              const mergedFolders = [
                ...foldersList,
                ...(data.foldersList || []).filter(f => !existingFolderIds.has(f.id))
              ];

              const existingProgIds = new Set(customProgramsList.map(p => p.id));
              const mergedCustomProgs = [
                ...customProgramsList,
                ...(data.customProgramsList || []).filter(p => !existingProgIds.has(p.id))
              ];

              const nextDeleted = { ...deletedItems, ...(data.deletedPrograms || {}) };
              const nextArchived = { ...archivedItems, ...(data.archivedPrograms || {}) };

              incomingCustom.forEach(item => {
                if (!data.deletedPrograms || !data.deletedPrograms[item.id]) delete nextDeleted[item.id];
                if (!data.archivedPrograms || !data.archivedPrograms[item.id]) delete nextArchived[item.id];
              });

              allProgramsDB.forEach(prog => {
                if (!data.deletedPrograms || !data.deletedPrograms[prog.id]) delete nextDeleted[prog.id];
                if (!data.archivedPrograms || !data.archivedPrograms[prog.id]) delete nextArchived[prog.id];
              });

              setNotes(mergedNotes);
              setCustomNotesList(mergedCustomList);
              setFoldersList(mergedFolders);
              setCustomProgramsList(mergedCustomProgs);
              setArchivedItems(nextArchived);
              setDeletedItems(nextDeleted);
              setImportVersion(v => v + 1);

              localStorage.setItem(`asamblea-notas-${u}`, JSON.stringify(mergedNotes));
              localStorage.setItem(`asamblea-custom-list-${u}`, JSON.stringify(mergedCustomList));
              localStorage.setItem(`asamblea-folders-${u}`, JSON.stringify(mergedFolders));
              localStorage.setItem(`asamblea-custom-programs-${u}`, JSON.stringify(mergedCustomProgs));
              localStorage.setItem(`asamblea-archived-${u}`, JSON.stringify(nextArchived));
              localStorage.setItem(`asamblea-deleted-${u}`, JSON.stringify(nextDeleted));

              setIsDrawerOpen(false);
              showToast('Apuntes restaurados con éxito');
            }
          } catch (err) {
            showToast('El archivo seleccionado no es válido');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleExportPDF = () => {
        setIsDrawerOpen(false);
        const element = document.createElement('div');
        element.style.padding = '30px';
        element.style.fontFamily = '-apple-system, BlinkMacSystemFont, Arial, sans-serif';
        element.style.color = '#1C1C1E';

        let html = `<h1 style="color: #007AFF; text-align: center; margin-bottom: 25px; font-size: 24px;">Mis Apuntes</h1>`;

        if (currentScreen === 'custom_note' && activeProgram) {
          const noteObj = customNotesList.find(n => n.id === activeProgram);
          html += `<h2 style="color: #000; border-bottom: 2px solid ${noteObj?.color || '#007AFF'}; padding-bottom: 8px;">${noteObj?.title || 'Nota Libre'}</h2>`;
          if (noteObj?.createdAt) {
            html += `<p style="font-size: 12px; color: #8E8E93; margin-top: 4px;">Creada el ${formatNoteDate(noteObj.createdAt)}</p>`;
          }
          html += `<div style="margin-top: 15px; font-size: 15px; line-height: 1.6;">${notes[activeProgram] || 'Sin contenido.'}</div>`;
        } else {
          const targetPrograms = activeProgram ? allProgramsDB.filter(p => p.id === activeProgram) : allProgramsDB;
          targetPrograms.forEach(prog => {
            html += `<h2 style="color: #007AFF; margin-top: 25px; border-bottom: 2px solid #E5E5EA; padding-bottom: 6px;">${prog.title} (${prog.year})</h2>`;
            const sections = prog.days === 3 ? ['viernes', 'sabado', 'domingo'] : ['programa', 'repaso'];
            sections.forEach(sec => {
              if (!prog[sec]) return;
              prog[sec].forEach(item => {
                if (item.type === 'attendance') {
                  const gen = parseInt(notes[item.id + '_general'] || '0', 10) || 0;
                  const str = parseInt(notes[item.id + '_stream'] || '0', 10) || 0;
                  const tot = gen + str;
                  if (gen || str) {
                    if (item.hasStream) {
                      html += `<p style="font-size: 13px; color: #636366;"><strong>${item.title}:</strong> Presencial: ${gen} | Streaming: ${str} | Total: ${tot}</p>`;
                    } else {
                      html += `<p style="font-size: 13px; color: #636366;"><strong>${item.title}:</strong> Presencial: ${gen}</p>`;
                    }
                  }
                } else if (item.type === 'talk' || item.type === 'symposium') {
                  if (notes[item.id] && notes[item.id].trim() !== '' && notes[item.id] !== '<b>Orador: </b><br><br>') {
                    html += `<h3 style="color: #000; margin-top: 16px; margin-bottom: 6px; font-size: 16px;">${item.time ? item.time + ' - ' : ''}${item.prefix ? item.prefix + ' ' : ''}${item.title}</h3>`;
                    html += `<div style="background: #F2F2F7; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.5;">${notes[item.id]}</div>`;
                  }
                  if (item.type === 'symposium' && item.parts) {
                    item.parts.forEach(part => {
                      if (notes[part.id] && notes[part.id].trim() !== '' && notes[part.id] !== '<b>Orador: </b><br><br>') {
                        html += `<h4 style="color: #3A3A3C; margin-top: 12px; margin-left: 15px; margin-bottom: 4px; font-size: 15px;">${part.title}</h4>`;
                        html += `<div style="background: #F2F2F7; padding: 12px; border-radius: 8px; margin-left: 15px; font-size: 14px; line-height: 1.5;">${notes[part.id]}</div>`;
                      }
                    });
                  }
                }
              });
            });
          });
        }

        element.innerHTML = html;
        if (window.html2pdf) {
          window.html2pdf().set({
            margin: 15,
            filename: `Mis_Apuntes_${new Date().toISOString().slice(0, 10)}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          }).from(element).save();
        }
      };

      const archivedProgramsList = allProgramsDB.filter(p => archivedItems[p.id] && !deletedItems[p.id]);
      const archivedCustomNotes = customNotesList.filter(n => archivedItems[n.id] && !deletedItems[n.id]);
      const totalArchivedCount = archivedProgramsList.length + archivedCustomNotes.length;

      const activeProgramObj = allProgramsDB.find(p => p.id === activeProgram);
      const currentTheme = activeProgramObj?.themes?.[activeTab] || {
        dayTitle: activeTab,
        scripture: '',
        color: '#E5854B'
      };

      const visibleCustomNotes = customNotesList.filter(n => {
        if (archivedItems[n.id] || deletedItems[n.id]) return false;
        if (selectedFolderId === 'all') return true;
        return n.folderId === selectedFolderId;
      });

      return (
        <div className="min-h-screen bg-[#F2F2F7] dark:bg-[#000000] text-black dark:text-white font-sans pb-20 selection:bg-[#007AFF]/30">
          
          <input
            ref={fileInputRef}
            type="file"
            accept=".json,application/json"
            onChange={handleImportBackup}
            className="hidden"
          />

          <input
            ref={pdfInputRef}
            type="file"
            accept=".pdf,application/pdf"
            onChange={handlePdfUploadChange}
            className="hidden"
          />

          {toastMsg && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-black/85 dark:bg-[#2C2C2E] text-white px-4 py-2.5 rounded-full text-[14px] font-medium shadow-lg animate-fade-in">
              {toastMsg}
            </div>
          )}

          {isParsingPdf && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white dark:bg-[#1C1C1E] rounded-[22px] p-6 max-w-xs w-full text-center shadow-2xl border border-[#C6C6C8]/40 dark:border-[#38383A]">
                <div className="w-12 h-12 rounded-full border-4 border-[#007AFF] border-t-transparent animate-spin mx-auto mb-3"></div>
                <h3 className="font-bold text-[17px] text-black dark:text-white mb-1">Procesando PDF...</h3>
                <p className="text-[13px] text-[#8E8E93]">Detectando colores de cada día, discursos, textos y asistencias automáticamente</p>
              </div>
            </div>
          )}

          {updateBanner && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-[#F2F2F7] dark:bg-[#1C1C1E] w-full max-w-xs rounded-[20px] overflow-hidden shadow-2xl border border-[#C6C6C8]/40 dark:border-[#38383A] text-center">
                <div className="p-5">
                  <div className="w-12 h-12 rounded-full bg-[#007AFF]/15 text-[#007AFF] flex items-center justify-center mx-auto mb-3">
                    <Download size={24} />
                  </div>
                  <h3 className="text-[18px] font-bold text-black dark:text-white mb-1">
                    Hay una nueva versión
                  </h3>
                  <p className="text-[14px] text-[#8E8E93] leading-snug">
                    Instala la actualización para obtener las últimas mejoras. Tus notas están protegidas y no se borrarán.
                  </p>
                </div>
                <div className="flex border-t border-[#C6C6C8]/50 dark:border-[#38383A]">
                  <button
                    type="button"
                    disabled={isUpdatingApp}
                    onClick={() => setUpdateBanner(null)}
                    className="flex-1 py-3.5 text-[16px] font-medium text-[#8E8E93] active:bg-black/5 dark:active:bg-white/5 transition-colors border-r border-[#C6C6C8]/50 dark:border-[#38383A]"
                  >
                    Después
                  </button>
                  <button
                    type="button"
                    disabled={isUpdatingApp}
                    onClick={handleApplyAppUpdate}
                    className="flex-1 py-3.5 text-[16px] font-semibold text-[#007AFF] active:bg-black/5 dark:active:bg-white/5 transition-colors"
                  >
                    {isUpdatingApp ? 'Actualizando...' : 'Instalar'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {isFolderModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
              <form onSubmit={handleCreateFolder} className="bg-[#F2F2F7] dark:bg-[#1C1C1E] w-full max-w-xs rounded-[20px] overflow-hidden shadow-2xl border border-[#C6C6C8]/40 dark:border-[#38383A]">
                <div className="p-5">
                  <h3 className="text-[18px] font-bold text-black dark:text-white text-center mb-1">Nueva Carpeta</h3>
                  <p className="text-[13px] text-[#8E8E93] text-center mb-4">Organiza tus notas regulares por tema</p>
                  <input
                    type="text"
                    autoFocus
                    value={newFolderName}
                    onChange={(e) => setNewFolderName(e.target.value)}
                    placeholder="Nombre de la carpeta..."
                    className="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-[#2C2C2E] text-black dark:text-white border border-[#C6C6C8] dark:border-[#38383A] focus:outline-none focus:border-[#007AFF] text-[16px] mb-4"
                  />
                  <div className="flex items-center justify-center gap-2.5 flex-wrap">
                    {NOTE_COLORS.map(c => (
                      <button
                        key={c}
                        type="button"
                        onClick={() => setNewFolderColor(c)}
                        style={{ backgroundColor: c }}
                        className={`w-7 h-7 rounded-full transition-transform ${newFolderColor === c ? 'scale-125 ring-2 ring-white dark:ring-white shadow-md' : 'opacity-70'}`}
                      />
                    ))}
                  </div>
                </div>
                <div className="flex border-t border-[#C6C6C8]/50 dark:border-[#38383A]">
                  <button
                    type="button"
                    onClick={() => setIsFolderModalOpen(false)}
                    className="flex-1 py-3.5 text-[16px] font-medium text-[#8E8E93] border-r border-[#C6C6C8]/50 dark:border-[#38383A]"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-3.5 text-[16px] font-semibold text-[#007AFF]"
                  >
                    Crear
                  </button>
                </div>
              </form>
            </div>
          )}

          {movingNoteObj && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-[#F2F2F7] dark:bg-[#1C1C1E] w-full max-w-xs rounded-[20px] overflow-hidden shadow-2xl border border-[#C6C6C8]/40 dark:border-[#38383A]">
                <div className="p-5">
                  <h3 className="text-[18px] font-bold text-black dark:text-white text-center mb-1">Mover a carpeta</h3>
                  <p className="text-[13px] text-[#8E8E93] text-center mb-4 truncate">{movingNoteObj.title || 'Nota sin título'}</p>
                  <div className="space-y-2 max-h-60 overflow-y-auto">
                    <button
                      type="button"
                      onClick={() => handleMoveNoteToFolder(movingNoteObj.id, null)}
                      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[15px] font-medium transition-colors ${!movingNoteObj.folderId ? 'bg-[#007AFF]/15 text-[#007AFF]' : 'bg-white dark:bg-[#2C2C2E] text-black dark:text-white'}`}
                    >
                      <span>Sin carpeta (General)</span>
                      {!movingNoteObj.folderId && <span>✓</span>}
                    </button>
                    {foldersList.map(folder => (
                      <button
                        key={folder.id}
                        type="button"
                        onClick={() => handleMoveNoteToFolder(movingNoteObj.id, folder.id)}
                        className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[15px] font-medium transition-colors ${movingNoteObj.folderId === folder.id ? 'bg-[#007AFF]/15 text-[#007AFF]' : 'bg-white dark:bg-[#2C2C2E] text-black dark:text-white'}`}
                      >
                        <div className="flex items-center gap-2.5 truncate">
                          <span className="w-3 h-3 rounded-full shrink-0" style={{ backgroundColor: folder.color }}></span>
                          <span className="truncate">{folder.name}</span>
                        </div>
                        {movingNoteObj.folderId === folder.id && <span>✓</span>}
                      </button>
                    ))}
                    {foldersList.length === 0 && (
                      <button
                        type="button"
                        onClick={() => {
                          setMovingNoteObj(null);
                          setIsFolderModalOpen(true);
                        }}
                        className="w-full py-2.5 rounded-xl bg-[#007AFF]/10 text-[#007AFF] font-semibold text-[14px]"
                      >
                        + Crear primera carpeta
                      </button>
                    )}
                  </div>
                </div>

                  value={customNotesList.find(n => n.id === activeProgram)?.title || ''}
                  onChange={handleUpdateCustomNoteTitle}
                  className="w-full text-[32px] font-bold tracking-tight mb-1 px-1 text-black dark:text-white bg-transparent focus:outline-none placeholder-[#8E8E93]"
                  placeholder="Título de la nota..."
                />
                <div className="flex items-center justify-between px-1 mb-2">
                  {customNotesList.find(n => n.id === activeProgram)?.createdAt && (
                    <p className="text-[12px] text-[#8E8E93] font-medium">
                      Creada el {formatNoteDate(customNotesList.find(n => n.id === activeProgram)?.createdAt)}
                    </p>
                  )}
                  <button
                    type="button"
                    onClick={() => setMovingNoteObj(customNotesList.find(n => n.id === activeProgram))}
                    className="text-[12px] font-semibold text-[#007AFF] bg-[#007AFF]/10 px-3 py-1 rounded-full"
                  >
                    📁 {foldersList.find(f => f.id === customNotesList.find(n => n.id === activeProgram)?.folderId)?.name || 'Mover a carpeta'}
                  </button>
                </div>
                <RichNoteEditor 
                  id={activeProgram} 
                  value={notes[activeProgram] || ''} 
                  onChange={(val) => handleNoteChange(activeProgram, val)} 
                  placeholder="Empieza a escribir tu nota..." 
                  fontSize={fontSize}
                  isCustomNote={true}
                  syncVersion={importVersion}
                />
              </div>
            )}
          </main>

          {/* ÚNICO MENÚ LATERAL UNIFICADO */}
          {isDrawerOpen && (
            <div className="fixed inset-0 z-50 flex items-stretch justify-start">
              <div className="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onClick={() => setIsDrawerOpen(false)}></div>
              <div className="bg-[#F2F2F7] dark:bg-[#1C1C1E] w-[84%] max-w-sm shadow-2xl z-10 animate-slide-right flex flex-col">
                <div className="p-6 pt-10 border-b border-[#C6C6C8]/50 dark:border-[#38383A] bg-white dark:bg-[#2C2C2E]">
                  <div className="w-14 h-14 bg-[#007AFF]/10 text-[#007AFF] rounded-full flex items-center justify-center mb-3 mx-auto">
                    <Cloud size={28} />
                  </div>
                  <h3 className="text-center font-semibold text-[19px] text-black dark:text-white">Mis Apuntes</h3>
                  <p className="text-center text-[13px] text-[#8E8E93]">Guardado automático en este dispositivo</p>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-6">
                  <div>
                    <h4 className="text-[#8E8E93] text-[13px] uppercase tracking-wider font-semibold mb-2 px-2">Navegación</h4>
                    <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden divide-y divide-[#C6C6C8]/30 dark:divide-[#38383A]">
                      <button
                        onClick={() => {
                          setIsDrawerOpen(false);
                          setCurrentScreen('notes_home');
                          setActiveProgram(null);
                        }}
                        className="w-full flex items-center justify-between p-3.5 text-left active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg bg-[#007AFF]/15 text-[#007AFF] flex items-center justify-center">
                            <FolderIcon size={18} />
                          </div>
                          <span className="text-[16px] font-medium text-black dark:text-white">Mis apuntes</span>
                        </div>
                        <span className="text-[14px] font-semibold text-[#8E8E93]">
                          {customNotesList.filter(n => !archivedItems[n.id] && !deletedItems[n.id]).length}
                        </span>
                      </button>

                      <button
                        onClick={() => {
                          setIsDrawerOpen(false);
                          setCurrentScreen('assemblies');
                          setActiveProgram(null);
                        }}
                        className="w-full flex items-center justify-between p-3.5 text-left active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg bg-[#FF9500]/15 text-[#FF9500] flex items-center justify-center">
                            <CalendarBookIcon size={18} />
                          </div>
                          <span className="text-[16px] font-medium text-black dark:text-white">Asambleas</span>
                        </div>
                        <span className="text-[14px] font-semibold text-[#8E8E93]">
                          {allProgramsDB.filter(p => !archivedItems[p.id] && !deletedItems[p.id]).length}
                        </span>
                      </button>

                      <button
                        onClick={() => {
                          setIsDrawerOpen(false);
                          pdfInputRef.current && pdfInputRef.current.click();
                        }}
                        className="w-full flex items-center justify-between p-3.5 text-left active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg bg-[#34C759]/15 text-[#34C759] flex items-center justify-center">
                            <FileSparklesIcon size={18} />
                          </div>
                          <span className="text-[15px] font-semibold text-[#34C759]">Crear apuntes de Programa de Asamblea</span>
                        </div>
                      </button>

                      <button
                        onClick={() => {
                          setIsDrawerOpen(false);
                          setCurrentScreen('archive');
                          setActiveProgram(null);
                        }}
                        className="w-full flex items-center justify-between p-3.5 text-left active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg bg-[#5856D6]/15 text-[#5856D6] flex items-center justify-center">
                            <AppleArchiveIcon size={18} />
                          </div>
                          <span className="text-[16px] font-medium text-black dark:text-white">Archivo</span>
                        </div>
                        <span className="text-[14px] font-semibold text-[#8E8E93]">{totalArchivedCount}</span>
                      </button>
                    </div>
                  </div>

                  <div>
                    <h4 className="text-[#8E8E93] text-[13px] uppercase tracking-wider font-semibold mb-2 px-2">Apariencia</h4>
                    <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden">
                      <div className="flex justify-between items-center p-3.5 border-b border-[#C6C6C8]/30 dark:border-[#38383A]">
                        <span className="text-[16px] text-black dark:text-white">Modo Oscuro</span>
                        <button onClick={toggleDarkMode} className={`w-12 h-7 rounded-full transition-colors relative ${isDarkMode ? 'bg-[#34C759]' : 'bg-[#E5E5EA] dark:bg-[#3A3A3C]'}`}>
                          <div className={`w-6 h-6 bg-white rounded-full absolute top-0.5 transition-transform ${isDarkMode ? 'translate-x-5' : 'translate-x-0.5'} shadow-sm`}></div>
                        </button>
                      </div>
                      <div className="flex justify-between items-center p-3.5">
                        <span className="text-[16px] text-black dark:text-white">Tamaño de letra</span>
                        <div className="flex items-center gap-2">
                          <button onClick={decreaseFontSize} className="w-8 h-8 rounded-lg bg-[#F2F2F7] dark:bg-[#3A3A3C] font-semibold flex items-center justify-center text-black dark:text-white active:opacity-50">A-</button>
                          <span className="font-semibold text-[15px] w-6 text-center text-black dark:text-white">{fontSize}</span>
                          <button onClick={increaseFontSize} className="w-8 h-8 rounded-lg bg-[#F2F2F7] dark:bg-[#3A3A3C] font-semibold flex items-center justify-center text-black dark:text-white active:opacity-50">A+</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div>
                    <h4 className="text-[#8E8E93] text-[13px] uppercase tracking-wider font-semibold mb-2 px-2">Notas y Respaldo</h4>
                    <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden divide-y divide-[#C6C6C8]/30 dark:divide-[#38383A]">
                      <button
                        onClick={handleExportBackup}
                        className="w-full flex items-center gap-3 p-3.5 text-left text-[#007AFF] font-medium text-[16px] active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <Download size={19} />
                        <span>Exportar mis notas</span>
                      </button>
                      <button
                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                        className="w-full flex items-center gap-3 p-3.5 text-left text-[#007AFF] font-medium text-[16px] active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <Upload size={19} />
                        <span>Importar mis notas</span>
                      </button>
                      <button
                        onClick={handleExportPDF}
                        className="w-full flex items-center gap-3 p-3.5 text-left text-[#007AFF] font-medium text-[16px] active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <span>Exportar como PDF</span>
                      </button>
                    </div>
                  </div>

                  {deferredPrompt && (
                    <button
                      onClick={handleInstallClick}
                      className="w-full bg-[#007AFF] text-white font-semibold text-[16px] p-3.5 rounded-xl active:bg-[#0062CC] transition-colors text-center shadow-sm"
                    >
                      Instalar Aplicación en el celular
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:') && window.location.origin !== 'null' && !window.location.hostname.includes('usercontent.goog')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
