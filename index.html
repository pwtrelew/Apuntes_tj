                          {item.type === 'symposium' && item.parts && (
                            <div className="mt-2.5 pl-4 space-y-3">
                              {item.parts.map((part) => (
                                <div key={part.id} className="py-0.5">
                                  <div
                                    onClick={() => toggleItem(part.id)}
                                    className="flex items-start justify-between gap-3 cursor-pointer select-none active:opacity-70 transition-opacity"
                                  >
                                    <div className="text-[17px] leading-snug text-black dark:text-white flex-1">
                                      {part.title}
                                    </div>
                                    {expandedItems[part.id]
                                      ? <ChevronUp size={18} className="text-[#8E8E93] shrink-0 mt-1" />
                                      : <ChevronDown size={18} className="text-[#8E8E93] shrink-0 mt-1" />
                                    }
                                  </div>
                                  {expandedItems[part.id] && (
                                    <div className="mt-2">
                                      <RichNoteEditor
                                        id={part.id}
                                        value={notesRef.current[part.id] || ''}
                                        onChange={(val) => handleNoteChange(part.id, val)}
                                        placeholder="Escribe tus apuntes aquí..."
                                        fontSize={fontSize}
                                        refreshTrigger={importVersion}
                                      />
                                    </div>
                                  )}
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            {currentScreen === 'custom_note' && activeProgram && (() => {
              const currentNoteObj = customNotesList.find(n => n.id === activeProgram);
              const currentFolderObj = foldersList.find(f => f.id === currentNoteObj?.folderId);
              return (
                <div className="animate-fade-in">
                  <input 
                    type="text" 
                    value={currentNoteObj?.title || ''}
                    onChange={handleUpdateCustomNoteTitle}
                    className="w-full text-[32px] font-bold tracking-tight mb-1 px-1 text-black dark:text-white bg-transparent focus:outline-none placeholder-[#8E8E93]"
                    placeholder="Título de la nota..."
                  />
                  <div className="flex items-center justify-between px-1.5 mb-2">
                    <p className="text-[12px] text-[#8E8E93] font-medium">
                      Creada el {formatNoteDate(currentNoteObj?.createdAt || parseInt(String(activeProgram).replace('custom_', ''), 10))}
                    </p>
                    <button
                      type="button"
                      onClick={() => currentNoteObj && setMovingNoteObj(currentNoteObj)}
                      className="flex items-center gap-1.5 text-[12px] font-semibold text-[#007AFF] bg-[#007AFF]/10 px-3 py-1 rounded-full active:bg-[#007AFF]/20"
                    >
                      <FolderIcon size={13} />
                      <span>{currentFolderObj ? `Carpeta: ${currentFolderObj.name}` : 'Mover a carpeta'}</span>
                    </button>
                  </div>
                  <RichNoteEditor 
                    id={activeProgram} 
                    value={notesRef.current[activeProgram] || ''} 
                    onChange={(val) => handleNoteChange(activeProgram, val)} 
                    placeholder="Empieza a escribir tu nota..." 
                    fontSize={fontSize}
                    isCustomNote={true}
                    refreshTrigger={importVersion}
                  />
                </div>
              );
            })()}
          </main>

          {isDrawerOpen && (
            <div className="fixed inset-0 z-50 flex items-stretch justify-start">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={() => setIsDrawerOpen(false)}></div>
              <div className="bg-[#F2F2F7] dark:bg-[#1C1C1E] w-[84%] max-w-sm shadow-2xl z-10 animate-slide-right flex flex-col">
                <div className="p-6 pt-10 border-b border-[#C6C6C8]/50 dark:border-[#38383A] bg-white dark:bg-[#2C2C2E]">
                  <div className="w-14 h-14 bg-[#007AFF]/10 text-[#007AFF] rounded-full flex items-center justify-center mb-3 mx-auto">
                    <Cloud size={28} />
                  </div>
                  <h3 className="text-center font-semibold text-[19px] text-black dark:text-white">Mis Apuntes</h3>
                  <p className="text-center text-[13px] text-[#8E8E93]">Guardado automático activo</p>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-5">
                  <div>
                    <h4 className="text-[#8E8E93] text-[13px] uppercase tracking-wider font-semibold mb-2 px-2">Navegación</h4>
                    <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden divide-y divide-[#C6C6C8]/30 dark:divide-[#38383A]">
                      <button
                        onClick={() => {
                          setIsDrawerOpen(false);
                          setOpenSwipeId(null);
                          setCurrentScreen('notes_home');
                        }}
                        className="w-full flex items-center justify-between p-3.5 text-left text-[16px] font-medium text-black dark:text-white active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg bg-[#007AFF] text-white flex items-center justify-center">
                            <FolderIcon size={18} />
                          </div>
                          <span>Mis apuntes</span>
                        </div>
                        <span className="text-[14px] font-semibold text-[#8E8E93] bg-[#F2F2F7] dark:bg-[#3A3A3C] px-2.5 py-0.5 rounded-full">
                          {activeCustomNotes.length}
                        </span>
                      </button>

                      <button
                        onClick={() => {
                          setIsDrawerOpen(false);
                          setOpenSwipeId(null);
                          setCurrentScreen('assemblies');
                        }}
                        className="w-full flex items-center justify-between p-3.5 text-left text-[16px] font-medium text-black dark:text-white active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg bg-[#FF9500] text-white flex items-center justify-center">
                            <CalendarBookIcon size={18} />
                          </div>
                          <span>Asambleas</span>
                        </div>
                        <span className="text-[14px] font-semibold text-[#8E8E93] bg-[#F2F2F7] dark:bg-[#3A3A3C] px-2.5 py-0.5 rounded-full">
                          {activeProgramsList.length}
                        </span>
                      </button>

                      <button
                        onClick={() => {
                          setIsDrawerOpen(false);
                          setIsPdfModalOpen(true);
                        }}
                        className="w-full flex items-center justify-between p-3.5 text-left text-[15px] font-semibold text-[#E5854B] active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg bg-[#E5854B]/15 text-[#E5854B] flex items-center justify-center">
                            <FileTextIcon size={18} />
                          </div>
                          <span>Crear apuntes de Programa de Asamblea</span>
                        </div>
                      </button>

                      <button
                        onClick={() => {
                          setIsDrawerOpen(false);
                          setOpenSwipeId(null);
                          setCurrentScreen('archive');
                        }}
                        className="w-full flex items-center justify-between p-3.5 text-left text-[16px] font-medium text-black dark:text-white active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors"
                      >
                        <div className="flex items-center gap-3">
                          <div className="w-8 h-8 rounded-lg bg-[#5856D6] text-white flex items-center justify-center">
                            <AppleArchiveIcon size={18} />
                          </div>
                          <span>Archivo</span>
                        </div>
                        <span className="text-[14px] font-semibold text-[#8E8E93] bg-[#F2F2F7] dark:bg-[#3A3A3C] px-2.5 py-0.5 rounded-full">
                          {totalArchivedCount}
                        </span>
                      </button>
                    </div>
                  </div>

                  <div>
                    <h4 className="text-[#8E8E93] text-[13px] uppercase tracking-wider font-semibold mb-2 px-2">Apariencia</h4>
                    <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden divide-y divide-[#C6C6C8]/30 dark:divide-[#38383A]">
                      <div className="flex justify-between items-center p-3.5">
                        <span className="text-[16px] text-black dark:text-white">Modo Oscuro</span>
                        <button onClick={toggleDarkMode} className={`w-12 h-7 rounded-full transition-colors relative ${isDarkMode ? 'bg-[#34C759]' : 'bg-[#E5E5EA] dark:bg-[#3A3A3C]'}`}>
                          <div className={`w-6 h-6 bg-white rounded-full absolute top-0.5 transition-transform ${isDarkMode ? 'translate-x-5' : 'translate-x-0.5'} shadow-sm`}></div>
                        </button>
                      </div>
                      <div className="flex justify-between items-center p-3.5">
                        <span className="text-[16px] text-black dark:text-white">Tamaño de letra</span>
                        <div className="flex items-center gap-2.5">
                          <button onClick={decreaseFontSize} className="w-9 h-8 rounded-lg bg-[#F2F2F7] dark:bg-[#3A3A3C] font-semibold flex items-center justify-center active:opacity-50 text-black dark:text-white">A-</button>
                          <span className="font-semibold text-[15px] w-7 text-center text-black dark:text-white">{fontSize}</span>
                          <button onClick={increaseFontSize} className="w-9 h-8 rounded-lg bg-[#F2F2F7] dark:bg-[#3A3A3C] font-semibold flex items-center justify-center active:opacity-50 text-black dark:text-white">A+</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div>
                    <h4 className="text-[#8E8E93] text-[13px] uppercase tracking-wider font-semibold mb-2 px-2">Notas y Exportación</h4>
                    <div className="bg-white dark:bg-[#2C2C2E] rounded-xl overflow-hidden divide-y divide-[#C6C6C8]/30 dark:divide-[#38383A]">
                      <button onClick={handleExportBackup} className="w-full flex items-center gap-3 p-3.5 text-left text-[15px] font-medium text-[#007AFF] active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors">
                        <Download size={18} />
                        <span>Exportar mis notas</span>
                      </button>
                      <button onClick={() => fileInputRef.current?.click()} className="w-full flex items-center gap-3 p-3.5 text-left text-[15px] font-medium text-[#007AFF] active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors">
                        <Upload size={18} />
                        <span>Importar mis notas</span>
                      </button>
                      <button onClick={handleExportPDF} className="w-full flex items-center gap-3 p-3.5 text-left text-[15px] font-medium text-[#007AFF] active:bg-[#E5E5EA] dark:active:bg-[#3A3A3C] transition-colors">
                        <Download size={18} />
                        <span>Exportar como PDF</span>
                      </button>
                    </div>
                  </div>

                  {deferredPrompt && (
                    <button onClick={handleInstallClick} className="w-full bg-[#007AFF] text-white font-semibold text-[16px] p-3.5 rounded-xl active:bg-[#0062CC] transition-colors text-center shadow-sm">
                      Instalar Aplicación en el celular
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const mountApplication = () => {
      const rootElement = document.getElementById('root');
      if (!rootElement) return;
      rootElement.innerHTML = '';
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mountApplication);
    } else {
      mountApplication();
    }
  </script>
</body>
</html>
